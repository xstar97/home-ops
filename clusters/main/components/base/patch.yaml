---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: not-used
spec:
  interval: 30m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  timeout: 25m
  values:
    credentials:
      cf-restic:
        type: s3
        url: "${CF_S3_RESTIC_URL}"
        # bucket: "${CF_S3_RESTIC_BUCKET}-.metadata.name"
        accessKey: "${CF_S3_RESTIC_ID}"
        secretKey: "${CF_S3_RESTIC_KEY}"
        encrKey: "${CF_S3_RESTIC_KEY}"
      rfs-restic:
        type: s3
        url: "${RUSTFS_S3_RESTIC_URL}"
        # bucket: "${RUSTFS_S3_RESTIC_BUCKET}-.metadata.name"
        accessKey: "${RUSTFS_S3_RESTIC_ID}"
        secretKey: "${RUSTFS_S3_RESTIC_KEY}"
        encrKey: "${RUSTFS_S3_RESTIC_KEY}"
