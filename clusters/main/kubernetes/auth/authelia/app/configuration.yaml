# yaml-language-server: $schema=https://www.authelia.com/schemas/v4.39/json-schema/configuration.json

session:
  cookies:
    - domain: '${DOMAIN_2}'
      authelia_url: 'https://auth.${DOMAIN_2}'
      default_redirection_url: 'https://homepage.${DOMAIN_2}'
      expiration: 24h
      inactivity: 60m
      name: authelia_session

access_control:
  default_policy: deny
  rules:
    # Bypass authentication for Grocy API.
    - domain:
        - 'grocy.${DOMAIN_2}'
      policy: bypass
      resources:
        - '^/api/.*$'

    # Require one-factor authentication for all groups.
    - domain:
        - '*.${DOMAIN_2}'
        - '${DOMAIN_2}'
      policy: one_factor
      # subject:
      #  - 'group:lldap_admin'

identity_providers:
  oidc:
    lifespans:
      access_token: 1h
      authorize_code: 1m
      id_token: 1h
      refresh_token: 90m

    enable_client_debug_messages: true
    enforce_pkce: public_clients_only

    cors:
      endpoints:
        - authorization
        - token
        - userinfo
      allowed_origins_from_client_redirect_uris: true

    claims_policies:
      default:
        id_token:
          - email
          - email_verified
          - alt_emails
          - groups
          - name
          - preferred_username
          - nickname

      romm:
        id_token:
          - email
          - email_verified
          - groups
          - name
          - preferred_username

      homelable:
        id_token:
          - email
          - email_verified
          - groups
          - name
          - preferred_username

      ggrequestz:
        id_token:
          - email
          - email_verified
          - groups
          - name
          - preferred_username

      grafana:
        id_token:
          - email
          - email_verified
          - groups
          - name
          - preferred_username

      yarnl:
        id_token:
          - email
          - email_verified
          - groups
          - name
          - preferred_username

      homebox:
        id_token:
          - email
          - email_verified
          - groups
          - name
          - preferred_username

      profilarr:
        id_token:
          - email
          - email_verified
          - groups
          - name
          - preferred_username

      hass:
        id_token:
          - email
          - email_verified
          - groups
          - name
          - preferred_username

      ytptube:
        id_token:
          - email
          - email_verified
          - groups
          - name
          - preferred_username

      renovate_operator:
        id_token:
          - email
          - email_verified
          - groups
          - name
          - preferred_username
  
      audiobookrequest:
        id_token:
          - 'email'
          - 'groups'
          - 'name'
          - 'preferred_username'

    hmac_secret: '{{ secret "/config/secret/hmac_secret" }}'

    # Schema warning is expected because the schema cannot evaluate
    # the Authelia template to the resulting PEM value.
    jwks:
      - key: |
          {{ secret "/config/secret/jwks_key.pem" | mindent 10 "|" | msquote }}

    authorization_policies:
      admin:
        default_policy: deny
        rules:
          - policy: one_factor
            subject:
              - 'group:lldap_admin'

      romm:
        default_policy: deny
        rules:
          - policy: one_factor
            subject:
              - 'group:lldap_admin'
              - 'group:lldap_romm'

      ggrequestz:
        default_policy: deny
        rules:
          - policy: one_factor
            subject:
              - 'group:lldap_admin'
              - 'group:lldap_ggrequestz_manager'
              - 'group:lldap_ggrequestz_viewer'

      grafana:
        default_policy: deny
        rules:
          - policy: one_factor
            subject:
              - 'group:lldap_admin'
              - 'group:lldap_grafana'

      paperless:
        default_policy: deny
        rules:
          - policy: one_factor
            subject:
              - 'group:lldap_admin'
              - 'group:lldap_paperless'

      actual:
        default_policy: deny
        rules:
          - policy: one_factor
            subject:
              - 'group:lldap_admin'
              - 'group:lldap_actual'

      vaultwarden:
        default_policy: deny
        rules:
          - policy: one_factor
            subject:
              - 'group:lldap_admin'
              - 'group:lldap_vaultwarden'

      wallos:
        default_policy: deny
        rules:
          - policy: one_factor
            subject:
              - 'group:lldap_admin'
              - 'group:lldap_wallos'

      audiobookrequest:
        default_policy: deny
        rules:
          - policy: one_factor
            subject:
              - 'group:lldap_admin'
              - 'group:lldap_audiobookrequest'

      yarnl:
        default_policy: deny
        rules:
          - policy: one_factor
            subject:
              - 'group:lldap_admin'
              - 'group:lldap_yarnl'

      kavita:
        default_policy: deny
        rules:
          - policy: one_factor
            subject:
              - 'group:lldap_admin'
              - 'group:lldap_kavita'

      homebox:
        default_policy: deny
        rules:
          - policy: one_factor
            subject:
              - 'group:lldap_admin'
              - 'group:lldap_homebox'

      homelable:
        default_policy: deny
        rules:
          - policy: one_factor
            subject:
              - 'group:lldap_admin'
              - 'group:lldap_homelable'

      profilarr:
        default_policy: deny
        rules:
          - policy: one_factor
            subject:
              - 'group:lldap_admin'
              - 'group:lldap_profilarr'

      hass:
        default_policy: deny
        rules:
          - policy: one_factor
            subject:
              - 'group:lldap_admin'
              - 'group:lldap_hass'

      ytptube:
        default_policy: deny
        rules:
          - policy: one_factor
            subject:
              - 'group:lldap_admin'
              - 'group:lldap_ytptube'

      renovate_operator:
        default_policy: deny
        rules:
          - policy: one_factor
            subject:
              - 'group:lldap_admin'

    clients:
      - client_id: 'romm'
        client_name: 'RomM'
        client_secret: '{{ secret "/config/secret/clients_romm_client_secret" }}'
        public: false
        claims_policy: 'romm'
        authorization_policy: 'romm'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris:
          - 'https://romm.${DOMAIN_2}/api/oauth/openid'
        scopes:
          - openid
          - profile
          - email
        token_endpoint_auth_method: 'client_secret_post'

      - client_id: 'yarnl'
        client_name: 'YARNL'
        client_secret: '{{ secret "/config/secret/clients_yarnl_client_secret" }}'
        public: false
        claims_policy: 'yarnl'
        authorization_policy: 'yarnl'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris:
          - 'https://yarnl.${DOMAIN_2}/oauth/callback'
        scopes:
          - openid
          - profile
          - email
        token_endpoint_auth_method: 'client_secret_post'

      - client_id: 'ggrequestz'
        client_name: 'GGRequestz'
        client_secret: '{{ secret "/config/secret/clients_ggrequestz_client_secret" }}'
        public: false
        claims_policy: 'ggrequestz'
        authorization_policy: 'ggrequestz'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris:
          - 'https://ggrequestz.${DOMAIN_2}/oauth2/callback'
        scopes:
          - openid
          - profile
          - email
        token_endpoint_auth_method: 'client_secret_post'

      - client_id: 'grafana'
        client_name: 'Grafana'
        client_secret: '{{ secret "/config/secret/clients_grafana_client_secret" }}'
        public: false
        claims_policy: 'grafana'
        authorization_policy: 'grafana'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris:
          - 'https://grafana.${DOMAIN_2}/login/generic_oauth'
        scopes:
          - openid
          - profile
          - email
        token_endpoint_auth_method: 'client_secret_post'

      - client_id: 'paperless'
        client_name: 'Paperless'
        client_secret: '{{ secret "/config/secret/clients_paperless_client_secret" }}'
        public: false
        claims_policy: 'default'
        authorization_policy: 'paperless'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris:
          - 'https://paperless.${DOMAIN_2}/accounts/oidc/authelia/login/callback/'
        scopes:
          - openid
          - profile
          - email
        token_endpoint_auth_method: 'client_secret_post'

      - client_id: 'actual-budget'
        client_name: 'Actual Budget'
        client_secret: '{{ secret "/config/secret/clients_actual_budget_client_secret" }}'
        public: false
        claims_policy: 'default'
        authorization_policy: 'actual'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris:
          - 'https://actual.${DOMAIN_2}/openid/callback'
        scopes:
          - openid
          - profile
          - email
        token_endpoint_auth_method: 'client_secret_post'

      - client_id: 'vaultwarden'
        client_name: 'Vaultwarden'
        client_secret: '{{ secret "/config/secret/clients_vaultwarden_client_secret" }}'
        public: false
        claims_policy: 'default'
        authorization_policy: 'vaultwarden'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris:
          - 'https://vaultwarden.${DOMAIN_2}/identity/connect/oidc-signin'
        scopes:
          - openid
          - profile
          - email
        token_endpoint_auth_method: 'client_secret_post'

      - client_id: 'wallos'
        client_name: 'Wallos'
        client_secret: '{{ secret "/config/secret/clients_wallos_client_secret" }}'
        public: false
        claims_policy: 'default'
        authorization_policy: 'wallos'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris:
          - 'https://wallos.${DOMAIN_2}/api/oauth/oidc/callback'
        scopes:
          - openid
          - profile
          - email
        token_endpoint_auth_method: 'client_secret_post'

      - client_id: 'audiobookrequest' 
        client_name: 'AudioBookRequest'
        client_secret: '{{ secret "/config/secret/clients_abr_client_secret" }}'
        public: false
        authorization_policy: 'audiobookrequest'
        require_pkce: 'false'
        redirect_uris:
          - 'https://abr.${DOMAIN_2}/auth/oidc'
        scopes:
          - 'openid'
          - 'profile'
          - 'groups'
          - 'email'
        response_types:
          - 'code'
        grant_types:
          - 'authorization_code'
        access_token_signed_response_alg: 'none'
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: 'client_secret_post'

      - client_id: 'kavita'
        client_name: 'Kavita'
        client_secret: '{{ secret "/config/secret/clients_kavita_client_secret" }}'
        public: false
