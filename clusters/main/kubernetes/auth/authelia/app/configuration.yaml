        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris:
          - 'https://kavita.${DOMAIN_2}/signin-oidc'
        scopes:
          - openid
          - profile
          - email
        token_endpoint_auth_method: 'client_secret_post'

      - client_id: 'homebox'
        client_name: 'Homebox'
        client_secret: '{{ secret "/config/secret/clients_homebox_client_secret" }}'
        public: false
        claims_policy: 'homebox'
        authorization_policy: 'homebox'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris:
          - 'https://homebox.${DOMAIN_2}/auth/oidc/callback'
        scopes:
          - openid
          - profile
          - email
        token_endpoint_auth_method: 'client_secret_post'

      - client_id: 'profilarr'
        client_name: 'Profilarr'
        client_secret: '{{ secret "/config/secret/clients_profilarr_client_secret" }}'
        public: false
        claims_policy: 'profilarr'
        authorization_policy: 'profilarr'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris:
          - 'https://profilarr.${DOMAIN_2}/api/auth/oidc/callback'
        scopes:
          - openid
          - profile
          - email
        token_endpoint_auth_method: 'client_secret_post'

      - client_id: 'homelable'
        client_name: 'HomeLABLE'
        client_secret: '{{ secret "/config/secret/clients_homelable_client_secret" }}'
        public: false
        claims_policy: 'homelable'
        authorization_policy: 'homelable'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris:
          - 'https://homelable.${DOMAIN_0}/oauth2/callback'
        scopes:
          - openid
          - profile
          - email
        token_endpoint_auth_method: 'client_secret_post'

      - client_id: 'homeassistant'
        client_name: 'Home Assistant'
        client_secret: '{{ secret "/config/secret/clients_hass_client_secret" }}'
        public: false
        claims_policy: 'hass'
        authorization_policy: 'hass'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris:
          - 'https://homeassistant.${DOMAIN_0}/auth/oidc/callback'
        scopes:
          - openid
          - profile
          - email
        token_endpoint_auth_method: 'client_secret_post'

      - client_id: 'ytptube'
        client_name: 'YTPtTube'
        client_secret: '{{ secret "/config/secret/clients_ytptube_client_secret" }}'
        public: false
        claims_policy: 'ytptube'
        authorization_policy: 'ytptube'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris:
