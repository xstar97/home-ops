apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ggrequestz
  namespace: ggrequestz
spec:
  interval: 30m
  timeout: 25m
  maxHistory: 3
  # enabled | warn
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: app-template
      version: 18.16.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      stopAll: false
    gatus:
      group: games
    credentials:
      cf-restic:
        bucket: "${CF_S3_RESTIC_BUCKET}-ggrequestz"
      rfs-restic:
        bucket: "${CF_S3_RESTIC_BUCKET}-ggrequestz"
    image:
      repository: ghcr.io/xtreemmak/ggrequestz
      pullPolicy: IfNotPresent
      tag: 1.3.0@sha256:a80559ce491e6e45158bf4e224eb6284ffca9c37c4b3f7b3b04bc370e077372a
    securityContext:
      container:
        runAsUser: 0
        runAsGroup: 0
        runAsNonRoot: false
        readOnlyRootFilesystem: false
    service:
      main:
        type: ClusterIP
        ports:
          main:
            port: 3000
    workload:
      main:
        podSpec:
          containers:
            main:
              probes:
                liveness:
                  enabled: true
                  type: http
                  path: /api/health
                readiness:
                  enabled: true
                  type: http
                  path: /api/health
                startup:
                  enabled: true
                  type: http
                  path: /api/health
              env:
                # PM2_INSTANCES: 1
                APP_PORT: "{{ .Values.service.main.ports.main.port }}"
                ORIGIN: "{{ .Values.chartContext.appUrl }}"
                # Database Configuration
                POSTGRES_HOST:
                  secretKeyRef:
                    name: cnpg-main-urls
                    key: host
                POSTGRES_PORT: 5432
                POSTGRES_DB: "{{ .Values.cnpg.main.database }}"
                POSTGRES_USER: "{{ .Values.cnpg.main.user }}"
                POSTGRES_PASSWORD:
                  secretKeyRef:
                    name: cnpg-main-user
                    key: password
                # Redis Cache (recommended for production)
                REDIS_URL:
                  secretKeyRef:
                    expandObjectName: false
                    name: '{{ printf "%s-%s" .Release.Name "rediscreds" }}'
                    key: url
                REDIS_EXTERNAL_PORT: 6379
                REDIS_MAX_MEMORY: 512mb
                # Session Secret (generate a random 64-character string for production)
                SESSION_SECRET: "${GGREQUESTZ_SESSION_SECRET}"
                # IGDB API Credentials (required for game data)
                # Get these from: https://dev.twitch.tv/console
                IGDB_CLIENT_ID: "${ROMM_IGDB_CLIENT_ID}"
                IGDB_CLIENT_SECRET: "${ROMM_IGDB_CLIENT_SECRET}"
                # Gotify Push Notifications (optional)
                # GOTIFY_URL: https://gotify.yourdomain.com
                # GOTIFY_TOKEN: your_gotify_token

                # ROMM Game Library Integration (optional)
                ROMM_SERVER_URL: http://romm.romm.svc.cluster.local:10680
                ROMM_SERVER_URL_PUBLIC: "https://romm.${DOMAIN_2}"
                ROMM_API_TOKEN: "${GGREQUESTZ_ROMM_API_TOKEN_ADMIN}"
                # ROMM_USERNAME: ""
                # ROMM_PASSWORD: ""
                # Choose authentication method: basic, oidc, oidc_generic, or authentik
                AUTH_METHOD: oidc
                # OIDC Provider Configuration
                OIDC_ISSUER_URL: https://auth.${DOMAIN_2}/.well-known/openid-configuration
                OIDC_CLIENT_ID: ggrequestz
                OIDC_CLIENT_SECRET: ${AUTHELIA_CLIENT_SECRET_GGREQUESTZ}
                OIDC_REDIRECT_URI: '{{ printf "%s/%s" .Values.chartContext.appUrl "api/auth/callback" }}'
                OIDC_PROVIDER_NAME: "Login with Authelia"
                # Optional: Custom endpoints (auto-discovered if not set)
                # OIDC_AUTH_URL: https://your-provider.com/protocol/openid-connect/auth
                # OIDC_TOKEN_URL: https://your-provider.com/protocol/openid-connect/token
                # OIDC_USERINFO_URL: https://your-provider.com/protocol/openid-connect/userinfo

                # Optional: Additional scopes
                OIDC_SCOPES: openid email profile
                OIDC_ROLE_MAP: "lldap_ggrequestz_viewer:viewer,lldap_ggrequestz_manager:manager"
                OIDC_ADMIN_GROUP: "lldap_admin:admin"
                OIDC_GROUPS_CLAIM: groups
    ingress:
      main:
        enabled: true
        ingressClassName: "external"
        hosts:
          - host: ggrequestz.${DOMAIN_2}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          nginx:
            enabled: true
          certManager:
            enabled: true
            certificateIssuer: general-le-prod
    redis:
      enabled: true
    cnpg:
      main:
        enabled: true
        user: ggrequestz
        database: ggrequestz
        mode: recovery
        cluster:
          singleNode: true
        backups:
          enabled: true
          credentials: cf-restic
          retentionPolicy: "7d"
          scheduledBackups:
            - name: daily-backup
              # https://crontab.guru/#50_0_*_*_*
              schedule: "55 0 * * *"
              backupOwnerReference: self
              immediate: true
              suspend: false
        recovery:
          method: object_store
          credentials: cf-restic
