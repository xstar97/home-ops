apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pokesim
  namespace: pokesim
spec:
  interval: 30m
  timeout: 25m
  maxHistory: 3
  # enabled | warn
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: app-template
      version: 18.23.5
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      stopAll: false
    gatus:
      group: games
    credentials:
      cf-restic:
        bucket: "${CF_S3_RESTIC_BUCKET}-pokesim"
      rfs-restic:
        bucket: "${CF_S3_RESTIC_BUCKET}-pokesim"
    image:
      repository: ghcr.io/afk-sapien/pokesim
      tag: 0.4.20@sha256:a4dc7c6e231dd21e134707f1a97d1412203ddbddd85481e6e3d07282b910955f
      pullPolicy: IfNotPresent
    securityContext:
      container:
        readOnlyRootFilesystem: false
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
    service:
      main:
        type: ClusterIP
        ports:
          main:
            port: 8000
    workload:
      main:
        podSpec:
          initContainers:
            microcheck:
              type: install
              enabled: true
              imageSelector: "alpineImage"
              command:
                - /bin/sh
                - -c
                - |
                  apk add --no-cache wget
                  wget -qO /data/httpcheck https://github.com/tarampampam/microcheck/releases/download/v1.4.0/httpcheck-linux-amd64
                  chmod +x /data/httpcheck
          containers:
            main:
              probes:
                liveness:
                  enabled: false
                  type: exec
                  command:
                    - /data/httpcheck
                    - http://127.0.0.1:{{ .Values.service.main.ports.main.port }}/health/live
                readiness:
                  enabled: false
                  type: exec
                  command:
                    - /data/httpcheck
                    - http://127.0.0.1:{{ .Values.service.main.ports.main.port }}/health/ready
                startup:
                  enabled: true
                  type: tcp
              args:
              - python 
              - -m 
              - pokesim
              - serve
              - --data-dir
              - /data
              - --host
              - 0.0.0.0
              env:
                # application settings
                PORT: "{{ .Values.service.main.ports.main.port }}"
                HOST: 0.0.0.0
                PUBLIC_URL: "{{ .Values.chartContext.appUrl }}"
                ROM_PATH: /roms/pokered.gb
                SPEED: "2"
                VIEWER_ONLY: "1"
    ingress:
      main:
        enabled: true
        ingressClassName: "external"
        hosts:
          - host: pokesim.${DOMAIN_2}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          nginx:
            enabled: true
            auth:
              type: "authelia"
              internalHost: "authelia.authelia.svc.cluster.local:9091"
              externalHost: "auth.${DOMAIN_2}"
          certManager:
            enabled: true
            certificateIssuer: general-le-prod
    persistence:
      data:
        enabled: true
        mountPath: /data
        targetSelectAll: true
        volsync:
          - name: data
            type: restic
            credentials: cf-restic
            dest:
              enabled: true
            src:
              enabled: true
      roms:
        enabled: true
        mountPath: /roms
        targetSelectAll: true
        volsync:
          - name: roms
            type: restic
            credentials: cf-restic
            dest:
              enabled: true
            src:
              enabled: true

    addons:
      codeserver:
        enabled: false
        service:
          type: "ClusterIP"
          ports:
            codeserver:
              port: 36107
        ingress:
          enabled: true
          ingressClassName: "internal"
          hosts:
            - host: editor.pokesim.${DOMAIN_2}
              paths:
                - path: /
                  pathType: Prefix
          integrations:
            nginx:
              enabled: true
              auth:
                type: "authelia"
                internalHost: "authelia.authelia.svc.cluster.local:9091"
                externalHost: "auth.${DOMAIN_2}"
            certManager:
              enabled: true
              certificateIssuer: general-le-prod
