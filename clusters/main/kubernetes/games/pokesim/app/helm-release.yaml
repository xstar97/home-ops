apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pokesim
  namespace: pokesim
spec:
  interval: 30m
  timeout: 25m
  maxHistory: 3
  # enabled | warn
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: app-template
      version: 18.23.3
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      stopAll: false
    gatus:
      group: games
    credentials:
      cf-restic:
        bucket: "${CF_S3_RESTIC_BUCKET}-pokesim"
      rfs-restic:
        bucket: "${CF_S3_RESTIC_BUCKET}-pokesim"
    image:
      repository: ghcr.io/afk-sapien/pokesim
      tag: 0.4.16@sha256:08086a8179193bf672481867cdaacb99a920fc98e3627cc6420b756989560c0e
      pullPolicy: IfNotPresent
    securityContext:
      container:
        readOnlyRootFilesystem: false
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
    service:
      main:
        type: ClusterIP
        ports:
          main:
            port: 8000
    workload:
      main:
        podSpec:
          containers:
            main:
              probes:
                liveness:
                  type: http
                  path: /health
                readiness:
                  type: http
                  path: /health/ready
                startup:
                  type: tcp
              args:
              - python 
              - -m 
              - pokesim
              - serve
              - --data-dir
              - /data
              - --host
              - 0.0.0.0
              env:
                # application settings
                PORT: "{{ .Values.service.main.ports.main.port }}"
                PUBLIC_URL: "{{ .Values.chartContext.appUrl }}"
    ingress:
      main:
        enabled: true
        ingressClassName: "external"
        hosts:
          - host: pokesim.${DOMAIN_2}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          nginx:
            enabled: true
          certManager:
            enabled: true
            certificateIssuer: general-le-prod
    persistence:
      data:
        enabled: true
        mountPath: /data
        volsync:
          - name: data
            type: restic
            credentials: cf-restic
            dest:
              enabled: true
            src:
              enabled: true
