apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pokesim
  namespace: pokesim
spec:
  interval: 30m
  timeout: 25m
  maxHistory: 3
  # enabled | warn
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: app-template
      version: 18.23.3
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      stopAll: false
    gatus:
      group: games
    credentials:
      cf-restic:
        bucket: "${CF_S3_RESTIC_BUCKET}-pokesim"
      rfs-restic:
        bucket: "${CF_S3_RESTIC_BUCKET}-pokesim"
    image:
      repository: ghcr.io/afk-sapien/pokesim
      tag: 0.4.16@sha256:08086a8179193bf672481867cdaacb99a920fc98e3627cc6420b756989560c0e
      pullPolicy: IfNotPresent
    securityContext:
      container:
        readOnlyRootFilesystem: false
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
    service:
      main:
        type: ClusterIP
        ports:
          main:
            port: 8000
    workload:
      main:
        podSpec:
          initContainers:
            download-rom:
              enabled: false
              type: init
              image:
                repository: curlimages/curl
                tag: "8.22.0"
                pullPolicy: IfNotPresent
              securityContext:
                runAsUser: 0
                runAsGroup: 0
              command:
                - /bin/sh
                - -ec
                - |
                  ROMM_URL="http://romm.romm.svc.cluster.local:10680"

                  mkdir -p /roms

                  echo "Looking up Pokémon Red in RomM..."
                  # create ROMM_TOKEN
                  ROM_JSON="$(
                    curl \
                      --fail \
                      --silent \
                      --show-error \
                      -H "Authorization: Bearer ${ROMM_TOKEN}" \
                      "${ROMM_URL}/api/roms?search=Pokemon%20Red"
                  )"

                  ROM_ID="$(
                    echo "${ROM_JSON}" |
                      sed -n 's/.*"id":[[:space:]]*\([0-9][0-9]*\).*/\1/p' |
                      head -n 1
                  )"

                  if [ -z "${ROM_ID}" ]; then
                    echo "ERROR: Could not find Pokémon Red in RomM"
                    exit 1
                  fi

                  echo "Found Pokémon Red with RomM ID ${ROM_ID}"

                  curl \
                    --fail \
                    --location \
                    --silent \
                    --show-error \
                    --retry 5 \
                    --retry-all-errors \
                    -H "Authorization: Bearer ${ROMM_TOKEN}" \
                    "${ROMM_URL}/api/roms/${ROM_ID}/content/pokered.gb" \
                    -o /roms/pokered.gb

                  test -s /roms/pokered.gb

                  echo "Pokémon Red downloaded successfully."
          containers:
            main:
              probes:
                liveness:
                  enabled: false
                  # type: http
                  # path: /healthz
                readiness:
                  enabled: false
                  # type: http
                  # path: /healthz
                startup:
                  enabled: false
                  # type: tcp
              args:
              - python 
              - -m 
              - pokesim
              - serve
              - --data-dir
              - /data
              - --host
              - 0.0.0.0
              env:
                # application settings
                PORT: "{{ .Values.service.main.ports.main.port }}"
                HOST: 0.0.0.0
                PUBLIC_URL: "{{ .Values.chartContext.appUrl }}"
                ROM_PATH: /roms/pokered.gb
    ingress:
      main:
        enabled: true
        ingressClassName: "external"
        hosts:
          - host: pokesim.${DOMAIN_2}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          nginx:
            enabled: true
          certManager:
            enabled: true
            certificateIssuer: general-le-prod
    persistence:
      data:
        enabled: true
        mountPath: /data
        targetSelectAll: true
        volsync:
          - name: data
            type: restic
            credentials: cf-restic
            dest:
              enabled: true
            src:
              enabled: true
      roms:
        enabled: true
        mountPath: /roms
        targetSelectAll: true
        volsync:
          - name: roms
            type: restic
            credentials: cf-restic
            dest:
              enabled: true
            src:
              enabled: true

    addons:
      codeserver:
        enabled: true
        service:
          type: "ClusterIP"
          ports:
            codeserver:
              port: 36107
        ingress:
          enabled: true
          ingressClassName: "internal"
          hosts:
            - host: editor.pokesim.${DOMAIN_2}
              paths:
                - path: /
                  pathType: Prefix
          integrations:
            nginx:
              enabled: true
              auth:
                type: "authelia"
                internalHost: "authelia.authelia.svc.cluster.local:9091"
                externalHost: "auth.${DOMAIN_2}"
            certManager:
              enabled: true
              certificateIssuer: general-le-prod
