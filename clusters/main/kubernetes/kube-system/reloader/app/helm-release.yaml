---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: kube-system
spec:
  interval: 5m
  timeout: 15m
  maxHistory: 3
  # enabled | warn
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: reloader
      version: 2.2.13
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    fullnameOverride: reloader
    reloader:
      reloadOnDelete: true
      env:
        secret:
          ALERT_ON_RELOAD: true
          ALERT_SINK: "slack" # By default it will be a raw text based webhook
          ALERT_WEBHOOK_URL: "${STAKATER_RELOADER_DISCORD_URL}"
