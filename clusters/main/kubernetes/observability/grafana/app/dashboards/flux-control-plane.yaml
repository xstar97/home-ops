---
# flux-control-plane dashboard
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: flux-control-plane
  namespace: grafana
spec:
  # folderRef: gitops
  folderUID: 4012e2e70e0eab52805488de507f7964fab04d7515daff79f3f8060ba7c95a78
  instanceSelector:
    matchLabels:
      dashboards: grafana
  # renovate: depName="FluxCD"
  url: https://raw.githubusercontent.com/fluxcd/flux2-monitoring-example/refs/heads/main/monitoring/configs/dashboards/control-plane.json
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: Prometheus
