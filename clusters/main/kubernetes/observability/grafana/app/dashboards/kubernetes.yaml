---
# grafana kubernetes dashboard
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: kubernetes
  namespace: grafana
spec:
  folderRef: kubernetes
  instanceSelector:
    matchLabels:
      dashboards: grafana
  grafanaCom:
    id: 22523
    revision: 2
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: Prometheus
