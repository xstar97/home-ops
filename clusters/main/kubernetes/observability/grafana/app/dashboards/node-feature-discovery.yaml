---
# node-feature-discovery dashboard
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: node-feature-discovery
  namespace: grafana
spec:
  # folderRef: kubernetes
  folderUID: a37d07fe30048d3ae9db9a02c8c16da029bb44a586c5adaea2a1ce7be2c9d904
  instanceSelector:
    matchLabels:
      dashboards: grafana
  # renovate: depName="Node Feature Discovery" datasource=github-tags
  url: https://raw.githubusercontent.com/kubernetes-sigs/node-feature-discovery/refs/tags/v0.18.3/examples/grafana-dashboard.json
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: Prometheus
