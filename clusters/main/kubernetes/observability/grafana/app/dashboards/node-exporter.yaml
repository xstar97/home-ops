---
# node-exporter dashboard
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: node-exporter
  namespace: grafana
spec:
  folderRef: kubernetes
  instanceSelector:
    matchLabels:
      dashboards: grafana
  grafanaCom:
    # renovate: depName="Node Exporter Full"
    id: 1860
    revision: 45
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: Prometheus
