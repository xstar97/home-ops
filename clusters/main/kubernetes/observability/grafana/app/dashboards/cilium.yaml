---
# cilium dashboard
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: cilium
  namespace: grafana
spec:
  folderRef: kubernetes
  instanceSelector:
    matchLabels:
      dashboards: grafana
  grafanaCom:
    # renovate: depName="Cilium"
    id: 21431
    revision: 6
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: Prometheus
