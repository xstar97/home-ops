---
# ingress-nginx dashboard
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: nginx
  namespace: grafana
spec:
  # folderRef: kubernetes
  folderUID: a37d07fe30048d3ae9db9a02c8c16da029bb44a586c5adaea2a1ce7be2c9d904
  instanceSelector:
    matchLabels:
      dashboards: grafana
  # renovate: depName="ingress-nginx" datasource=github-tags
  url: https://raw.githubusercontent.com/kubernetes/ingress-nginx/refs/tags/ingress-nginx-3.15.2/deploy/grafana/dashboards/nginx.json
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: Prometheus
