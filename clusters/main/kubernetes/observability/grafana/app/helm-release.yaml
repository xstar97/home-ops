---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: grafana
spec:
  interval: 30m
  timeout: 25m
  maxHistory: 3
  # enabled | warn
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: grafana
      version: 24.0.1
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    gatus:
      group: observability

    global:
      stopAll: false

    credentials:
      cf-restic:
        bucket: "${CF_S3_RESTIC_BUCKET}-renovate"
      rfs-restic:
        bucket: "${RUSTFS_S3_RESTIC_BUCKET}-renovate"

    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                GF_INSTALL_PLUGINS: "yesoreyeram-infinity-datasource"
                GF_SERVER_ROOT_URL: https://grafana.${DOMAIN_2}
                GF_AUTH_DISABLE_LOGIN_FORM: true
                GF_AUTH_GENERIC_OAUTH_ENABLED: true
                GF_AUTH_GENERIC_OAUTH_NAME: Authelia
                GF_AUTH_GENERIC_OAUTH_ICON: signin
                GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
                GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "${AUTHELIA_CLIENT_GRAFANA_SECRET}"
                GF_AUTH_GENERIC_OAUTH_SCOPES: "openid profile email groups"
                GF_AUTH_GENERIC_OAUTH_EMPTY_SCOPES: false
                GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://auth.${DOMAIN_2}/api/oidc/authorization
                GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://auth.${DOMAIN_2}/api/oidc/token
                GF_AUTH_GENERIC_OAUTH_API_URL: https://auth.${DOMAIN_2}/api/oidc/userinfo
                GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
                GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: name
                GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH: groups
                GF_AUTH_GENERIC_OAUTH_USE_PKCE: true
                GF_AUTH_GENERIC_OAUTH_AUTH_STYLE: InHeader
                GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: >-
                              contains(groups[*], 'lldap_admin') && 'GrafanaAdmin' || 'Viewer'
                GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: true
                GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN: true
            dashboards:
              enabled: false
              imageSelector: sidecarImage
            datasources:
              enabled: true
              imageSelector: sidecarImage
            alerts:
              enabled: true
              imageSelector: sidecarImage
            plugins:
              enabled: true
              imageSelector: sidecarImage
            notifiers:
              enabled: true
              imageSelector: sidecarImage


    ingress:
      main:
        enabled: true
        ingressClassName: internal
        integrations:
          nginx:
            enabled: true
            auth:
              type: "authelia"
              internalHost: "authelia.authelia.svc.cluster.local:9091"
              externalHost: "auth.${DOMAIN_2}"
          homepage:
            enabled: true
            group: Monitoring
            widget:
              enabled: true
              url: http://grafana.grafana.svc.cluster.local:3000
              custom:
                version: 2
                username: "${HP_GRAFANA_USER}"
                password: "${HP_GRAFANA_PASS}"
          certManager:
            enabled: true
            certificateIssuer: general-le-prod
        hosts:
          - host: grafana.${DOMAIN_2}

    configmap:
      dashboard-provider:
        enabled: false
      datasource-loki:
        enabled: false
      config:
        enabled: true
        data:
          grafana.ini: |-
            [feature_toggles]
            grafanaAdvisor = true

            [paths]
            data = /var/lib/grafana/
            logs = /var/log/grafana
            plugins = /var/lib/grafana/plugins
            provisioning = /etc/grafana/provisioning

            [analytics]
            check_for_updates = true

            [log]
            mode = console

            [grafana_net]
            url = https://grafana.net

            [server]
            domain = "{{ if (and .Values.ingress.main.enabled .Values.ingress.main.hosts) }}{{ .Values.ingress.main.hosts | first }}{{ else }}''{{ end }}"

    persistence:
      sc-dashboard-config:
        enabled: false

    cnpg:
      main:
        mode: recovery
        cluster:
          singleNode: true
          walStorage:
            size: 10Gi
        backups:
          enabled: true
          credentials: cf-restic
          retentionPolicy: "7d"
          scheduledBackups:
            - name: daily-backup
              # https://crontab.guru/#10_0_*_*_*
              schedule: "10 0 * * *"
              backupOwnerReference: self
              immediate: true
              suspend: false
        recovery:
          method: object_store
          credentials: cf-restic
