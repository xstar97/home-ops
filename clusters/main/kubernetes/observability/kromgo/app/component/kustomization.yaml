---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
configMapGenerator:
  - name: kromgo-config-file
    namespace: kromgo
    files:
      - config.yaml=./config.yaml
generatorOptions:
  disableNameSuffixHash: true