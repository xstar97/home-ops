apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kromgo
  namespace: kromgo
spec:
  interval: 15m
  chart:
    spec:
      chart: kromgo
      version: 2.5.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    image:
      repository: ghcr.io/home-operations/kromgo
      tag: 0.12.2@sha256:33a15e6087ecfbbf9cf39f24ca418ca30738dddd5af5ec9efee1e99742f49e57
      pullPolicy: IfNotPresent
    gatus:
      group: observability
    global:
      stopAll: false
    ingress:
      main:
        enabled: true
        ingressClassName: "external"
        hosts:
          - host: kromgo.${DOMAIN_2}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          nginx:
            enabled: true
          certManager:
            enabled: true
            certificateIssuer: general-le-prod
    
    chartStatus:
      - chart: plex
        namespace: plex
        title: Plex Status
        icon: si:plex
      - chart: authelia
        namespace: authelia
        title: Authelia Status
        icon: si:authelia
      - chart: lldap
        namespace: lldap
        title: LLDAP Status
        icon: si:lldap
      - chart: vaultwarden
        namespace: vaultwarden
        title: Vaultwarden Status
        icon: si:vaultwarden    
      - chart: nginx_external
        namespace: nginx
        podRegex: nginx-external-controller.*
        title: Nginx External Status
        icon: si:nginx
        
    config:
      badges:
        # static versions
        - id: talos_version
          query: node_os_info{ name="Talos"}
          title: Talos
          icon: si:talos
          value: labels["version_id"]
        - id: kubernetes_version
          query: kubernetes_build_info{ service="kubernetes"}
          title: Kubernetes
          icon: si:kubernetes
          value: labels["git_version"]
        - id: flux_version
          query: label_replace(gotk_resource_info{exported_namespace="flux-system",name="flux",customresource_kind="Kustomization"}, "revision", "$1", "revision", "(.+)@sha256:.+")
          title: Flux
          icon: si:flux
          value: labels["revision"]

        # usage      
        - id: cluster_cpu_usage
          query: round(avg(instance:node_cpu_utilisation:rate5m{pod!=""}) * 100, 0.1)
          value: string(result) + "%"
          color: 'result < 35 ? "green" : result < 75 ? "orange" : "red"'
          title: CPU
        - id: cluster_memory_usage
          query: round(sum(node_memory_MemTotal_bytes{pod!=""} - node_memory_MemAvailable_bytes{pod!=""}) / sum(node_memory_MemTotal_bytes{pod!=""}) * 100, 0.1)
          value: string(result) + "%"
          color: 'result < 35 ? "green" : result < 75 ? "orange" : "red"'
          title: Memory
        
        # uptime
        - id: cluster_age_days
          query: round((time() - min(kube_node_created) ) / 86400)
          value: string(result) + "d"
          color: 'result < 180 ? "green" : result < 360 ? "orange" : "red"'
          title: Age
        - id: cluster_uptime_days
          query: round(avg(node_time_seconds{pod!=""} - node_boot_time_seconds{pod!=""}) / 86400)
          value: string(result) + "d"
          color: 'result < 180 ? "green" : result < 360 ? "orange" : "red"'
          title: Uptime

        # count
        - id: cluster_node_count
          query: count(count by (node) (kube_node_status_condition{condition="Ready"}))
          color: 'result > 0 ? "green" : "red"'
          title: Nodes
        - id: cluster_pod_count
          query: sum(kube_pod_status_phase{phase="Running"})
          color: 'result > 0 ? "green" : "red"'
          title: Pods
        - id: cluster_alert_count
          query: alertmanager_alerts{state="active"} - 1 # Ignore Watchdog
          color: 'result < 0 ? "green" : "red"'
          title: Alerts

    configmap:
      kromgo-configfile:
        enabled: true
        data:
          config.yaml: |            
            defaults:
                cacheSeconds: 0 # Cache-Control max-age in seconds; 0 disables caching
                badge:
                    font: go-regular # go-regular (default), go-bold, go-medium, go-mono
                    size: 11 # badge font size in points
                    style: flat # flat (default), flat-square, or plastic
                    gallery:
                        hidden: false # list badges in the gallery (default); true hides them
            {{- $.Values.config | toYaml | nindent 2 }}
            {{- range .Values.chartStatus }}
              - id: chart_status_{{ .chart }}
                query: kube_pod_status_phase{
                  namespace="{{ .namespace }}"
                  {{- if .podRegex }},pod=~"{{ .podRegex }}"{{ else }},pod!~"volsync-.*|restic-.*"{{ end }}
                } == 1
                title: {{ .title | quote }}
                icon: {{ .icon }}
                color: 'labels["phase"] == "Running" ? "green" : labels["phase"] == "Pending" ? "orange" : labels["phase"] == "Succeeded" ? "blue" : labels["phase"] == "Failed" ? "red" : "gray"'
                value: labels[?"phase"].orValue("computing...")
            {{- end }}
  
    persistence:
      configfile:
        enabled: true
        type: configmap
        readOnly: true
        objectName: kromgo-configfile
        mountPath: /config/config.yaml
        subPath: config.yaml
