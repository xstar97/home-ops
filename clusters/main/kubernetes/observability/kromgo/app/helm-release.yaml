apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kromgo
  namespace: kromgo
spec:
  interval: 30m
  timeout: 25m
  maxHistory: 3
  driftDetection:
    mode: warn
  chart:
    spec:
      chart: kromgo
      version: 2.5.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    image:
      repository: ghcr.io/home-operations/kromgo
      tag: 0.14.0@sha256:94ee0e2561048dc4637ca21b9926b76d87c15baf951678c7febb852269b7e10b
      pullPolicy: IfNotPresent
    gatus:
      group: observability
    global:
      stopAll: false
    ingress:
      main:
        enabled: true
        ingressClassName: "external"
        hosts:
          - host: kromgo.${DOMAIN_2}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          nginx:
            enabled: true
          certManager:
            enabled: true
            certificateIssuer: general-le-prod
    
    config:
      defaults:
      # Cache-Control max-age in seconds; 0 disables caching
      cacheSeconds: 0
      badge:
        # go-regular (default), go-bold, go-medium, go-mono
        font: go-regular
        # badge font size in points
        size: 11
        # flat (default), flat-square, or plastic
        style: flat
        gallery:
          # list badges in the gallery (default); true hides them
          hidden: false
      graph:
        # cap on a graph's requested window ("0" = unlimited)
        maxDuration: 1h
        # image width in px
        width: 600
        # image height in px
        height: 200
        # show the series legend
        legend: true
        # color theme — see Themes below
        theme: light
        # text font — see Themes below
        font: roboto
        gallery:
          # list graphs in the gallery (default); true hides them
          hidden: false
      badges:
        # static versions
        - id: talos_version
          query: node_os_info{ name="Talos"}
          title: Talos
          icon: si:talos
          value: labels["version_id"]
        - id: kubernetes_version
          query: kubernetes_build_info{ service="kubernetes"}
          title: Kubernetes
          icon: si:kubernetes
          value: labels["git_version"]
        - id: flux_version
          query: label_replace(gotk_resource_info{exported_namespace="flux-system",name="flux",customresource_kind="Kustomization"}, "revision", "$1", "revision", "(.+)@sha256:.+")
          title: Flux
          icon: si:flux
          value: labels["revision"]

        # usage      
        - id: cluster_cpu_usage
          query: round(avg(instance:node_cpu_utilisation:rate5m{pod!=""}) * 100, 0.1)
          value: string(result) + "%"
          color: 'result < 35 ? "green" : result < 75 ? "orange" : "red"'
          title: CPU
        - id: cluster_memory_usage
          query: round(sum(node_memory_MemTotal_bytes{pod!=""} - node_memory_MemAvailable_bytes{pod!=""}) / sum(node_memory_MemTotal_bytes{pod!=""}) * 100, 0.1)
          value: string(result) + "%"
          color: 'result < 35 ? "green" : result < 75 ? "orange" : "red"'
          title: Memory
        
        # uptime
        - id: cluster_age_days
          query: round((time() - min(kube_node_created) ) / 86400)
          value: string(result) + "d"
          color: 'result < 180 ? "green" : result < 360 ? "orange" : "red"'
          title: Age
        - id: cluster_uptime_days
          query: round(avg(node_time_seconds{pod!=""} - node_boot_time_seconds{pod!=""}) / 86400)
          value: string(result) + "d"
          color: 'result < 180 ? "green" : result < 360 ? "orange" : "red"'
          title: Uptime

        # count
        - id: cluster_node_count
          query: count(count by (node) (kube_node_status_condition{condition="Ready"}))
          color: 'result > 0 ? "green" : "red"'
          title: Nodes
        - id: cluster_pod_count
          query: sum(kube_pod_status_phase{phase="Running"})
          color: 'result > 0 ? "green" : "red"'
          title: Pods
        - id: cluster_alert_count
          query: alertmanager_alerts{state="active"} - 1 # Ignore Watchdog
          color: 'result < 0 ? "green" : "red"'
          title: Alerts

        # chart status
        - id: chart_status_plex
          query: kube_pod_status_phase{namespace="ytptube", pod!~"volsync-.*|restic-.*"} == 1
          title: Plex Status
          icon: mdi:plex
          color: 'labels["phase"] == "Running" ? "green" : labels["phase"] == "Pending" ? "orange" : labels["phase"] == "Succeeded" ? "blue" : labels["phase"] == "Failed" ? "red" : "gray"'
          value: labels[?"phase"].orValue("computing...")
        - id: chart_status_authelia
          query: kube_pod_status_phase{namespace="authelia", pod!~"volsync-.*|restic-.*"} == 1
          title: Authelia Status
          icon: si:authelia
          color: 'labels["phase"] == "Running" ? "green" : labels["phase"] == "Pending" ? "orange" : labels["phase"] == "Succeeded" ? "blue" : labels["phase"] == "Failed" ? "red" : "gray"'
          value: labels[?"phase"].orValue("computing...")
        - id: chart_status_lldap
          query: kube_pod_status_phase{namespace="lldap", pod!~"volsync-.*|restic-.*"} == 1
          title: LLDAP Status
          icon: si:authelia
          color: 'labels["phase"] == "Running" ? "green" : labels["phase"] == "Pending" ? "orange" : labels["phase"] == "Succeeded" ? "blue" : labels["phase"] == "Failed" ? "red" : "gray"'
          value: labels[?"phase"].orValue("computing...")
        - id: chart_status_vaultwarden
          query: kube_pod_status_phase{namespace="vaultwarden", pod!~"volsync-.*|restic-.*"} == 1
          title: VaultWarden Status
          icon: si:vaultwarden
          color: 'labels["phase"] == "Running" ? "green" : labels["phase"] == "Pending" ? "orange" : labels["phase"] == "Succeeded" ? "blue" : labels["phase"] == "Failed" ? "red" : "gray"'
          value: labels[?"phase"].orValue("computing...")
        - id: chart_status_nginx_external
          query: kube_pod_status_phase{namespace="nginx",pod=~"nginx-external-controller.*"} == 1
          title: Nginx External Status
          icon: si:nginx
          color: 'labels["phase"] == "Running" ? "green" : labels["phase"] == "Pending" ? "orange" : labels["phase"] == "Succeeded" ? "blue" : labels["phase"] == "Failed" ? "red" : "gray"'
          value: labels[?"phase"].orValue("computing...")
        - id: chart_status_cloudflared
          query: kube_pod_status_phase{namespace="cloudflared", pod!~"volsync-.*|restic-.*"} == 1
          title: Cloudflared Status
          icon: si:cloudflare
          color: 'labels["phase"] == "Running" ? "green" : labels["phase"] == "Pending" ? "orange" : labels["phase"] == "Succeeded" ? "blue" : labels["phase"] == "Failed" ? "red" : "gray"'
          value: labels[?"phase"].orValue("computing...")

    configmap:
      kromgo-configfile:
        enabled: true
        data:
          config.yaml: |
            {{- $.Values.config | toYaml | nindent 2 }}
    persistence:
      configfile:
        enabled: true
        type: configmap
        readOnly: true
        objectName: kromgo-configfile
        mountPath: /config/config.yaml
        subPath: config.yaml
