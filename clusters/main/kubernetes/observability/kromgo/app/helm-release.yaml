apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kromgo
  namespace: kromgo
spec:
  interval: 30m
  timeout: 25m
  maxHistory: 3
  # enabled | warn
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: kromgo
      version: 3.1.5
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      stopAll: false
    gatus:
      group: observability
    # image:
    #   repository: ghcr.io/home-operations/kromgo
    #   tag: 0.14.10@sha256:70efc194c057c834b3d4935f4fd6dd65a4ba813f097b5fffc2ace41cfa8b9ec7
    #   pullPolicy: IfNotPresent
    configsImage:
      repository: ghcr.io/home-operations/k8s-sidecar
      pullPolicy: IfNotPresent
      tag: 2.7.3@sha256:391ccddbc6b29b1b07fea530950eba68e941304ea9252084e07cf12f1687a81d

    config:
      defaults:
        badge:
          font: dejavu-sans # dejavu-sans (default, shields.io-style), dejavu-sans-bold, comic-neue, comic-neue-bold
          size: 11 # badge font size in points
          style: flat # flat (default), flat-square, or plastic
          gallery:
              hidden: false # list badges in the gallery (default); true hides them
        graph:
          maxDuration: 1h # cap on a graph's requested window ("0" = unlimited)
          width: 600 # image width in px
          height: 200 # image height in px
          legend: true # show the series legend
          theme: light # color theme — see Themes below
          font: dejavu-sans # text font — see Themes below
          gallery:
              hidden: false # list graphs in the gallery (default); true hides them
      badges:
        # static versions
        - id: talos_version
          title: Talos
          icon: si:talos
          query: node_os_info{ name="Talos"}
          valueExpr: labels["version_id"]
        - id: kubernetes_version
          title: Kubernetes
          icon: si:kubernetes
          query: kubernetes_build_info{ service="kubernetes"}
          valueExpr: labels["git_version"]
        - id: flux_version
          title: Flux
          icon: si:flux
          query: label_replace(gotk_resource_info{exported_namespace="flux-system",name="flux",customresource_kind="Kustomization"}, "revision", "$1", "revision", "(.+)@sha256:.+")
          valueExpr: labels["revision"]

        - id: os_seb_version
          title: OS
          icon: si:debian
          query: node_os_info{instance="node-seb"}
          valueExpr: labels["version"]
        - id: docker_seb_version
          title: Docker
          icon: si:docker
          query: engine_daemon_engine_info{instance="docker-seb"}
          valueExpr: labels["version"]
        - id: dc_seb_version
          title: Doco-CD
          icon: si:docker
          query: doco_cd_info{instance="doco-cd-seb"}
          valueExpr: labels["version"]
        - id: os_nas_version
          title: OS
          icon: si:debian
          query: node_os_info{instance="node-nas"}
          valueExpr: labels["version"]
        - id: docker_nas_version
          title: Docker
          icon: si:docker
          query: engine_daemon_engine_info{instance="docker-nas"}
          valueExpr: labels["version"]
        - id: dc_nas_version
          title: Doco-CD
          icon: si:docker
          query: doco_cd_info{instance="doco-cd-nas"}
          valueExpr: labels["version"]
        - id: truenas_version
          title: TrueNAS
          icon: si:truenas
          query: group by (instance, version) (label_replace(node_zfs_zpool_dataset_zil_itx_indirect_bytes{dataset=~".*/ROOT/[^/]+$"},"version","$1","dataset",".*/ROOT/([^/]+)$"))
          valueExpr: labels["version"]
        
        # power
        - id: home_lab_power
          title: HomeLab Power
          query: round(avg_over_time(ups_ups_load{ups="server-rack"}[5m]) * 9, 1)
          valueExpr: string(result) + " W"
          colorExpr: 'colorScale(result, [300.0, 450.0], ["green", "orange", "red"])'

        # usage      
        - id: cluster_cpu_usage
          title: CPU
          query: round(cluster:node_cpu:ratio_rate5m * 100, 0.1)
          valueExpr: string(result) + "%"
          colorExpr: 'colorScale(result, [35.0, 75.0], ["green", "orange", "red"])'
        - id: seb_cpu_usage
          title: CPU
          query: round(100 - (avg(rate(node_cpu_seconds_total{instance="node-seb", mode="idle"}[5m])) * 100),0.1)
          valueExpr: string(result) + "%"
          colorExpr: 'colorScale(result, [35.0, 75.0], ["green", "orange", "red"])'
        - id: nas_cpu_usage
          title: CPU
          query: round(100 - (avg(rate(node_cpu_seconds_total{instance="node-nas", mode="idle"}[5m])) * 100),0.1)
          valueExpr: string(result) + "%"
          colorExpr: 'colorScale(result, [35.0, 75.0], ["green", "orange", "red"])'
        - id: opnsense_cpu_usage
          title: CPU
          query: round(100 - cpu_usage_idle{host="router.local", cpu="cpu-total"},0.1)
          valueExpr: string(result) + "%"
          colorExpr: 'colorScale(result, [35.0, 75.0], ["green", "orange", "red"])'

        - id: cluster_memory_usage
          title: Memory
          query: round(sum(node_memory_MemTotal_bytes{instance="10.0.0.191:9100"} - node_memory_MemAvailable_bytes{instance="10.0.0.191:9100"}) / sum(node_memory_MemTotal_bytes{instance="10.0.0.191:9100"}) * 100, 0.1)
          valueExpr: string(result) + "%"
          colorExpr: 'colorScale(result, [35.0, 75.0], ["green", "orange", "red"])'
        - id: seb_memory_usage
          title: Memory
          query: round(sum(node_memory_MemTotal_bytes{instance="node-seb"} - node_memory_MemAvailable_bytes{instance="node-seb"}) / sum(node_memory_MemTotal_bytes{instance="node-seb"}) * 100, 0.1)
          valueExpr: string(result) + "%"
          colorExpr: 'colorScale(result, [35.0, 75.0], ["green", "orange", "red"])'
        - id: nas_memory_usage
          title: Memory
          query: round(sum(node_memory_MemTotal_bytes{instance="node-nas"} - node_memory_MemAvailable_bytes{instance="node-nas"}) / sum(node_memory_MemTotal_bytes{instance="node-nas"}) * 100, 0.1)
          valueExpr: string(result) + "%"
          colorExpr: 'colorScale(result, [35.0, 75.0], ["green", "orange", "red"])'
        - id: opnsense_memory_usage
          title: Memory
          query: round(sum(mem_total{host="router.local"} - mem_available{host="router.local"}) / sum(mem_total{host="router.local"})* 100, 0.1)
          valueExpr: string(result) + "%"
          colorExpr: 'colorScale(result, [35.0, 75.0], ["green", "orange", "red"])'

        # uptime
        - id: cluster_age_days
          title: Age
          query: round(time() - min(kube_node_created))
          valueExpr: humanizeDurationDays(result)
          colorExpr: 'colorScale(result, [15552000.0, 31104000.0], ["green", "orange", "red"])'
        - id: cluster_uptime_days
          title: Uptime
          query: round(avg(node_time_seconds{pod!=""} - node_boot_time_seconds{pod!=""}))
          valueExpr: humanizeDurationDays(result)
          colorExpr: 'colorScale(result, [15552000.0, 31104000.0], ["green", "orange", "red"])'
        - id: seb_uptime_days
          title: Uptime
          query: round(node_time_seconds{instance="node-seb"} - node_boot_time_seconds{instance="node-seb"})
          valueExpr: humanizeDurationDays(result)
          colorExpr: 'colorScale(result, [15552000.0, 31104000.0], ["green", "orange", "red"])'
        - id: nas_uptime_days
          title: Uptime
          query: round(node_time_seconds{instance="node-nas"} - node_boot_time_seconds{instance="node-nas"})
          valueExpr: humanizeDurationDays(result)
          colorExpr: 'colorScale(result, [15552000.0, 31104000.0], ["green", "orange", "red"])'
        - id: opnsense_uptime_days
          title: Uptime
          query: system_uptime{host="router.local"}
          valueExpr: humanizeDurationDays(result)
          colorExpr: 'colorScale(result, [15552000.0, 31104000.0], ["green", "orange", "red"])'

        # count
        - id: cluster_node_count
          title: Nodes
          query: count(count by (node) (kube_node_status_condition{condition="Ready"}))
          colorExpr: 'result > 0 ? "green" : "red"'
        - id: cluster_pod_count
          title: Pods
          query: sum(kube_pod_status_phase{phase="Running"})
          colorExpr: 'result > 0 ? "green" : "red"'
        
        - id: homelab_alert_all_count
          title: All Alerts
          query: sum(ALERTS{alertname!="Watchdog",alertstate="firing"} or vector(0))
          colorExpr: 'colorScale(result, [5.0, 9.0], ["green", "orange", "red"])'
        - id: homelab_alert_sev_none_count
          title: "SEV: None"
          query: sum(ALERTS{alertname!="Watchdog",alertstate="firing",severity="none"} or vector(0))
          colorExpr: 'result < 5 ? "green" : "red"'
        - id: homelab_alert_sev_info_count
          title: "SEV: Info"
          query: sum(ALERTS{alertname!="Watchdog",alertstate="firing",severity="info"} or vector(0))
          colorExpr: 'result < 3 ? "green" : "red"'
        - id: homelab_alert_sev_warn_count
          title: "SEV: Warn"
          query: sum(ALERTS{alertname!="Watchdog",alertstate="firing",severity="warning"} or vector(0))
          colorExpr: 'result < 1 ? "green" : "red"'
        - id: homelab_alert_sev_crit_count
          title: "SEV: Crit"
          query: sum(ALERTS{alertname!="Watchdog",alertstate="firing",severity="critical"} or vector(0))
          colorExpr: 'result < 1 ? "green" : "red"'

        # docker
        - id: docker_seb_service_count
          title: Services
          query: sum(engine_daemon_container_states_containers{instance="docker-seb"})
          colorExpr: 'result > 1 ? "green" : "red"'
        - id: docker_nas_service_count
          title: Services
          query: sum(engine_daemon_container_states_containers{instance="docker-nas"})
          colorExpr: 'result > 1 ? "green" : "red"'

        - id: internet_status
          title: Internet
          icon: mdi:web
          query: gatus_results_endpoint_success{group="connectivity",key="connectivity_cloudflare"}
          colorExpr: 'result == 1.0 ? "green" : "red"'
          valueExpr: 'result == 1.0 ? "UP" : "DOWN"'

        - id: speedtest_download
          title: Download
          icon: mdi:download
          query: round(speedtest_tracker_downloaded_bytes{status="completed"}) 
          colorExpr: 'colorScale(result, [999999999.0, 1500000000.0, 1900000000.0], ["red", "yellow", "green", "brightgreen"])'
          valueExpr: 'humanizeBytes(result)'

        - id: speedtest_upload
          title: Upload
          icon: mdi:upload
          query: round(speedtest_tracker_uploaded_bytes{status="completed"})
          colorExpr: 'colorScale(result, [175000000.0, 250000000.0, 300000000.0], ["red", "yellow", "green", "brightgreen"])' 
          valueExpr: 'humanizeBytes(result)'

configmap:
  kromgo-configfile:
    enabled: false

    workload:
      main:
        podSpec:
          containers:
            configs:
              enabled: true
              imageSelector: configsImage
              probes:
                liveness:
                  enabled: true
                  port: "{{ .Values.service.main.ports.main.port }}"
                readiness:
                  enabled: true
                  port: "{{ .Values.service.main.ports.main.port }}"
                startup:
                  enabled: true
                  port: "{{ .Values.service.main.ports.main.port }}"
              env:
                FOLDER: "{{ .Values.persistence.config.mountPath }}"
                LABEL: kromgo.greenehomelab.com/enabled
                NAMESPACE: kromgo
                RESOURCE: configmap
                UNIQUE_FILENAMES: false
                METHOD: WATCH
                HEALTH_PORT: "9999"
    ingress:
      main:
        enabled: true
        ingressClassName: "external"
        hosts:
          - host: kromgo.${DOMAIN_2}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          nginx:
            enabled: true
          certManager:
            enabled: true
            certificateIssuer: general-le-prod

    persistence:
      configfile:
        enabled: false
      config:
        enabled: true
        mountPath: /config
        targetSelectAll: true

    addons:
      codeserver:
        enabled: true
        service:
          type: "ClusterIP"
          ports:
            codeserver:
              port: 36107
        ingress:
          enabled: true
          ingressClassName: "internal"
          hosts:
            - host: editor.kromgo.${DOMAIN_2}
              paths:
                - path: /
                  # Ignored if not kubeVersion >= 1.14-0
                  pathType: Prefix
          integrations:
            nginx:
              enabled: true
              auth:
                type: "authelia"
                internalHost: "authelia.authelia.svc.cluster.local:9091"
                externalHost: "auth.${DOMAIN_2}"
            certManager:
              enabled: true
              certificateIssuer: general-le-prod

    # -- Whether Role Based Access Control objects like roles and rolebindings should be created
    rbac:
      main:
        enabled: true
        primary: true
        clusterWide: true
        rules:
          - apiGroups:
              - "networking.k8s.io"
            resources:
              - "ingresses"
            verbs:
              - "get"
              - "list"
              - "watch"
          - apiGroups: [""]
            resources:
              - "configmaps"
              - "secrets"
              - "services"
            verbs:
              - "get"
              - "list"
              - "watch"
          - apiGroups:
              - "gateway.networking.k8s.io"
            resources:
              - "httproutes"
            verbs:
              - "get"
              - "list"
              - "watch"
    # -- The service account the pods will use to interact with the Kubernetes API
    serviceAccount:
      main:
        enabled: true
        primary: true
    podOptions:
      automountServiceAccountToken: true
