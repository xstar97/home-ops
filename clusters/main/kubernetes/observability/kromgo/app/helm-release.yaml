apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kromgo
  namespace: kromgo
spec:
  interval: 15m
  chart:
    spec:
      chart: kromgo
      version: 2.5.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    image:
      repository: ghcr.io/home-operations/kromgo
      tag: 0.12.2@sha256:33a15e6087ecfbbf9cf39f24ca418ca30738dddd5af5ec9efee1e99742f49e57
      pullPolicy: IfNotPresent
    gatus:
      group: observability
    global:
      stopAll: false
    ingress:
      main:
        enabled: true
        ingressClassName: "external"
        hosts:
          - host: kromgo.${DOMAIN_2}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          nginx:
            enabled: true
          certManager:
            enabled: true
            certificateIssuer: general-le-prod
    
    config:
      defaults:
          cacheSeconds: 0 # Cache-Control max-age in seconds; 0 disables caching
          badge:
              font: go-regular # go-regular (default), go-bold, go-medium, go-mono
              size: 11 # badge font size in points
              style: flat # flat (default), flat-square, or plastic
              gallery:
                  hidden: false # list badges in the gallery (default); true hides them
      badges:
        - id: node_cpu_usage
          query: round(avg(instance:node_cpu_utilisation:rate5m{pod!=""}) * 100, 0.1)
          suffix: "%"
          title: CPU
        - id: cluster_cpu_usage
          query: round(avg(instance:node_cpu_utilisation:rate5m{pod!=""}) * 100, 0.1)
          suffix: "%"
          title: CPU
        - id: cluster_memory_usage
          query: round(sum(node_memory_MemTotal_bytes{pod!=""} - node_memory_MemAvailable_bytes{pod!=""}) / sum(node_memory_MemTotal_bytes{pod!=""}) * 100, 0.1)
          suffix: "%"
          title: Memory

        - id: talos_version
          query: label_replace(node_os_info{name="Talos"}, "version_id", "$1", "version_id", "v(.+)")
          label: version_id
          title: Talos
        - id: kubernetes_version
          query: label_replace(kubernetes_build_info{service="kubernetes"}, "git_version", "$1", "git_version", "v(.+)")
          label: git_version
          title: Kubernetes
        - id: flux_version
          query: label_replace(gotk_resource_info{exported_namespace="flux-system",name="flux",customresource_kind="Kustomization"}, "revision", "$1", "revision", "v(.+)@sha256:.+")
          label: revision
          title: Flux
          
        - id: cluster_node_count
          query: count(count by (node) (kube_node_status_condition{condition="Ready"}))
          title: Nodes
        - id: cluster_pod_count
          query: sum(kube_pod_status_phase{phase="Running"})
          title: Pods

        - id: cluster_alert_count
          query: alertmanager_alerts{state="active"} - 1 # Ignore Watchdog
          title: Alerts

        - id: cluster_age_days
          query: round((time() - min(kube_node_created) ) / 86400)
          suffix: "d"
          title: Age
        - id: cluster_uptime_days
          query: round(avg(node_time_seconds{pod!=""} - node_boot_time_seconds{pod!=""}) / 86400)
          suffix: "d"
          title: Uptime

    configmap:
      kromgo-configfile:
        enabled: true
        data:
          config.yaml: |
            {{- $.Values.config | toYaml | nindent 2 }}
    persistence:
      configfile:
        enabled: true
        type: configmap
        readOnly: true
        objectName: kromgo-configfile
        mountPath: /config/config.yaml
        subPath: config.yaml
