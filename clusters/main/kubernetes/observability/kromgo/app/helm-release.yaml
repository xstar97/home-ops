apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kromgo
  namespace: kromgo
spec:
  interval: 30m
  timeout: 25m
  maxHistory: 3
  driftDetection:
    mode: warn
  chart:
    spec:
      chart: app-template
      version: 18.6.4
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    image:
      repository: ghcr.io/home-operations/kromgo
      tag: 0.14.0@sha256:94ee0e2561048dc4637ca21b9926b76d87c15baf951678c7febb852269b7e10b
      pullPolicy: IfNotPresent
    gatus:
      group: observability
    global:
      stopAll: false

    service:
      main:
        ports:
          main:
            port: 80
          health:
            enabled: true
            port: 8080
    
    config:
      defaults:
        badge:
          font: dejavu-sans # dejavu-sans (default, shields.io-style), dejavu-sans-bold, comic-neue, comic-neue-bold
          size: 11 # badge font size in points
          style: flat # flat (default), flat-square, or plastic
          gallery:
              hidden: false # list badges in the gallery (default); true hides them
        graph:
          maxDuration: 1h # cap on a graph's requested window ("0" = unlimited)
          width: 600 # image width in px
          height: 200 # image height in px
          legend: true # show the series legend
          theme: light # color theme — see Themes below
          font: dejavu-sans # text font — see Themes below
          gallery:
              hidden: false # list graphs in the gallery (default); true hides them
      badges:
        # static versions
        - id: talos_version
          query: node_os_info{ name="Talos"}
          title: Talos
          icon: si:talos
          valueExpr: labels["version_id"]
        - id: kubernetes_version
          query: kubernetes_build_info{ service="kubernetes"}
          title: Kubernetes
          icon: si:kubernetes
          valueExpr: labels["git_version"]
        - id: flux_version
          query: label_replace(gotk_resource_info{exported_namespace="flux-system",name="flux",customresource_kind="Kustomization"}, "revision", "$1", "revision", "(.+)@sha256:.+")
          title: Flux
          icon: si:flux
          valueExpr: labels["revision"]

        # usage      
        - id: cluster_cpu_usage
          query: round(cluster:node_cpu:ratio_rate5m * 100, 0.1)
          valueExpr: string(result) + "%"
          colorExpr: 'result < 35 ? "green" : result < 75 ? "orange" : "red"'
          title: CPU
        - id: cluster_memory_usage
          query: round(sum(node_memory_MemTotal_bytes{pod!=""} - node_memory_MemAvailable_bytes{pod!=""}) / sum(node_memory_MemTotal_bytes{pod!=""}) * 100, 0.1)
          valueExpr: string(result) + "%"
          colorExpr: 'result < 35 ? "green" : result < 75 ? "orange" : "red"'
          title: Memory
        
        # uptime
        - id: cluster_age_days
          query: round((time() - min(kube_node_created) ) / 86400)
          valueExpr: string(result) + "d"
          colorExpr: 'result < 180 ? "green" : result < 360 ? "orange" : "red"'
          title: Age
        - id: cluster_uptime_days
          query: round(avg(node_time_seconds{pod!=""} - node_boot_time_seconds{pod!=""}) / 86400)
          valueExpr: string(result) + "d"
          colorExpr: 'result < 180 ? "green" : result < 360 ? "orange" : "red"'
          title: Uptime

        # count
        - id: cluster_node_count
          query: count(count by (node) (kube_node_status_condition{condition="Ready"}))
          colorExpr: 'result > 0 ? "green" : "red"'
          title: Nodes
        - id: cluster_pod_count
          query: sum(kube_pod_status_phase{phase="Running"})
          colorExpr: 'result > 0 ? "green" : "red"'
          title: Pods
        - id: cluster_alert_count
          query: alertmanager_alerts{state="active"} - 1 # Ignore Watchdog
          colorExpr: 'result < 0 ? "green" : "red"'
          title: Alerts

        # chart status
        - id: chart_status_plex
          query: kube_pod_status_phase{namespace="ytptube", pod!~"volsync-.*|restic-.*"} == 1
          title: Plex Status
          icon: mdi:plex
          colorExpr: 'labels["phase"] == "Running" ? "green" : labels["phase"] == "Pending" ? "orange" : labels["phase"] == "Succeeded" ? "blue" : labels["phase"] == "Failed" ? "red" : "gray"'
          valueExpr: labels[?"phase"].orValue("computing...")
        - id: chart_status_authelia
          query: kube_pod_status_phase{namespace="authelia", pod!~"volsync-.*|restic-.*"} == 1
          title: Authelia Status
          icon: si:authelia
          colorExpr: 'labels["phase"] == "Running" ? "green" : labels["phase"] == "Pending" ? "orange" : labels["phase"] == "Succeeded" ? "blue" : labels["phase"] == "Failed" ? "red" : "gray"'
          valueExpr: labels[?"phase"].orValue("computing...")
        - id: chart_status_lldap
          query: kube_pod_status_phase{namespace="lldap", pod!~"volsync-.*|restic-.*"} == 1
          title: LLDAP Status
          icon: si:authelia
          colorExpr: 'labels["phase"] == "Running" ? "green" : labels["phase"] == "Pending" ? "orange" : labels["phase"] == "Succeeded" ? "blue" : labels["phase"] == "Failed" ? "red" : "gray"'
          valueExpr: labels[?"phase"].orValue("computing...")
        - id: chart_status_vaultwarden
          query: kube_pod_status_phase{namespace="vaultwarden", pod!~"volsync-.*|restic-.*"} == 1
          title: VaultWarden Status
          icon: si:vaultwarden
          colorExpr: 'labels["phase"] == "Running" ? "green" : labels["phase"] == "Pending" ? "orange" : labels["phase"] == "Succeeded" ? "blue" : labels["phase"] == "Failed" ? "red" : "gray"'
          valueExpr: labels[?"phase"].orValue("computing...")
        - id: chart_status_nginx_external
          query: kube_pod_status_phase{namespace="nginx",pod=~"nginx-external-controller.*"} == 1
          title: Nginx External Status
          icon: si:nginx
          colorExpr: 'labels["phase"] == "Running" ? "green" : labels["phase"] == "Pending" ? "orange" : labels["phase"] == "Succeeded" ? "blue" : labels["phase"] == "Failed" ? "red" : "gray"'
          valueExpr: labels[?"phase"].orValue("computing...")
        - id: chart_status_cloudflared
          query: kube_pod_status_phase{namespace="cloudflared", pod!~"volsync-.*|restic-.*"} == 1
          title: Cloudflared Status
          icon: si:cloudflare
          colorExpr: 'labels["phase"] == "Running" ? "green" : labels["phase"] == "Pending" ? "orange" : labels["phase"] == "Succeeded" ? "blue" : labels["phase"] == "Failed" ? "red" : "gray"'
          valueExpr: labels[?"phase"].orValue("computing...")

    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                PROMETHEUS_URL: "http://prometheus-operated.kube-prometheus-stack.svc.cluster.local:9090"
                SERVER_PORT: "{{ $.Values.service.main.ports.main.port }}"
                HEALTH_PORT: "{{ $.Values.service.main.ports.health.port }}"
              probes:
                liveness:
                  type: http
                  path: "/healthz"
                  port: "{{ $.Values.service.main.ports.health.port }}"
                readiness:
                  type: http
                  path: "/readyz"
                  port: "{{ $.Values.service.main.ports.health.port }}"
                startup:
                  type: http
                  path: "/readyz"
                  port: "{{ $.Values.service.main.ports.health.port }}"

    ingress:
      main:
        enabled: true
        ingressClassName: "external"
        hosts:
          - host: kromgo.${DOMAIN_2}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          nginx:
            enabled: true
          certManager:
            enabled: true
            certificateIssuer: general-le-prod

    # {{- $.Values.config | toYaml | nindent 2 }}
    configmap:
      kromgo-config:
        enabled: true
        data:
          config.yaml: >
            {{ .Files.Get "./config.yaml" }}

    persistence:
      config:
        enabled: true
        type: configmap
        readOnly: true
        objectName: kromgo-config
        mountPath: /config/config.yaml
        subPath: config.yaml
