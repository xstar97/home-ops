apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# namespace: kromgo
resources:
  - helm-release.yaml
  - namespace.yaml
configMapGenerator:
   - name: kromgo-config2
     namespace: kromgo
     # behavior: replace
     files:
       - config.yaml=./config.yaml
generatorOptions:
  disableNameSuffixHash: true
components:
  - ../../../../components/notifications/discord
