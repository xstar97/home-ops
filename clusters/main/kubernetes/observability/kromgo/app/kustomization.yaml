apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# namespace: kromgo
# namePrefix: "kromgo"
nameSuffix: ""
resources:
  - helm-release.yaml
  - namespace.yaml
configMapGenerator:
  - name: kromgo-config-file
    namespace: kromgo
    files:
      - ./config.yaml
generatorOptions:
  # disableNameSuffixHash: false
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
components:
  - ../../../../components/notifications/discord
