apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: kromgo
  namespace: flux-system
resources:
  - namespace.yaml
  - helm-release.yaml
configMapGenerator:
  - name: kromgo-config-file
    namespace: kromgo
    files:
      - config.yaml
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    meta.helm.sh/release-name: kromgo
    meta.helm.sh/release-namespace: kromgo
components:
  - ../../../../components/notifications/discord
