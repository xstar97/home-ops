apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# namespace: kromgo
resources:
  - helm-release.yaml
  - namespace.yaml
configMapGenerator:
  - name: kromgo-kromgo-config3
    namespace: kromgo
    files:
      - config.yaml=./config.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    kromgo_config: "1"
components:
  - ../../../../components/notifications/discord
