apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: kromgo
  namespace: flux-system
resources:
  - namespace.yaml
  - helm-release.yaml
configMapGenerator:
  - name: kromgo-config
    files:
      - config.yaml=./config.yaml
generatorOptions:
  disableNameSuffixHash: true
components:
  - ../../../../components/notifications/discord
