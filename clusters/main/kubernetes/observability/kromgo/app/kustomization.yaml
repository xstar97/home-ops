apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: kromgo
  namespace: kromgo
resources:
  - helm-release.yaml
  - namespace.yaml
configMapGenerator:
  - name: kromgo-config-file
    namespace: kromgo
    files:
      - config.yaml=./config.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    kromgo.greenehomelab.com/enabled: "1"
components:
  - ../../../../components/notifications/discord
