---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: magicmirror
  namespace: magicmirror
spec:
  interval: 30m
  timeout: 25m
  maxHistory: 3
  # enabled | warn
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: app-template
      version: 18.14.4
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      stopAll: false
    credentials:
      cf-restic:
        bucket: "${CF_S3_RESTIC_BUCKET}-magicmirror"
      rfs-restic:
        bucket: "${RUSTFS_S3_RESTIC_BUCKET}-magicmirror"
    image:
      repository: karsten13/magicmirror
      pullPolicy: IfNotPresent
      tag: alpine-v2.37.0@sha256:8deb9a5c9c30608c4abcfc350c0a7964224227653985e883c9207e783971161e
    mmpmImage:
      repository: karsten13/mmpm
      pullPolicy: IfNotPresent
      tag: 4.6.4@sha256:a6a15505e9c90287c7a41abb990779e7ff8b215589abf40772c2d1dcd41f2b5e
    securityContext:
      container:
        runAsUser: 0
        runAsGroup: 0
        runAsNonRoot: false
        readOnlyRootFilesystem: false
    service:
      main:
        type: LoadBalancer
        loadBalancerIP: ${MM_IP_0}
        integrations:
          metallb:
            enabled: true
        ports:
          main:
            port: 8080
      backend:
        enabled: true
        type: LoadBalancer
        loadBalancerIP: ${MM_IP_0}
        integrations:
          metallb:
            enabled: true
        ports:
          backend1:
            enabled: true
            port: 7890
          backend2:
            enabled: true
            port: 7891
          backend3:
            enabled: true
            port: 6789
          backend4:
            enabled: true
            port: 8907
    
    magicmirror:
      mmpm: []
      modules:
        - module: alert
        - module: updatenotification
          position: top_bar
        - module: clock
          position: top_left
        - module: compliments
          position: lower_third

    configmap:
      mmpm-env:
        enabled: false
        data:
          mmpm-env.json: |
            {
            "MMPM_MAGICMIRROR_ROOT": "/opt/magic_mirror",
            "MMPM_MAGICMIRROR_URI": '{{ printf "http://%v:%v," (include "tc.v1.common.lib.chart.names.fullname" $) .Values.service.main.ports.main.port }}'
            "MMPM_MAGICMIRROR_PM2_PROCESS_NAME": "",
            "MMPM_MAGICMIRROR_DOCKER_COMPOSE_FILE": "",
            "MMPM_IS_DOCKER_IMAGE": true,
            "MMPM_LOG_LEVEL": "INFO"
            }
      mm-config:
        enabled: true
        data:
          config.js: |
            
            let config = {
              address: "0.0.0.0",
              port: {{ .Values.service.main.ports.main.port }},
              basePath: "/",
              ipWhitelist: [],	
              useHttps: false,
              httpsPrivateKey: "",
              httpsCertificate: "",
              language: "en",
              locale: "en-US",
              logLevel: ["INFO", "LOG", "WARN", "ERROR"], // Add "DEBUG" for even more logging
              timeFormat: 24,
              units: "metric",
              "modules": [
                {
                    "module": "alert"
                },
                {
                    "module": "updatenotification",
                    "position": "top_bar"
                },
                {
                    "module": "clock",
                    "position": "top_left"
                },
                {
                module: "weather",
                position: "top_right",
                config: {
                  weatherProvider: "openmeteo",
                  type: "current",
                  lat: ${MM_WEATHER_LAT_0},
                  lon: ${MM_WEATHER_LON_0},

                  updateInterval: 30 * 60 * 1000,
                  initialLoadDelay: 2000,

                  roundTemp: true,
                  showHumidity: false,
                  showWindDirection: false,
                  showWindSpeed: false,
                  showFeelsLike: false,
                  showSun: false
                }
              }
            ],
            };

            /*************** DO NOT EDIT THE LINE BELOW ***************/
            if (typeof module !== "undefined") { module.exports = config; }

    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                NODE_ENV: production
                MM_PORT: "{{ .Values.service.main.ports.main.port }}"
                MM_SCENARIO: "server"
                MM_CONFIG_FILE: "/opt/magic_mirror/config/config.js"
                MM_SHOW_CURSOR: false
            mmpm:
              enabled: false
              imageSelector: mmpmImage
              probes:
                liveness:
                  enabled: true
                  type: http
                  path: /
                  port: "{{ .Values.service.backend.ports.backend1.port }}"
                readiness:
                  enabled: true
                  type: http
                  path: /
                  port: "{{ .Values.service.backend.ports.backend1.port }}"
                startup:
                  enabled: true
                  type: http
                  path: /
                  port: "{{ .Values.service.backend.ports.backend1.port }}"
              
    ingress:
      main:
        enabled: false
        ingressClassName: "internal"
        annotations:
          nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
          nginx.ingress.kubernetes.io/ssl-redirect: "false"

        hosts:
          - host: server.mm.${DOMAIN_2}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          nginx:
            enabled: true
          certManager:
            enabled: true
            certificateIssuer: general-le-prod
      mmpm:
        enabled: false
        ingressClassName: internal
        targetSelector:
          backend: backend1
        hosts:
          - host: pkgmanager.mm.${DOMAIN_2}
        integrations:
          nginx:
            enabled: true
          certManager:
            enabled: true
            certificateIssuer: general-le-prod    
    
    persistence:
      mmpm-config:
        enabled: false
        mountPath: "/home/node/.config/mmpm"
        targetSelectAll: true
        volsync:
          - name: mmpmconfig
            type: restic
            credentials: cf-restic
            dest:
              enabled: true
            src:
              enabled: true
      mmpm-env:
        enabled: false
        type: configmap
        mountPath: /root/.config/mmpm/mmpm-env.json
        objectName: mmpm-env
        subPath: mmpm-env.json
        readOnly: true
        targetSelectAll: true
      config:
        enabled: true
        mountPath: "/opt/magic_mirror/config"
        targetSelectAll: true
        volsync:
          - name: config
            type: restic
            credentials: cf-restic
            dest:
              enabled: true
            src:
              enabled: true
      mm-config:
        enabled: true
        type: configmap
        mountPath: /opt/magic_mirror/config/config.js
        objectName: mm-config
        subPath: config.js
        readOnly: true
        targetSelectAll: true
      modules:
        enabled: true
        mountPath: "/opt/magic_mirror/modules"
        targetSelectAll: true
        volsync:
          - name: modules
            type: restic
            credentials: cf-restic
            dest:
              enabled: true
            src:
              enabled: true
      css:
        enabled: true
        mountPath: "/opt/magic_mirror/css"
        targetSelectAll: true
        volsync:
          - name: css
            type: restic
            credentials: cf-restic
            dest:
              enabled: true
            src:
              enabled: true
