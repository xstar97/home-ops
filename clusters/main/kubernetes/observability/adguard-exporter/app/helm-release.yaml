apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: adguard-exporter
  namespace: adguard-exporter
spec:
  interval: 30m
  timeout: 25m
  maxHistory: 3
  # enabled | warn
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: app-template
      version: 21.0.11
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      stopAll: false
    gatus:
      group: observability

    image:
      repository: ghcr.io/henrywhitaker3/adguard-exporter
      pullPolicy: IfNotPresent
      tag: v1.2.1@sha256:42a9581bae4a91e6d4985415d1fe89ab9b1f50fbe2945a1c122d212d6354b747
    service:
      main:
        ports:
          main:
            port: 9618
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                BIND_ADDR: ":{{ .Values.service.main.ports.main.port }}"
                ADGUARD_SERVERS: "${ADGUARD_HOME_URL}"
                ADGUARD_USERNAMES: "${ADGUARD_HOME_USER}"
                ADGUARD_PASSWORDS: "${ADGUARD_HOME_PASS}"
                INTERVAL: "30s"
                DEBUG: false
