apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kromgo
  namespace: kromgo
spec:
  interval: 30m
  timeout: 25m
  maxHistory: 3
  driftDetection:
    mode: warn
  chart:
    spec:
      chart: app-template
      version: 18.6.7
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      stopAll: false
    gatus:
      group: observability
    image:
      repository: ghcr.io/home-operations/kromgo
      tag: 0.14.4@sha256:fdc38a017bf17b4346ab894626110885dd83793007b66c6bfbdf323fbec48c94
      pullPolicy: IfNotPresent

    service:
      main:
        ports:
          main:
            port: 80
          health:
            enabled: true
            port: 8080
    
    config:
      defaults:
        badge:
          font: dejavu-sans # dejavu-sans (default, shields.io-style), dejavu-sans-bold, comic-neue, comic-neue-bold
          size: 11 # badge font size in points
          style: flat # flat (default), flat-square, or plastic
          gallery:
              hidden: false # list badges in the gallery (default); true hides them
        graph:
          maxDuration: 1h # cap on a graph's requested window ("0" = unlimited)
          width: 600 # image width in px
          height: 200 # image height in px
          legend: true # show the series legend
          theme: light # color theme — see Themes below
          font: dejavu-sans # text font — see Themes below
          gallery:
              hidden: false # list graphs in the gallery (default); true hides them
      badges:
        # static versions
        - id: talos_version
          title: Talos
          icon: si:talos
          query: node_os_info{ name="Talos"}
          valueExpr: labels["version_id"]
        - id: kubernetes_version
          title: Kubernetes
          icon: si:kubernetes
          query: kubernetes_build_info{ service="kubernetes"}
          valueExpr: labels["git_version"]
        - id: flux_version
          title: Flux
          icon: si:flux
          query: label_replace(gotk_resource_info{exported_namespace="flux-system",name="flux",customresource_kind="Kustomization"}, "revision", "$1", "revision", "(.+)@sha256:.+")
          valueExpr: labels["revision"]

        - id: os_seb_version
          title: OS
          icon: si:debian
          query: node_os_info{instance="node-seb"}
          valueExpr: labels["version"]
        - id: docker_seb_version
          title: Docker
          icon: si:docker
          query: engine_daemon_engine_info{instance="docker-seb"}
          valueExpr: labels["version"]
        - id: dc_seb_version
          title: Doco-CD
          icon: si:docker
          query: doco_cd_info{instance="doco-cd-seb"}
          valueExpr: labels["version"]
        - id: os_nas_version
          title: OS
          icon: si:debian
          query: node_os_info{instance="node-nas"}
          valueExpr: labels["version"]
        - id: docker_nas_version
          title: Docker
          icon: si:docker
          query: engine_daemon_engine_info{instance="docker-nas"}
          valueExpr: labels["version"]
        - id: dc_nas_version
          title: Doco-CD
          icon: si:docker
          query: doco_cd_info{instance="doco-cd-nas"}
          valueExpr: labels["version"]
        
        # power
        - id: home_lab_power
          title: HomeLab Power
          query: round(avg_over_time(ups_ups_load{ups="server-rack"}[5m]) * 9, 1)
          valueExpr: string(result) + " W"
          colorExpr: 'result < 300 ? "green" : result < 600 ? "orange" : "red"'

        # usage      
        - id: cluster_cpu_usage
          title: CPU
          query: round(cluster:node_cpu:ratio_rate5m * 100, 0.1)
          valueExpr: string(result) + "%"
          colorExpr: 'result < 35 ? "green" : result < 75 ? "orange" : "red"'
        - id: seb_cpu_usage
          title: CPU
          query: round(100 - (avg(rate(node_cpu_seconds_total{instance="node-seb", mode="idle"}[5m])) * 100),0.1)
          valueExpr: string(result) + "%"
          colorExpr: 'result < 35 ? "green" : result < 75 ? "orange" : "red"'
        - id: nas_cpu_usage
          title: CPU
          query: round(100 - (avg(rate(node_cpu_seconds_total{instance="node-nas", mode="idle"}[5m])) * 100),0.1)
          valueExpr: string(result) + "%"
          colorExpr: 'result < 35 ? "green" : result < 75 ? "orange" : "red"'
        - id: cluster_memory_usage
          title: Memory
          query: round(sum(node_memory_MemTotal_bytes{instance="10.0.0.191:9100"} - node_memory_MemAvailable_bytes{instance="10.0.0.191:9100"}) / sum(node_memory_MemTotal_bytes{instance="10.0.0.191:9100"}) * 100, 0.1)
          valueExpr: string(result) + "%"
          colorExpr: 'result < 35 ? "green" : result < 75 ? "orange" : "red"'
        - id: seb_memory_usage
          title: Memory
          query: round(sum(node_memory_MemTotal_bytes{instance="node-seb"} - node_memory_MemAvailable_bytes{instance="node-seb"}) / sum(node_memory_MemTotal_bytes{instance="node-seb"}) * 100, 0.1)
          valueExpr: string(result) + "%"
          colorExpr: 'result < 35 ? "green" : result < 75 ? "orange" : "red"'
        - id: nas_memory_usage
          title: Memory
          query: round(sum(node_memory_MemTotal_bytes{instance="node-nas"} - node_memory_MemAvailable_bytes{instance="node-nas"}) / sum(node_memory_MemTotal_bytes{instance="node-nas"}) * 100, 0.1)
          valueExpr: string(result) + "%"
          colorExpr: 'result < 35 ? "green" : result < 75 ? "orange" : "red"'
        
        # uptime
        - id: cluster_age_days
          title: Age
          query: round((time() - min(kube_node_created) ) / 86400)
          valueExpr: string(result) + "d"
          colorExpr: 'result < 180 ? "green" : result < 360 ? "orange" : "red"'
        - id: cluster_uptime_days
          title: Uptime
          query: round(avg(node_time_seconds{pod!=""} - node_boot_time_seconds{pod!=""}) / 86400)
          valueExpr: string(result) + "d"
          colorExpr: 'result < 180 ? "green" : result < 360 ? "orange" : "red"'
        - id: seb_uptime_days
          title: Uptime
          query: round((node_time_seconds{instance="node-seb"} - node_boot_time_seconds{instance="node-seb"}) / 86400, 1)
          valueExpr: string(result) + "d"
          colorExpr: 'result < 180 ? "green" : result < 360 ? "orange" : "red"'
        - id: nas_uptime_days
          title: Uptime
          query: round((node_time_seconds{instance="node-nas"} - node_boot_time_seconds{instance="node-nas"}) / 86400, 1)
          valueExpr: string(result) + "d"
          colorExpr: 'result < 180 ? "green" : result < 360 ? "orange" : "red"'

        # count
        - id: cluster_node_count
          title: Nodes
          query: count(count by (node) (kube_node_status_condition{condition="Ready"}))
          colorExpr: 'result > 0 ? "green" : "red"'
        - id: cluster_pod_count
          title: Pods
          query: sum(kube_pod_status_phase{phase="Running"})
          colorExpr: 'result > 0 ? "green" : "red"'
        - id: cluster_alert_count
          title: Alerts
          query: alertmanager_alerts{state="active"} - 1 # Ignore Watchdog
          colorExpr: 'result < 1 ? "green" : "red"'

        # docker
        - id: docker_seb_service_count
          title: Services
          query: sum(engine_daemon_container_states_containers{instance="docker-seb"})
          colorExpr: 'result > 1 ? "green" : "red"'
        - id: docker_nas_service_count
          title: Services
          query: sum(engine_daemon_container_states_containers{instance="docker-nas"})
          colorExpr: 'result > 1 ? "green" : "red"'

        - id: internet_status
          title: Internet
          icon: mdi:web
          query: gatus_results_endpoint_success{group="connectivity",key="connectivity_cloudflare"}
          colorExpr: 'result == 1.0 ? "green" : "red"'
          valueExpr: 'result == 1.0 ? "UP" : "DOWN"'

        - id: speedtest_download
          title: Download
          icon: mdi:download
          query: speedtest_tracker_downloaded_bytes{status="completed"} / 1073741824
          colorExpr: 'result >= 2 ? "green" : result >= 1.6 ? "yellow" : "red"'
          valueExpr: 'string(result) + " GB"'

    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                PROMETHEUS_URL: "http://prometheus-operated.kube-prometheus-stack.svc.cluster.local:9090"
                SERVER_PORT: "{{ $.Values.service.main.ports.main.port }}"
                HEALTH_PORT: "{{ $.Values.service.main.ports.health.port }}"
              probes:
                liveness:
                  type: http
                  path: "/healthz"
                  port: "{{ $.Values.service.main.ports.health.port }}"
                readiness:
                  type: http
                  path: "/readyz"
                  port: "{{ $.Values.service.main.ports.health.port }}"
                startup:
                  type: http
                  path: "/readyz"
                  port: "{{ $.Values.service.main.ports.health.port }}"

    ingress:
      main:
        enabled: true
        ingressClassName: "external"
        hosts:
          - host: kromgo.${DOMAIN_2}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          nginx:
            enabled: true
          certManager:
            enabled: true
            certificateIssuer: general-le-prod

    # {{ .Files.Get "./config.yaml" | indent 2 }}
    configmap:
      kromgo-config:
        enabled: true
        data:
          config.yaml: |
           {{- $.Values.config | toYaml | nindent 2 }}

    persistence:
      config:
        enabled: true
        type: configmap
        readOnly: true
        objectName: kromgo-config
        mountPath: /config/config.yaml
        subPath: config.yaml
