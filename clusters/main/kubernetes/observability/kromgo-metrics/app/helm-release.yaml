apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kromgo
  namespace: kromgo
spec:
  interval: 30m
  timeout: 25m
  maxHistory: 3
  driftDetection:
    mode: warn
  chart:
    spec:
      chart: app-template
      version: 18.6.7
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      stopAll: false
    gatus:
      group: observability
    image:
      repository: ghcr.io/home-operations/kromgo
      tag: 0.14.4@sha256:fdc38a017bf17b4346ab894626110885dd83793007b66c6bfbdf323fbec48c94
      pullPolicy: IfNotPresent

    service:
      main:
        ports:
          main:
            port: 80
          health:
            enabled: true
            port: 8080
    
    config:
      defaults:
        badge:
          font: dejavu-sans # dejavu-sans (default, shields.io-style), dejavu-sans-bold, comic-neue, comic-neue-bold
          size: 11 # badge font size in points
          style: flat # flat (default), flat-square, or plastic
          gallery:
              hidden: false # list badges in the gallery (default); true hides them
        graph:
          maxDuration: 1h # cap on a graph's requested window ("0" = unlimited)
          width: 600 # image width in px
          height: 200 # image height in px
          legend: true # show the series legend
          theme: light # color theme — see Themes below
          font: dejavu-sans # text font — see Themes below
          gallery:
              hidden: false # list graphs in the gallery (default); true hides them
      badges:
        # static versions
        - id: talos_version
          query: node_os_info{ name="Talos"}
          title: Talos
          icon: si:talos
          valueExpr: labels["version_id"]
        - id: kubernetes_version
          query: kubernetes_build_info{ service="kubernetes"}
          title: Kubernetes
          icon: si:kubernetes
          valueExpr: labels["git_version"]
        - id: flux_version
          query: label_replace(gotk_resource_info{exported_namespace="flux-system",name="flux",customresource_kind="Kustomization"}, "revision", "$1", "revision", "(.+)@sha256:.+")
          title: Flux
          icon: si:flux
          valueExpr: labels["revision"]

        - id: seb_version
          query: node_os_info{instance="node-seb"}
          title: OS version
          icon: si:debian
          valueExpr: labels["version"]
        - id: seb_dc_version
          query: doco_cd_info{instance="doco-cd-seb"}
          title: Doco-CD
          icon: si:docker
          valueExpr: labels["version"]
        - id: nas_version
          query: node_os_info{instance="node-nas"}
          title: OS version
          icon: si:debian
          valueExpr: labels["version"]
        - id: nas_dc_version
          query: doco_cd_info{instance="doco-cd-nas"}
          title: Doco-CD
          icon: si:docker
          valueExpr: labels["version"]
        
        # power
        - id: home_lab_power
          query: round(avg_over_time(ups_ups_load{ups="server-rack"}[5m]) * 9, 1)
          valueExpr: string(result) + " W"
          colorExpr: 'result < 300 ? "green" : result < 600 ? "orange" : "red"'
          title: HomeLab Power

        # usage      
        - id: cluster_cpu_usage
          query: round(cluster:node_cpu:ratio_rate5m * 100, 0.1)
          valueExpr: string(result) + "%"
          colorExpr: 'result < 35 ? "green" : result < 75 ? "orange" : "red"'
          title: CPU
        - id: cluster_memory_usage
          query: round(sum(node_memory_MemTotal_bytes{pod!=""} - node_memory_MemAvailable_bytes{pod!=""}) / sum(node_memory_MemTotal_bytes{pod!=""}) * 100, 0.1)
          valueExpr: string(result) + "%"
          colorExpr: 'result < 35 ? "green" : result < 75 ? "orange" : "red"'
          title: Memory
        
        # uptime
        - id: cluster_age_days
          query: round((time() - min(kube_node_created) ) / 86400)
          valueExpr: string(result) + "d"
          colorExpr: 'result < 180 ? "green" : result < 360 ? "orange" : "red"'
          title: Age
        - id: cluster_uptime_days
          query: round(avg(node_time_seconds{pod!=""} - node_boot_time_seconds{pod!=""}) / 86400)
          valueExpr: string(result) + "d"
          colorExpr: 'result < 180 ? "green" : result < 360 ? "orange" : "red"'
          title: Uptime
        - id: seb_uptime_days
          query: round((node_time_seconds{instance="node-seb"} - node_boot_time_seconds{instance="node-seb"}) / 86400, 1)
          valueExpr: string(result) + "d"
          colorExpr: 'result < 180 ? "green" : result < 360 ? "orange" : "red"'
          title: Uptime
        - id: nas_uptime_days
          query: round((node_time_seconds{instance="node-nas"} - node_boot_time_seconds{instance="node-nas"}) / 86400, 1)
          valueExpr: string(result) + "d"
          colorExpr: 'result < 180 ? "green" : result < 360 ? "orange" : "red"'
          title: Uptime

        # count
        - id: cluster_node_count
          query: count(count by (node) (kube_node_status_condition{condition="Ready"}))
          colorExpr: 'result > 0 ? "green" : "red"'
          title: Nodes
        - id: cluster_pod_count
          query: sum(kube_pod_status_phase{phase="Running"})
          colorExpr: 'result > 0 ? "green" : "red"'
          title: Pods
        - id: cluster_alert_count
          query: alertmanager_alerts{state="active"} - 1 # Ignore Watchdog
          colorExpr: 'result < 1 ? "green" : "red"'
          title: Alerts
        - id: ingress_external_count
          query: sum(kube_ingress_info{ingressclass="external"})
          title: "External Services"
        - id: ingress_internal_count
          query: sum(kube_ingress_info{ingressclass="internal"})
          title: "Internal Services"
        
        - id: seb_dc_deploy_queued_count
          query: doco_cd_deployments_queued{instance="doco-cd-seb"}
          colorExpr: 'result < 1 ? "green" : "red"'
          title: Deployments Queued
        - id: nas_dc_deploy_queued_count
          query: doco_cd_deployments_queued{instance="doco-cd-nas"}
          colorExpr: 'result < 1 ? "green" : "red"'
          title: Deployments Queued
        - id: seb_dc_deploy_active_count
          query: doco_cd_deployments_active{instance="doco-cd-seb"}
          title: Deployments Queued
        - id: nas_dc_deploy_active_count
          query: doco_cd_deployments_active{instance="doco-cd-nas"}
          title: Deployments Queued
        - id: seb_dc_deploy_active_count
          query: count(doco_cd_deployment_errors_total{instance="doco-cd-seb"}) or vector(0)
          title: Deployment Errors
        - id: nas_dc_deploy_active_count
          query: count(doco_cd_deployment_errors_total{instance="doco-cd-nas"}) or vector(0)
          title: Deployment Errors

        - id: internet_status
          query: gatus_results_endpoint_success{group="connectivity",key="connectivity_cloudflare"}
          title: Internet
          icon: mdi:web
          colorExpr: 'result == 1.0 ? "green" : "red"'
          valueExpr: 'result == 1.0 ? "UP" : "DOWN"'

        # chart status
        - id: chart_status_plex
          query: kube_pod_status_phase{namespace="ytptube", pod!~"volsync-.*|restic-.*"} == 1
          title: Plex
          icon: mdi:plex
          colorExpr: 'labels["phase"] == "Running" ? "green" : labels["phase"] == "Pending" ? "orange" : labels["phase"] == "Succeeded" ? "blue" : labels["phase"] == "Failed" ? "red" : "gray"'
          valueExpr: labels[?"phase"].orValue("computing...")
        - id: chart_status_authelia
          query: kube_pod_status_phase{namespace="authelia", pod!~"volsync-.*|restic-.*"} == 1
          title: Authelia
          icon: si:authelia
          colorExpr: 'labels["phase"] == "Running" ? "green" : labels["phase"] == "Pending" ? "orange" : labels["phase"] == "Succeeded" ? "blue" : labels["phase"] == "Failed" ? "red" : "gray"'
          valueExpr: labels[?"phase"].orValue("computing...")
        - id: chart_status_lldap
          query: kube_pod_status_phase{namespace="lldap", pod!~"volsync-.*|restic-.*"} == 1
          title: LLDAP
          icon: si:authelia
          colorExpr: 'labels["phase"] == "Running" ? "green" : labels["phase"] == "Pending" ? "orange" : labels["phase"] == "Succeeded" ? "blue" : labels["phase"] == "Failed" ? "red" : "gray"'
          valueExpr: labels[?"phase"].orValue("computing...")
        - id: chart_status_vaultwarden
          query: kube_pod_status_phase{namespace="vaultwarden", pod!~"volsync-.*|restic-.*"} == 1
          title: VaultWarden
          icon: si:vaultwarden
          colorExpr: 'labels["phase"] == "Running" ? "green" : labels["phase"] == "Pending" ? "orange" : labels["phase"] == "Succeeded" ? "blue" : labels["phase"] == "Failed" ? "red" : "gray"'
          valueExpr: labels[?"phase"].orValue("computing...")
        - id: chart_status_nginx_external
          query: kube_pod_status_phase{namespace="nginx",pod=~"nginx-external-controller.*"} == 1
          title: Nginx External
          icon: si:nginx
          colorExpr: 'labels["phase"] == "Running" ? "green" : labels["phase"] == "Pending" ? "orange" : labels["phase"] == "Succeeded" ? "blue" : labels["phase"] == "Failed" ? "red" : "gray"'
          valueExpr: labels[?"phase"].orValue("computing...")
        - id: chart_status_cloudflared
          query: kube_pod_status_phase{namespace="cloudflared", pod!~"volsync-.*|restic-.*"} == 1
          title: Cloudflared
          icon: si:cloudflare
          colorExpr: 'labels["phase"] == "Running" ? "green" : labels["phase"] == "Pending" ? "orange" : labels["phase"] == "Succeeded" ? "blue" : labels["phase"] == "Failed" ? "red" : "gray"'
          valueExpr: labels[?"phase"].orValue("computing...")

    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                PROMETHEUS_URL: "http://prometheus-operated.kube-prometheus-stack.svc.cluster.local:9090"
                SERVER_PORT: "{{ $.Values.service.main.ports.main.port }}"
                HEALTH_PORT: "{{ $.Values.service.main.ports.health.port }}"
              probes:
                liveness:
                  type: http
                  path: "/healthz"
                  port: "{{ $.Values.service.main.ports.health.port }}"
                readiness:
                  type: http
                  path: "/readyz"
                  port: "{{ $.Values.service.main.ports.health.port }}"
                startup:
                  type: http
                  path: "/readyz"
                  port: "{{ $.Values.service.main.ports.health.port }}"

    ingress:
      main:
        enabled: true
        ingressClassName: "external"
        hosts:
          - host: kromgo.${DOMAIN_2}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          nginx:
            enabled: true
          certManager:
            enabled: true
            certificateIssuer: general-le-prod

    # {{ .Files.Get "./config.yaml" | indent 2 }}
    configmap:
      kromgo-config:
        enabled: true
        data:
          config.yaml: |
           {{- $.Values.config | toYaml | nindent 2 }}

    persistence:
      config:
        enabled: true
        type: configmap
        readOnly: true
        objectName: kromgo-config
        mountPath: /config/config.yaml
        subPath: config.yaml
