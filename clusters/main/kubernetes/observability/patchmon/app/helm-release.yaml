---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: patchmon
  namespace: patchmon
spec:
  interval: 30m
  timeout: 25m
  maxHistory: 3
  # enabled | warn
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: app-template
      version: 18.23.5
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    gatus:
      group: monitoring
    global:
      stopAll: false
    credentials:
      cf-restic:
        bucket: "${CF_S3_RESTIC_BUCKET}-patchmon"
    image:
      repository: ghcr.io/patchmon/patchmon-server
      pullPolicy: IfNotPresent
      tag: 2.1.3@sha256:9eba4008c8e25f72929752bba7499b5deda26cf5de3e4678dbf760d16822b2f2
    quacdImage:
      repository: guacamole/guacd
      pullPolicy: IfNotPresent
      tag: 1.6.0@sha256:8974eaa9ba32f713daf311e7cc8cd7e4cdfba1edea39eed75524e78ef4b08f4f

    service:
      main:
        ports:
          main:
            port: 3000
      quacd:
        enabled: true
        type: ClusterIP
        ports:
          quacd:
            enabled: true
            port: 4822

    workload:
      main:
        podSpec:
          containers:
            main:
              imageSelector: image
              probes:
                liveness:
                  enabled: true
                  type: tcp
                readiness:
                  enabled: true
                  type: tcp
                startup:
                  enabled: true
                  type: tcp
              env:
                # HTTP port | PatchMon web/API port | default: 3000
                PORT: "{{ .Values.service.main.ports.main.port }}"
                # HTTP bind address | Listen on all interfaces | default: 0.0.0.0
                HOST: "0.0.0.0"
                # PostgreSQL connection string | Automatically generated by CNPG
                DATABASE_URL:
                  secretKeyRef:
                    name: cnpg-main-urls
                    key: std
                # PostgreSQL password | Supplied by CNPG
                # DB_PASSWORD:
                #   secretKeyRef:
                #     name: cnpg-main-user
                #     key: password
                REDIS_HOST:
                  secretKeyRef:
                    expandObjectName: false
                    name: '{{ printf "%s-%s" .Release.Name "rediscreds" }}'
                    key: plainhost
                REDIS_PASSWORD:
                  secretKeyRef:
                    expandObjectName: false
                    name: '{{ printf "%s-%s" .Release.Name "rediscreds" }}'
                    key: redis-password
                REDIS_USER: "{{ .Values.redis.redisUsername }}"
                # Redis database number | default: 0
                REDIS_DB: 0
                # Enable Redis TLS | default: false
                REDIS_TLS: false
                # Verify Redis TLS certificate | default: false
                REDIS_TLS_VERIFY: false
                # Redis connection timeout | Milliseconds | default: 60000
                REDIS_CONNECT_TIMEOUT_MS: 60000
                # Redis command timeout | Milliseconds | default: 60000
                REDIS_COMMAND_TIMEOUT_MS: 60000
                # Port the Redis server listens on.
                REDIS_PORT: 6379

                # Guacamole daemon URL | Internal Kubernetes service endpoint
                # GUACD_URL: '{{ printf "http://%v-quacd:%v" (include "tc.v1.common.lib.chart.names.fullname" $) .Values.service.quacd.ports.quacd.port }}'
                # JWT signing secret | Generate with: openssl rand -hex 64
                JWT_SECRET: "${PATCHMON_JWT_SECRET}"
                # Session encryption secret | Generate with: openssl rand -hex 64
                SESSION_SECRET: "${PATCHMON_SESSION_SECRET}"
                # AI data encryption key | Generate with: openssl rand -hex 64
                AI_ENCRYPTION_KEY: "${PATCHMON_AI_ENCRYPTION_KEY}"
                # Public frontend URL | Used for links and authentication redirects
                FRONTEND_URL: "https://patchmon.${DOMAIN_2}"
                # CORS allowed origin | Frontend URL allowed to access the API
                CORS_ORIGIN: "https://patchmon.${DOMAIN_2}"
                # Application log level | info | warn | error | debug | default: info
                LOG_LEVEL: "info"
                # Trust reverse proxy headers | Required when running behind nginx
                TRUST_PROXY: true
                # Enable HSTS headers | default: false
                ENABLE_HSTS: false
                # Maximum database connections | default: 30
                DB_CONNECTION_LIMIT: 30
                # Database pool timeout | Seconds | default: 20
                DB_POOL_TIMEOUT: 20
                # Database connection timeout | Seconds | default: 10
                DB_CONNECT_TIMEOUT: 10
                # Database idle timeout | Seconds | default: 300
                DB_IDLE_TIMEOUT: 300
                # Database connection maximum lifetime | Seconds | default: 1800
                DB_MAX_LIFETIME: 1800
                # Authentication JWT expiration | default: 1h
                JWT_EXPIRES_IN: "1h"
                # Maximum login attempts before account lockout | default: 5
                MAX_LOGIN_ATTEMPTS: 5
                # Login lockout duration | Minutes | default: 15
                LOCKOUT_DURATION_MINUTES: 15
                # Session inactivity timeout | Minutes | 0 disables timeout | default: 30
                SESSION_INACTIVITY_TIMEOUT_MINUTES: 30
                # Maximum two-factor authentication attempts | default: 5
                MAX_TFA_ATTEMPTS: 5
                # TFA lockout duration | Minutes | default: 30
                TFA_LOCKOUT_DURATION_MINUTES: 30
                # TFA remember-me duration | default: 30d
                TFA_REMEMBER_ME_EXPIRES_IN: "30d"
                # Maximum remembered TFA sessions | default: 5
                TFA_MAX_REMEMBER_SESSIONS: 5
                # Password minimum length | default: 8
                PASSWORD_MIN_LENGTH: 8
                # Require uppercase password characters | default: true
                PASSWORD_REQUIRE_UPPERCASE: true
                # Require lowercase password characters | default: true
                PASSWORD_REQUIRE_LOWERCASE: true
                # Require numeric password characters | default: true
                PASSWORD_REQUIRE_NUMBER: true
                # Require special password characters | default: true
                PASSWORD_REQUIRE_SPECIAL: true
                # Default user role | user
                DEFAULT_USER_ROLE: "user"
                # Enable OIDC authentication | default: false
                OIDC_ENABLED: true
                # OIDC issuer URL | Required when OIDC is enabled
                OIDC_ISSUER_URL: "https://patchmon.${DOMAIN_2}"
                # OIDC client ID | Required when OIDC is enabled
                OIDC_CLIENT_ID: "patchmon"
                # OIDC client secret | Required when OIDC is enabled
                OIDC_CLIENT_SECRET: "${AUTHELIA_CLIENT_SECRET_PATCHMON}"
                # OIDC callback URL | Required when OIDC is enabled
                OIDC_REDIRECT_URI: "https://patchmon.${DOMAIN_2}/api/v1/auth/oidc/login"
                # OIDC scopes | default: openid email profile groups
                OIDC_SCOPES: "openid email profile groups"
                # Automatically create users from OIDC | default: false
                OIDC_AUTO_CREATE_USERS: true
                # Default role for automatically created OIDC users | default: user
                OIDC_DEFAULT_ROLE: "user"
                # Disable local username/password authentication | default: false
                OIDC_DISABLE_LOCAL_AUTH: true
                # OIDC login button text | default: Login with SSO
                OIDC_BUTTON_TEXT: "Login with SSO"
                # Require HTTPS for OIDC | default: true
                OIDC_ENFORCE_HTTPS: true
                # Trust OIDC email addresses without verification | default: false
                OIDC_TRUST_UNVERIFIED_EMAIL: false
                # Synchronize OIDC groups to PatchMon roles | default: false
                OIDC_SYNC_ROLES: true
                OIDC_SUPERADMIN_GROUP: "lldap_admin"
                OIDC_ADMIN_GROUP: "lldap_admin_normal"
                OIDC_HOST_MANAGER_GROUP: "lldap_patchmon_mgr"
                OIDC_USER_GROUP: "lldap_patchmon"
                OIDC_READONLY_GROUP: "lldap_patchmon_readonly"

                # Enable application logging | default: true
                ENABLE_LOGGING: true
                # Maximum JSON request body size | default: 5mb
                JSON_BODY_LIMIT: "5mb"
                # Maximum agent update request body size | default: 5mb
                AGENT_UPDATE_BODY_LIMIT: "5mb"
                # Maximum compliance request body size | default: 20mb
                COMPLIANCE_BODY_LIMIT: "20mb"
                # Maximum agent ping request body size | default: 8kb
                AGENT_PING_BODY_LIMIT: "8kb"
                # Patch run stall timeout | Minutes | default: 30
                PATCH_RUN_STALL_TIMEOUT_MIN: 30
                # Agent activity report retention | Days | default: 30
                AGENT_REPORTS_RETENTION_DAYS: 30
                # Maximum database startup connection attempts | default: 30
                PM_DB_CONN_MAX_ATTEMPTS: 30
                # Delay between database startup connection attempts | Seconds | default: 2
                PM_DB_CONN_WAIT_INTERVAL: 2
            quacd:
              enabled: false
              imageSelector: quacdImage
              probes:
                liveness:
                  enabled: true
                  type: http
                  port: "{{ .Values.service.quacd.ports.quacd.port }}"
                readiness:
                  enabled: true
                  type: http
                  port: "{{ .Values.service.quacd.ports.quacd.port }}"
                startup:
                  enabled: true
                  type: tcp
                  port: "{{ .Values.service.quacd.ports.quacd.port }}"

    ingress:
      main:
        enabled: true
        ingressClassName: "internal"
        hosts:
          - host: patchmon.${DOMAIN_2}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          nginx:
            enabled: true
          certManager:
            enabled: true
            certificateIssuer: general-le-prod

    cnpg:
      main:
        enabled: true
        user: patchmon
        database: patchmon
        mode: standalone  # recovery
        cluster:
          singleNode: true
          walStorage:
            size: 10Gi
        backups:
          enabled: true
          credentials: cf-restic
          retentionPolicy: "7d"
          scheduledBackups:
            - name: daily-backup
              schedule: "50 0 * * *"
              backupOwnerReference: self
              immediate: true
              suspend: false
        recovery:
          method: object_store
          credentials: cf-restic

    redis:
      enabled: true
      redisUsername: default
