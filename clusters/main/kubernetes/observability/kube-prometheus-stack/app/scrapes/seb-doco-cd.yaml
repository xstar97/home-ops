
---
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: doco-cd-seb
  namespace: kube-prometheus-stack
spec:
  staticConfigs:
    - targets:
        - metrics.doco-cd.seb.local
  metricsPath: /metrics
  relabelings:
    - action: replace
      targetLabel: instance
      replacement: doco-cd-seb
    - action: replace
      targetLabel: job
      replacement: doco-cd-seb
