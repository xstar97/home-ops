---
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: docker-nas
  namespace: kube-prometheus-stack
spec:
  staticConfigs:
    - targets:
        - http://metrics.docker.nas.local # ${SCALE_IP}:9323
  metricsPath: /metrics
  relabelings:
    - action: replace
      targetLabel: instance
      replacement: docker-nas
    - action: replace
      targetLabel: job
      replacement: docker-nas