
---
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: node-exporter-nas
  namespace: kube-prometheus-stack
spec:
  staticConfigs:
    - targets:
        - http://node-exporter.nas.local # ${SCALE_IP}:9100
  metricsPath: /metrics
  relabelings:
    - action: replace
      targetLabel: instance
      replacement: node-nas
    - action: replace
      targetLabel: job
      replacement: node-exporter
