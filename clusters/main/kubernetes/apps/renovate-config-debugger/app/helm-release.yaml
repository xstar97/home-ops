---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate-config-debugger
  namespace: renovate-config-debugger
spec:
  interval: 30m
  timeout: 25m
  maxHistory: 3
  # enabled | warn
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: app-template
      version: 18.23.3
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    gatus:
      group: core
    global:
      stopAll: false

    image:
      repository: ghcr.io/secustor/renovate-config-debugger
      pullPolicy: IfNotPresent
      tag: 0.3.1@sha256:163bf568c0710fdb5c4d68b720957eff87acbf727c5a339af7794df98dffa501
    proxyImage:
      repository: ghcr.io/secustor/renovate-config-debugger-oauth-proxy
      pullPolicy: IfNotPresent
      tag: 0.3.1@sha256:b0b88bfd09d068064701a76244f77d296d683d4b524b05c0473eda4e49d16c9f

    securityContext:
      container:
        readOnlyRootFilesystem: false
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0

    service:
      main:
        type: ClusterIP
        ports:
          main:
            port: 80
          proxy:
            port: 8788

    ingress:
      main:
        enabled: true
        ingressClassName: "internal"
        hosts:
          - host: debugger.renovate.${DOMAIN_2}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          nginx:
            enabled: true
          certManager:
            enabled: true
            certificateIssuer: general-le-prod

    workload:
      main:
        podSpec:
          containers:
            main:
              imageSelector: image
              # envFrom:
              #   - secretRef:
              #       name: renovate-config-debugger
              env:
                RCD_OAUTH_WORKER_URL: '{{ printf "http://%v-proxy:%v" (include "tc.v1.common.lib.chart.names.fullname" $) .Values.service.main.ports.proxy.port }}'
                RCD_GITHUB_APP_SLUG: "my-renovate-config-debugger"

            proxy:
              imageSelector: proxyImage
              # envFrom:
              #   - secretRef:
              #       name: renovate-config-debugger
              env:
                ALLOWED_ORIGINS: "https://debugger.renovate.${DOMAIN_2}"
