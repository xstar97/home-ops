---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  interval: 30m
  timeout: 25m
  maxHistory: 3
  # enabled | warn
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: cloudflared
      version: 16.8.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      stopAll: false
    service:
      metrics:
        enabled: true
        primary: true
        type: ClusterIP
        ports:
          metrics:
            enabled: true
            primary: true
            port: 9101
    workload:
      main:
        podSpec:
          containers:
            main:
              probes:
                liveness:
                  enabled: false
                  type: http
                  path: /metrics
                  port: "{{ .Values.service.metrics.ports.metrics.port }}"

                readiness:
                  enabled: false
                  type: http
                  path: /metrics
                  port: "{{ .Values.service.metrics.ports.metrics.port }}"
                startup:
                  enabled: false
                  type: tcp
                  port: "{{ .Values.service.metrics.ports.metrics.port }}"
              env:
                TUNNEL_TOKEN: "${CLOUDFLARED_TALOS_TUNNEL}"
                TUNNEL_METRICS: "0.0.0.0:{{ .Values.service.metrics.ports.metrics.port }}"
