# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-adguard
  namespace: external-dns-adguard
spec:
  interval: 30m
  timeout: 25m
  maxHistory: 3
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: external-dns
      version: 1.23.0
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
      interval: 5m
  values:
    provider:
      name: webhook
      webhook:
        image:
          repository: ghcr.io/muhlba91/external-dns-provider-adguard
          tag: v11.2.1@sha256:34efadcc9d16f8baad471d26b7caba2bd9466e230d434ffff822b574fda87753
        service:
          port: 8888
        env:
          - name: ADGUARD_URL
            valueFrom:
              secretKeyRef:
                name: external-dns-adguard
                key: url
          - name: ADGUARD_USER
            valueFrom:
              secretKeyRef:
                name: external-dns-adguard
                key: user
          - name: ADGUARD_PASSWORD
            valueFrom:
              secretKeyRef:
                name: external-dns-adguard
                key: password
          - name: LOG_LEVEL
            value: info
          - name: DRY_RUN
            value: "false"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
    sources:
      - ingress
    policy: upsert-only
    registry: txt
    txtOwnerId: kubernetes
    domainFilters:
      - ${DOMAIN_0}
      - ${DOMAIN_1}
      - ${DOMAIN_2}
    logLevel: info
    logFormat: text
