---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fireflyiii
  namespace: fireflyiii
spec:
  interval: 30m
  timeout: 25m
  maxHistory: 3
  # enabled | warn
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: fireflyiii
      version: 33.14.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    gatus:
      group: financial
    global:
      stopAll: false
    credentials:
      cf-restic:
        bucket: "${CF_S3_RESTIC_BUCKET}-fireflyiii"
      rfs-restic:
        bucket: "${RUSTFS_S3_RESTIC_BUCKET}-fireflyiii"

    securityContext:
      container:
        readOnlyRootFilesystem: false
        runAsUser: 33
        runAsGroup: 33
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                APP_URL: "{{ .Values.chartContext.appUrl }}"
                STATIC_CRON_TOKEN: "${FIREFLYIII_STATIC_CRON_TOKEN}"
                APP_KEY: "${FIREFLYIII_APP_KEY}"

    ingress:
      main:
        enabled: true
        ingressClassName: "internal"
        hosts:
          - host: fireflyiii.${DOMAIN_2}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          nginx:
            enabled: true
          certManager:
            enabled: true
            certificateIssuer: general-le-prod

    persistence:
      data:
        volsync:
          - name: data
            type: restic
            credentials: cf-restic
            dest:
              enabled: true
            src:
              enabled: true

    cnpg:
      main:
        # mode: recovery
        cluster:
          singleNode: true
        backups:
          enabled: true
          credentials: cf-restic
          retentionPolicy: "7d"
          scheduledBackups:
            - name: daily-backup
              # https://crontab.guru/#10_0_*_*_*
              schedule: "10 0 * * *"
              backupOwnerReference: self
              immediate: true
              suspend: false
        recovery:
          method: object_store
          credentials: cf-restic
