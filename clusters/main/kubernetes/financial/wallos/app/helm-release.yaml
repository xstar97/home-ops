---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wallos
  namespace: wallos
spec:
  interval: 30m
  timeout: 25m
  maxHistory: 3
  # enabled | warn
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: wallos
      version: 10.7.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    gatus:
      group: financial
    global:
      stopAll: false
    credentials:
      cf-restic:
        bucket: "${CF_S3_RESTIC_BUCKET}-wallos"
      rfs-restic:
        bucket: "${RUSTFS_S3_RESTIC_BUCKET}-wallos"
    service:
      main:
        type: ClusterIP
        ports:
          main:
            port: 80
    ingress:
      main:
        enabled: true
        ingressClassName: "internal"
        hosts:
          - host: wallos.${DOMAIN_2}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          nginx:
            enabled: true
          homepage:
            enabled: true
            group: Monitoring
            widget:
              url: "http://wallos.wallos.svc.cluster.local:80"
              custom:
                key: ${HP_WALLOS_API_KEY}
          certManager:
            enabled: true
            certificateIssuer: general-le-prod
    persistence:
      database:
        volsync:
          - name: database
            type: restic
            credentials: cf-restic
            dest:
              enabled: true
            src:
              enabled: true
      logos:
        volsync:
          - name: logos
            type: restic
            credentials: cf-restic
            dest:
              enabled: true
            src:
              enabled: true
