---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crosswatch
  namespace: crosswatch
spec:
  interval: 30m
  timeout: 25m
  maxHistory: 3
  # enabled | warn
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: app-template
      version: 18.23.3
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    gatus:
      group: media-utilities
    global:
      stopAll: false
    credentials:
      cf-restic:
        bucket: "${CF_S3_RESTIC_BUCKET}-crosswatch"
      rfs-restic:
        bucket: "${RUSTFS_S3_RESTIC_BUCKET}-crosswatch"
    image:
      repository: ghcr.io/cenodude/crosswatch
      pullPolicy: IfNotPresent
      tag: 0.12.3@sha256:887d6efb8dce728b274edbd9f642c594ab2f34ca2f2d8a6bdf26682d26944331

    securityContext:
      container:
        runAsNonRoot: false
        readOnlyRootFilesystem: false
        runAsUser: 0
        runAsGroup: 0
    service:
      main:
        ports:
          main:
            port: 8787
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                WEB_PORT: "{{ .Values.service.main.ports.main.port }}"
                WEB_HOST: "0.0.0.0"
                CONFIG_BASE: "{{ .Values.persistence.config.mountPath }}"
                RUNTIME_DIR: "{{ .Values.persistence.config.mountPath }}"
                # dont change
                APP_DIR: /app
                # Set to 1 to clear stored auth and sessions on next start.
                # Remove it after the reset completes.
                # CW_RESET_AUTH_ONCE: 1
                # dev stuff
                # enable Python auto-reload for development.
                # no | yes
                # RELOAD: no
    ingress:
      main:
        enabled: true
        ingressClassName: "internal"
        hosts:
          - host: crosswatch.${DOMAIN_2}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          nginx:
            enabled: true
          certManager:
            enabled: true
            certificateIssuer: general-le-prod
    persistence:
      config:
        enabled: true
        mountPath: /config
        volsync:
          - name: config
            type: restic
            credentials: cf-restic
            dest:
              enabled: true
            src:
              enabled: true
    cnpg:
      main:
        enabled: false
