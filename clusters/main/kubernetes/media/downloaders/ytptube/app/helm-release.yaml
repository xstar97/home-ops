---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ytptube
  namespace: ytptube
spec:
  interval: 30m
  timeout: 25m
  maxHistory: 3
  # enabled | warn
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: app-template
      version: 18.23.3
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    gatus:
      group: media-downloaders
    global:
      stopAll: false
    credentials:
      cf-restic:
        bucket: "${CF_S3_RESTIC_BUCKET}-ytptube"
      rfs-restic:
        bucket: "${RUSTFS_S3_RESTIC_BUCKET}-ytptube"
    image:
      repository: ghcr.io/arabcoders/ytptube
      pullPolicy: IfNotPresent
      tag: v2.7.4@sha256:8f099c5d9426521fa7307d5137be1b219eac4ef429091ee63f63297fce606bd7
    service:
      main:
        ports:
          main:
            port: 8081
    configmap:
      ytptube-config:
        enabled: true
        data:
          config.toml: |
            [auth]
            external_user = "owner"

            [auth.oidc]
            issuer = "https://auth.${DOMAIN_2}"
            client_id = "ytptube"
            client_secret = "${AUTHELIA_CLIENT_SECRET_YTPTUBE}"
            redirect_uri = "https://ytptube.${DOMAIN_2}/ytptube/api/auth/oidc/callback"

            [auth.remote_user]
            enabled = true
            header = "Remote-User"
            trusted_proxies = ["${PODNET}","${SVCNET}"]

    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                YTP_MONITOR_ENABLED: true
    ingress:
      main:
        enabled: true
        ingressClassName: "internal"
        hosts:
          - host: ytptube.${DOMAIN_2}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          nginx:
            enabled: true
            auth:
              type: "authelia"
              internalHost: "authelia.authelia.svc.cluster.local:9091"
              externalHost: "auth.${DOMAIN_2}"
          certManager:
            enabled: true
            certificateIssuer: general-le-prod
    persistence:
      config:
        enabled: true
        mountPath: /config
        volsync:
          - name: config
            type: restic
            credentials: cf-restic
            dest:
              enabled: true
            src:
              enabled: true
      ytptube-config:
        enabled: true
        type: configmap
        mountPath: /config/config.toml
        objectName: ytptube-config
        readOnly: true
        subPath: config.toml
      downloads:
        enabled: true
        type: nfs
        server: ${SCALE_IP}
        path: "${DOWNLOADS_NFS}/complete/manual"
        mountPath: "${DOWNLOADS_LOCAL}"
    redis:
      enabled: false
    cnpg:
      main:
        enabled: false
