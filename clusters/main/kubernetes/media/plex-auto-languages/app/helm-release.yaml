---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plex-auto-languages
  namespace: plex-auto-languages
spec:
  interval: 30m
  timeout: 25m
  maxHistory: 3
  # enabled | warn
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: plex-auto-languages
      version: 12.9.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      stopAll: false
    credentials:
      cf-restic:
        bucket: "${CF_S3_RESTIC_BUCKET}-plex-auto-languages"
      rfs-restic:
        bucket: "${RUSTFS_S3_RESTIC_BUCKET}-plex-auto-languages"
    service:
      main:
        enabled: false
        ports:
          main:
            enabled: false
    workload:
      main:
        podSpec:
          containers:
            main:
              probes:
                liveness:
                  enabled: false
                readiness:
                  enabled: false
                startup:
                  enabled: false
              env:
                PLEX_TOKEN: ${PLEX_TOKEN_PAL}
                PLEX_URL: ${PLEX_CLUSTER_URL}

    configmap:
      config:
        enabled: true
        data:
          config.yaml: |
            plexautolanguages:
              # show | season
              update_level: "show"
              # all | next
              update_strategy: "all"

              trigger_on_play: true
              trigger_on_scan: true
              trigger_on_activity: false

              refresh_library_on_scan: false
              
              ignore_labels:
                - PAL_IGNORE

              plex:
                url: "${PLEX_CLUSTER_URL}"
                token: "${PLEX_TOKEN_PAL}"

              scheduler:
                enable: true
                schedule_time: "04:30"

              notifications:
                enable: true
                # The array 'events' can be specified in order to get notifications only for specific events
                #   Valid event values: "play_or_activity" "new_episode" "updated_episode" "scheduler"
                #   Defaults to all events if not present
                apprise_configs:
                  # This URL will be notified of all changes during all events
                  - "${PLEX_AUTO_LANGUAGE_APPRISE_DISCORD}"
              debug: false

    persistence:
      config:
        volsync:
          - name: config
            type: restic
            credentials: cf-restic
            dest:
              enabled: true
            src:
              enabled: true
      configfile:
        enabled: true
        mountPath: /config/config.yaml
        subPath: config.yaml
        readOnly: true
        type: "configmap"
        objectName: config