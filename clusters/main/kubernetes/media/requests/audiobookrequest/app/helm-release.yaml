---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: audiobookrequest
  namespace: audiobookrequest
spec:
  interval: 30m
  timeout: 25m
  maxHistory: 3
  # enabled | warn
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: app-template
      version: 18.20.3
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    gatus:
      group: media-requests
    global:
      stopAll: false
    credentials:
      cf-restic:
        bucket: "${CF_S3_RESTIC_BUCKET}-audiobookrequest"
      rfs-restic:
        bucket: "${RUSTFS_S3_RESTIC_BUCKET}-audiobookrequest"
    image:
      repository: markbeep/audiobookrequest
      pullPolicy: IfNotPresent
      tag: 1.10.7@sha256:7b7df351abece608fb84147dc43705f0eb1b350fc1427e0a7e5fea84a7852a19
    securityContext:
      container:
        readOnlyRootFilesystem: false
    service:
      main:
        ports:
          main:
            port: 8080
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                ABR_APP__PORT: "{{ .Values.service.main.ports.main.port }}"
                ABR_APP__CONFIG_DIR: "{{.Values.persistence.config.mountPath }}"
                # ABR_APP__OPENAPI_ENABLED: false
                ABR_APP__DEBUG: true
                # ABR_DB__SQLITE_PATH: db.sqlite
                # ABR_APP__LOG_LEVEL: INFO # DEBUG, INFO, WARN, ERROR
                # ABR_APP__BASE_URL: /
                ABR_APP__DEFAULT_REGION: us # us, ca, uk, au, fr, de, jp, it, in, es, br
                ABR_APP__FORCE_LOGIN_TYPE: oidc # basic, forms, oidc, or none
                ABR_APP__INIT_ROOT_USERNAME: "${ABR_INITIAL_USER}"
                ABR_APP__INIT_ROOT_PASSWORD: "${ABR_INITIAL_PASS}"
                ABR_DB__USE_POSTGRES: true
                ABR_DB__POSTGRES_HOST: '{{ .Values.cnpg.main.creds.host | trimAll "\"" }}'
                ABR_DB__POSTGRES_PORT: 5432
                ABR_DB__POSTGRES_DB: audiobookrequest
                ABR_DB__POSTGRES_USER: "{{ .Values.cnpg.main.user }}"
                ABR_DB__POSTGRES_PASSWORD: '{{  .Values.cnpg.main.creds.password | trimAll "\"" }}'
                # ABR_DB__POSTGRES_SSL_MODE: "prefer"
    ingress:
      main:
        enabled: true
        ingressClassName: "internal"
        hosts:
          - host: abr.${DOMAIN_2}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          nginx:
            enabled: true
          certManager:
            enabled: true
            certificateIssuer: general-le-prod
    persistence:
      config:
        enabled: true
        mountPath: /config
        volsync:
          - name: config
            type: restic
            credentials: cf-restic
            dest:
              enabled: true
            src:
              enabled: true
    cnpg:
      main:
        enabled: true
        user: abr
        database: audiobookrequest
        mode: recovery
        cluster:
          singleNode: true
        backups:
          enabled: true
          credentials: cf-restic
          retentionPolicy: "7d"
          scheduledBackups:
            - name: daily # name too long!
              # https://crontab.guru/#45_0_*_*_*
              schedule: "45 0 * * *"
              backupOwnerReference: self
              immediate: true
              suspend: false
        recovery:
          method: object_store
          credentials: cf-restic
