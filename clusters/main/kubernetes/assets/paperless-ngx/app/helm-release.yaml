---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless-ngx
  namespace: paperless-ngx
spec:
  interval: 30m
  timeout: 25m
  maxHistory: 3
  # enabled | warn
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: paperless-ngx
      version: 15.2.2
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    gatus:
      group: assets
    global:
      stopAll: false
    credentials:
      cf-restic:
        bucket: "${CF_S3_RESTIC_BUCKET}-paperless-ngx"
      rfs-restic:
        bucket: "${RUSTFS_S3_RESTIC_BUCKET}-paperless-ngx"
    paperless:
      openid_connect:
        SCOPE:
          - openid
          - profile
          - email
        OAUTH_PKCE_ENABLED: true
        APPS:
          - provider_id: authelia
            name: Authelia
            client_id: paperless
            secret: ${AUTHELIA_CLIENT_PAPERLESS_SECRET}
            settings:
              server_url: https://auth.${DOMAIN_2}
              token_auth_method: client_secret_basic
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                PAPERLESS_URL: "{{ .Values.chartContext.appUrl }}"
                # PAPERLESS_WEBSERVER_WORKERS: 2
                PAPERLESS_ADMIN_USER: "${PAPERLESS_ADMIN_USER}"
                PAPERLESS_ADMIN_PASSWORD: "${PAPERLESS_ADMIN_PASS}"
                PAPERLESS_ADMIN_MAIL: "${PAPERLESS_ADMIN_MAIL}"
                PAPERLESS_OCR_LANGUAGE: "eng"
                PAPERLESS_OCR_LANGUAGES: "eng fra deu spa ita"
                PAPERLESS_CONSUMER_POLLING: 60
                PAPERLESS_CONSUMER_POLLING_RETRY_COUNT: 3
                PAPERLESS_CONSUMER_POLLING_DELAY: 5
                PAPERLESS_APPS: 'allauth.socialaccount.providers.openid_connect'
                PAPERLESS_SOCIALACCOUNT_PROVIDERS: "{{ .Values.paperless | toJson }}"
                PAPERLESS_DISABLE_REGULAR_LOGIN: false
                PAPERLESS_REDIRECT_LOGIN_TO_SSO: false
                PAPERLESS_ACCOUNT_SESSION_REMEMBER: true
    ingress:
      main:
        enabled: true
        ingressClassName: "internal"
        hosts:
          - host: paperless.${DOMAIN_2}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          nginx:
            enabled: true
          certManager:
            enabled: true
            certificateIssuer: general-le-prod
    persistence:
      data:
        volsync:
          - name: data
            type: restic
            credentials: cf-restic
            dest:
              enabled: true
            src:
              enabled: true
      consume:
        enabled: true
        type: nfs
        server: ${SCALE_IP}
        path: "${DOCS_NFS}/import"
      media:
        type: nfs
        server: ${SCALE_IP}
        path: "${DOCS_NFS}/data"
        volsync:
          - name: data
            type: restic
            credentials: cf-restic
            dest:
              enabled: true
            src:
              enabled: true
      varrun:
        enabled: false

    cnpg:
      main:
        enabled: true
        mode: recovery
        cluster:
          singleNode: true
          walStorage:
            size: 100Gi
        backups:
          enabled: true
          credentials: cf-restic
          retentionPolicy: "7d"
          scheduledBackups:
            - name: daily-backup
              # https://crontab.guru/#0_8_*_*_*
              schedule: "0 8 * * *"
              backupOwnerReference: self
              immediate: true
              suspend: false
        recovery:
          method: object_store
          credentials: cf-restic
