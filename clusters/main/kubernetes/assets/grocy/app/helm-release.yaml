---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grocy
  namespace: grocy
spec:
  interval: 30m
  timeout: 25m
  maxHistory: 3
  # enabled | warn
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: grocy
      version: 22.11.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    gatus:
      group: assets
    global:
      stopAll: false

    credentials:
      cf-restic:
        bucket: "${CF_S3_RESTIC_BUCKET}-grocy"
      rfs-restic:
        bucket: "${RUSTFS_S3_RESTIC_BUCKET}-grocy"

    configmap:
      settingoverrides:
        enabled: true
        data:
          AUTH_CLASS.txt: 'Grocy\Middleware\Auth\ReverseProxyAuthMiddleware'
          REVERSE_PROXY_AUTH_HEADER.txt: "Remote-User"
          REVERSE_PROXY_AUTH_USE_ENV.txt: "false"
          DISABLE_AUTH.txt: "false"

    workload:
      main:
        podSpec:
          containers:
            main:
              env:
              probes:
                liveness:
                  path: "/api/system/info"
                readiness:
                  path: "/api/system/info"
                startup:
                  type: tcp
                  
    ingress:
      main:
        enabled: true
        ingressClassName: "external"
        hosts:
          - host: grocy.${DOMAIN_2}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          nginx:
            enabled: true
            auth:
              type: "authelia"
              internalHost: "authelia.authelia.svc.cluster.local:9091"
              externalHost: "auth.${DOMAIN_2}"
          certManager:
            enabled: true
            certificateIssuer: general-le-prod

    persistence:
      config:
        volsync:
          - name: config
            type: restic
            credentials: cf-restic
            dest:
              enabled: true
            src:
              enabled: true
      auth-class:
        enabled: true
        type: configmap
        objectName: settingoverrides
        mountPath: /data/AUTH_CLASS.txt
        subPath: AUTH_CLASS.txt
        readOnly: true
      reverse-proxy-auth-header:
        enabled: true
        type: configmap
        objectName: settingoverrides
        mountPath: /data/REVERSE_PROXY_AUTH_HEADER.txt
        subPath: REVERSE_PROXY_AUTH_HEADER.txt
        readOnly: true
      reverse-proxy-auth-use-env:
        enabled: true
        type: configmap
        objectName: settingoverrides
        mountPath: /data/REVERSE_PROXY_AUTH_USE_ENV.txt
        subPath: REVERSE_PROXY_AUTH_USE_ENV.txt
        readOnly: true
      disable-auth:
        enabled: true
        type: configmap
        objectName: settingoverrides
        mountPath: /data/DISABLE_AUTH.txt
        subPath: DISABLE_AUTH.txt
        readOnly: true