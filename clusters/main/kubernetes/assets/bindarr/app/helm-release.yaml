---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bindarr
  namespace: bindarr
spec:
  interval: 30m
  timeout: 25m
  maxHistory: 3
  # enabled | warn
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: app-template
      version: 21.0.16
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    gatus:
      group: assets
    global:
      stopAll: false
    credentials:
      cf-restic:
        bucket: "${CF_S3_RESTIC_BUCKET}-bindarr"
      rfs-restic:
        bucket: "${RUSTFS_S3_RESTIC_BUCKET}-bindarr"
    image:
      repository: ghcr.io/thenotoriousjeremy/bindarr
      pullPolicy: IfNotPresent
      tag: 1.8.8@sha256:5a26ff17911d5f8ddb3f71b6c78c129e259fac6949c659c12eed4ec2a5e0b906
    securityContext:
      container:
        readOnlyRootFilesystem: false
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
    service:
      main:
        type: ClusterIP
        ports:
          main:
            port: 3001
    workload:
      main:
        podSpec:
          containers:
            main:
              probes:
                liveness:
                  type: http
                  path: "/api/health"
                readiness:
                  type: http
                  path: "/api/health"
                startup:
                  type: tcp
              env:
                PORT: "{{ .Values.service.main.ports.main.port }}"
                HTTPS_PORT: ""
                PUBLIC_BASE_URL: "https://bindarr.${DOMAIN_2}"
                TRUST_PROXY: "2"

                DB_PATH: "{{ .Values.persistence.database.mountPath }}/bindarr.db"
                CV_MODEL_DIR: "{{ .Values.persistence.models.mountPath }}"

                OIDC_ENABLED: "true"
                OIDC_ISSUER_URL: "https://auth.${DOMAIN_2}"
                OIDC_CLIENT_ID: "bindarr"
                OIDC_PROVIDER_NAME: "Authelia"
                OIDC_USER_CLAIM: "preferred_username"
                OIDC_AUTO_PROVISION: "true"
                OIDC_ALLOW_USERNAME_LINK: "false"
                OIDC_TOKEN_ENDPOINT_AUTH_METHOD: "client_secret_basic"
                OIDC_CLIENT_SECRET: "${AUTHELIA_CLIENT_SECRET_BINDARR}"

    ingress:
      main:
        enabled: true
        ingressClassName: "external"
        integrations:
          nginx:
            enabled: true
          certManager:
            enabled: true
            certificateIssuer: general-le-prod
        hosts:
          - host: bindarr.${DOMAIN_2}
            paths:
              - path: /
                pathType: Prefix

    persistence:
      database:
        enabled: true
        mountPath: "/app/database"
        volsync:
          - name: database
            type: restic
            credentials: cf-restic
            dest:
              enabled: true
            src:
              enabled: true
      models:
        enabled: false
        mountPath: "/app/database/models"
        volsync:
          - name: models
            type: restic
            credentials: cf-restic
            dest:
              enabled: false
            src:
              enabled: false
