---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: yarnl
  namespace: yarnl
spec:
  interval: 30m
  timeout: 25m
  maxHistory: 3
  # enabled | warn
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: app-template
      version: 18.16.11
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    gatus:
      group: assets
    global:
      stopAll: false
    credentials:
      cf-restic:
        bucket: "${CF_S3_RESTIC_BUCKET}-yarnl"
      rfs-restic:
        bucket: "${RUSTFS_S3_RESTIC_BUCKET}-yarnl"
    image:
      repository: titandrive/yarnl
      pullPolicy: IfNotPresent
      tag: 0.11.1@sha256:188171d66e5aa85b75a0c8ef37bbc11e66a460394f3e13f27d3dd27f29c85403
    securityContext:
      container:
        runAsNonRoot: false
        readOnlyRootFilesystem: false
        runAsUser: 0
        runAsGroup: 0
    service:
      main:
        ports:
          main:
            port: 3000
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                POSTGRES_HOST:
                  secretKeyRef:
                    name: cnpg-main-urls
                    key: host
                POSTGRES_PORT: "5432"
                POSTGRES_DB: "{{ .Values.cnpg.main.database }}"
                POSTGRES_USER: "{{ .Values.cnpg.main.user }}"
                POSTGRES_PASSWORD:
                  secretKeyRef:
                    name: cnpg-main-user
                    key: password
                ADMIN_USERNAME: ${YARNL_ADMIN_USER}
                ADMIN_PASSWORD: ${YARNL_ADMIN_PASS}
    ingress:
      main:
        enabled: true
        ingressClassName: "internal"
        hosts:
          - host: yarnl.${DOMAIN_2}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          nginx:
            enabled: true
          certManager:
            enabled: true
            certificateIssuer: general-le-prod
    persistence:
      users:
        enabled: true
        mountPath: /app/users
        volsync:
          - name: users
            type: restic
            credentials: cf-restic
            dest:
              enabled: true
            src:
              enabled: true
      backups:
        enabled: true
        mountPath: /backups
        volsync:
          - name: backups
            type: restic
            credentials: cf-restic
            dest:
              enabled: true
            src:
              enabled: true
      uploads:
        enabled: true
        type: emptyDir
        mountPath: /app/temp-uploads

    cnpg:
      main:
        enabled: true
        user: yarnl
        database: yarnl
        mode: recovery
        cluster:
          singleNode: true
          walStorage:
            size: 10Gi
        backups:
          enabled: true
          credentials: cf-restic
          retentionPolicy: "7d"
          scheduledBackups:
            - name: daily-backup
              # https://crontab.guru/#0_8_*_*_*
              schedule: "0 8 * * *"
              backupOwnerReference: self
              immediate: true
              suspend: false
        recovery:
          method: object_store
          credentials: cf-restic
