apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: snapshot-delete
  namespace: longhorn-system
spec:
  concurrency: 1
  cron: 0 2 * * *
  # groups:
  # - default
  # Do not run this against every volume: it can remove CSI snapshots that
  # VolSync is still using as a clone source.
  name: delete
  retain: 0
  task: snapshot-delete