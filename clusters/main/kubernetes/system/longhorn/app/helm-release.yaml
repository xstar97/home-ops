---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 5m
  releaseName: longhorn
  timeout: 25m
  maxHistory: 3
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: longhorn
      version: 1.13.0
      sourceRef:
        kind: HelmRepository
        name: home-ops-mirror
        namespace: flux-system
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    defaultSettings:
      # Matches the Talos UserVolumeConfig named "longhorn".
      defaultDataPath: /var/mnt/longhorn
      # Single-node cluster.
      defaultReplicaCount: "1"
      # Required for the current VolSync workload.
      storageOverProvisioningPercentage: "100000"
    persistence:
      # Use Longhorn as the default StorageClass.
      defaultClass: true
      # Single-node cluster.
      defaultClassReplicaCount: 1
    networkPolicies:
      # Preserve the Longhorn network-policy model already present in the cluster.
      enabled: true
      # Keep Longhorn component traffic restricted to authorized components.
      restrictInternalTraffic: true
      # Allow only kube-prometheus-stack Prometheus pods to scrape Longhorn
      # Manager on TCP/9500.
      metricsScrapeSources:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-prometheus-stack
          podSelector:
            matchLabels:
              prometheus: kube-prometheus-stack
    metrics:
      serviceMonitor:
        enabled: true
