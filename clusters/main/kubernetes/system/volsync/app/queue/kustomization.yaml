apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cronjob.yaml
  - rbac.yaml
configMapGenerator:
  - name: volsync-queue-script
    namespace: volsync
    files:
      - volsync-queue.sh=volsync-queue.sh
generatorOptions:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
