---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: volsync
  namespace: volsync
spec:
  interval: 5m
  timeout: 25m
  maxHistory: 3
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: volsync
      version: 4.10.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    image:
      repository: quay.io/backube/volsync
      pullPolicy: IfNotPresent
      tag: 0.16.0@sha256:f9cd9aaa33de9e71239c86bed2d255341160f6115c13767a0aed1b9fd1e5aff9

      # -- Options for the main traefik service, where the entrypoints traffic comes from
      # from.
      service:
        main:
          ports:
            main:
              port: 8081
              targetPort: 8081
              protocol: http
        metrics:
          enabled: true
          type: ClusterIP
          ports:
            metrics:
              enabled: true
              port: 8080
              targetPort: 8080
              protocol: http

    workload:
      main:
        podSpec:
          containers:
            main:
              args:
                - --health-probe-bind-address=:8081
                - --metrics-bind-address=127.0.0.1:8080
                - --metrics-require-rbac=false
                - --metrics-secure=false
                - --leader-elect
                - --rclone-container-image={{ printf "%s:%s" .Values.image.repository .Values.image.tag }}
                - --restic-container-image={{ printf "%s:%s" .Values.image.repository .Values.image.tag }}
                - --rsync-container-image={{ printf "%s:%s" .Values.image.repository .Values.image.tag }}
                - --rsync-tls-container-image={{ printf "%s:%s" .Values.image.repository .Values.image.tag }}
                - --syncthing-container-image={{ printf "%s:%s" .Values.image.repository .Values.image.tag }}
                - --scc-name=volsync-privileged-mover
              probes:
                liveness:
                  path: "/healthz"
                readiness:
                  path: "/readyz"
                startup:
                  path: "/readyz"
            kube-rbac-proxy:
              enabled: false
              imageSelector: proxyImage

    metrics:
      main:
        enabled: true
        type: servicemonitor
        endpoints:
          - port: metrics
            path: /metrics
            scheme: http
            # tlsConfig: null
        targetSelector: metrics