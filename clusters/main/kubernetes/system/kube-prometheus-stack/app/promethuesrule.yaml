apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: node-exporter
  namespace: kube-prometheus-stack
spec:
  groups:
  - name: node-exporter.rules
    rules:

    # TrueNAS → 98%
    - alert: NodeMemoryHighUtilization
      expr: |
        100 - (
          node_memory_MemAvailable_bytes{job="node-exporter", instance="${CONFIG_TRUENAS_IP}:9100"}
          / node_memory_MemTotal_bytes{job="node-exporter", instance="${CONFIG_TRUENAS_IP}:9100"}
          * 100
        ) > 98
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: Host is running out of memory (TrueNAS)
        description: |
          TrueNAS uses RAM aggressively as ZFS ARC cache.
          Memory usage > 98% on {{ $labels.instance }}.

    # Alle andere nodes → 90%
    - alert: NodeMemoryHighUtilization

    
      expr: |
        100 - (
          node_memory_MemAvailable_bytes{job="node-exporter", instance!="${CONFIG_TRUENAS_IP}:9100"}
          / node_memory_MemTotal_bytes{job="node-exporter", instance!="${CONFIG_TRUENAS_IP}:9100"}
          * 100
        ) > 90
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: Host is running out of memory.
        description: |
          Memory is filling up at {{ $labels.instance }}, has been above 90% for the last 15 minutes, is currently at {{ printf "%.2f" $value }}%.

    # -------------------------
    # ETCD → 25% warning
    # -------------------------
    - alert: EtcdDBUsageWarning
      expr: (100 * (etcd_mvcc_db_total_size_in_bytes - etcd_mvcc_db_total_size_in_use_in_bytes) / etcd_mvcc_db_total_size_in_bytes) > 25 and (100 * (etcd_mvcc_db_total_size_in_bytes - etcd_mvcc_db_total_size_in_use_in_bytes) / etcd_mvcc_db_total_size_in_bytes) <= 50
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: Etcd DB fragmentation above 25%
        description: |
          Etcd DB fragmentation is above 25% on {{ $labels.instance }}.
          Current value: {{ printf "%.2f" $value }}%

    # -------------------------
    # ETCD → 50% attention
    # -------------------------
    - alert: EtcdDBUsageAttention
      expr: (100 * (etcd_mvcc_db_total_size_in_bytes - etcd_mvcc_db_total_size_in_use_in_bytes) / etcd_mvcc_db_total_size_in_bytes) > 50 and (100 * (etcd_mvcc_db_total_size_in_bytes - etcd_mvcc_db_total_size_in_use_in_bytes) / etcd_mvcc_db_total_size_in_bytes) <= 75
      for: 10m
      labels:
        severity: critical
      annotations:
        summary: Etcd DB fragmentation above 50%
        description: |
          Etcd DB fragmentation is above 50% on {{ $labels.instance }}.
          Current value: {{ printf "%.2f" $value }}%

    # -------------------------
    # ETCD → 75% critical
    # -------------------------
    - alert: EtcdDBUsageCritical
      expr: (100 * (etcd_mvcc_db_total_size_in_bytes - etcd_mvcc_db_total_size_in_use_in_bytes) / etcd_mvcc_db_total_size_in_bytes) > 75
      for: 10m
      labels:
        severity: critical
      annotations:
        summary: Etcd DB fragmentation critically high
        description: |
          Etcd DB fragmentation is above 75% on {{ $labels.instance }}.
          Current value: {{ printf "%.2f" $value }}%