---
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: node-exporter-truenas
  namespace: kube-prometheus-stack
spec:
  staticConfigs:
    - targets:
        - ${SCALE_IP}:9100
  metricsPath: /metrics
  relabelings:
    - action: replace
      targetLabel: instance
      replacement: node-truenas
    - action: replace
      targetLabel: job
      replacement: node-exporter-truenas
---
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: node-exporter-seb
  namespace: kube-prometheus-stack
spec:
  staticConfigs:
    - targets:
        - ${SEB_IP}:9100
  metricsPath: /metrics
  relabelings:
    - action: replace
      targetLabel: instance
      replacement: node-seb
    - action: replace
      targetLabel: job
      replacement: node-exporter-seb
