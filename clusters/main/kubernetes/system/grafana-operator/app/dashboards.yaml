  namespace: grafana
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  grafanaCom:
    id: 20842
    revision: 3
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: Prometheus

