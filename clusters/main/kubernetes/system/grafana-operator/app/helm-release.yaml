---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-operator
  namespace: grafana-operator
spec:
  interval: 5m
  timeout: 25m
  maxHistory: 3
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: grafana-operator
      version: 5.25.0
      sourceRef:
        kind: HelmRepository
        name: grafana-operator
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    serviceMonitor:
      # -- Whether to create a ServiceMonitor
      enabled: true
    dashboard:
      enabled: true
      labels:
        dashboards: grafana
