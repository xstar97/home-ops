---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
  namespace: openebs
spec:
  interval: 5m
  releaseName: openebs
  timeout: 25m
  maxHistory: 3
  driftDetection:
    mode: warn
  chart:
    spec:
      chart: openebs
      version: 4.5.0
      sourceRef:
        kind: HelmRepository
        name: openebs
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    openebs-crds:
      csi:
        volumeSnapshots:
          enabled: false
          keep: false

    engines:
      local:
        # The lvm-localpv backend contains a duplicate of snapshot controller which will cause conflicts
        lvm:
          enabled: false
        # The ZFS backend contains a duplicate of snapshot controller which will cause conflicts
        zfs:
          enabled: false
      replicated:
        # The Mayastor backend contains a duplicate of snapshot controller which will cause conflicts
        mayastor:
          enabled: false

    loki:
      enabled: false
    alloy:
      enabled: false
