---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate-operator
  namespace: renovate-operator
spec:
  interval: 5m
  timeout: 25m
  maxHistory: 3
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: renovate-operator
      version: 6.3.0
      sourceRef:
        kind: HelmRepository
        name: mogenius
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:

    ingress:
      enabled: true
      ingressClassName: "external"
      annotations:
        cert-manager.io/cluster-issuer: general-le-prod
        cert-manager.io/private-key-rotation-policy: Always
      host: renovate.${DOMAIN_2}
      tls:
        enabled: true
        secretName: renovate-tls-0

    webhook:
      enabled: true
      baseUrl: https://renovate.${DOMAIN_2}