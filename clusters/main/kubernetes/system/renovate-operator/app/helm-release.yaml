---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate-operator
  namespace: renovate-operator
spec:
  interval: 5m
  timeout: 25m
  maxHistory: 3
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: renovate-operator
      version: 6.3.0
      sourceRef:
        kind: HelmRepository
        name: mogenius
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    config:
      logStorage:
        # -- log store mode: "disabled" (default, no-op), "memory" (in-process), "valkey" (needs valkey enabled), or "s3" (needs s3.bucket set)
        mode: valkey
    policy:
      enabled: true
    webhook:
      enabled: true
      unifiedWebhookHost: true
    auth:
      oidc:
        enabled: false
        issuerUrl: https://auth.${DOMAIN_2}
        clientId: renovate-operator
        existingSecret: oidc-secret
        secretKey: client-secret
        # sessionSecretKey: session-secret
        groupsClaim: groups
        additionalScopes:
          - groups
        pkceEnabled: true
    authorization:
      enabled: false
      defaults:
        readerGroups:
          - lldap_renovate
        adminGroups:
          - lldap_admin
        readerUsers: []
        adminUsers: []
        anonymousRead: false
        anonymousReadLogs: false
    ingress:
      enabled: true
      ingressClassName: "external"
      host: renovate.${DOMAIN_2}
      annotations:
        cert-manager.io/cluster-issuer: general-le-prod
        cert-manager.io/private-key-rotation-policy: Always
      tls:
        - hosts:
            - renovate.${DOMAIN_2}
          secretName: renovate-tls-0
    valkey:
      enabled: true
      auth:
        enabled: true
        aclUsers:
          default:
            password: "default"
            passwordKey: ""
            permissions: "~* &* +@all"
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
      dashboard:
        enabled: true
        labels:
          grafana_dashboard: "1"
        namespace: grafana
        grafanaDashboard:
          allowCrossNamespaceImport: true
          instanceSelector:
            matchLabels:
              dashboards: grafana
          folderRef: Network
