---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: 13ft
  namespace: 13ft
spec:
  interval: 30m
  timeout: 25m
  maxHistory: 3
  # enabled | warn
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: app-template
      version: 18.23.2
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    gatus:
      group: tools
    global:
      stopAll: false
    credentials:
      cf-restic:
        bucket: "${CF_S3_RESTIC_BUCKET}-13ft"
      rfs-restic:
        bucket: "${RUSTFS_S3_RESTIC_BUCKET}-13ft"
    image:
      repository: ghcr.io/wasi-master/13ft
      pullPolicy: IfNotPresent
      tag: 0.4.1@sha256:c592a96b7bdcbfe395a025afa9769392b1a1abca0a789a1fdcf93a8aa768fe53
    securityContext:
        container:
          readOnlyRootFilesystem: false
          runAsNonRoot: false
          runAsUser: 0
          runAsGroup: 0

    service:
      main:
        ports:
          main:
            port: 5000
    ingress:
      main:
        enabled: true
        ingressClassName: "internal"
        hosts:
          - host: 13ft.${DOMAIN_2}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          nginx:
            enabled: true
          certManager:
            enabled: true
            certificateIssuer: general-le-prod
    cnpg:
      main:
        enabled: false
