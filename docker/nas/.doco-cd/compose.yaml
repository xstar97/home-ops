x-healthcheck: &healthcheck
  test: ["CMD", "/doco-cd", "healthcheck"]
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 15s

services:
  doco-cd:
    image: ghcr.io/kimdre/doco-cd:0.123@sha256:11b474122ed530614cbe4cb8390f94b646d3fc8ba40d74c0f0b7f55a8ca719f8
    container_name: doco-cd
    restart: unless-stopped
    networks:
      - internal
      - network_internal
    ports:
      - "9080:9080"
      - "9120:9120"
    healthcheck: *healthcheck
    env_file:
      - ./secrets.enc.env
    environment:
      TZ: America/New_York
      HTTP_PORT: 9080
      APPRISE_API_URL: http://apprise:8000/notify
      APPRISE_NOTIFY_URLS: http://apprise:8000/notify/doco-cd
      APPRISE_NOTIFY_LEVEL: success
      DOCKER_SWARM_FEATURES: "false"
      DEPLOY_CONFIG_BASE_DIR: ./docker/nas/
      PASS_ENV: "false"
      POLL_CONFIG: |
        - url: https://github.com/xstar97/home-ops
          reference: main
          interval: 3600
      SOPS_AGE_KEY_FILE: /run/secrets/sops_age_key
      SSH_PRIVATE_KEY_FILE: /run/secrets/ssh_private_key
      SSH_PRIVATE_KEY_PASSPHRASE: ""
      GITHUB_APP_PRIVATE_KEY_FILE: /run/secrets/github_app_private_key
      SECRET_PROVIDER: bitwarden_sm
      SELF_UPDATE_ENABLED: "true"
      SELF_UPDATE_STRATEGY: applier
    secrets:
      - sops_age_key
      - ssh_private_key
      - github_app_private_key
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - doco_data:/data
  
networks:
  internal:
    driver: bridge
  network_internal:
    external: true
volumes:
  doco_data: {}
secrets:
  sops_age_key:
    file: ${AGEKEY_FILE}
  ssh_private_key:
    file: ${SSH_KEY_FILE}
  github_app_private_key:
    file: ${GITHUB_APP_PRIVATE_KEY_FILE}
