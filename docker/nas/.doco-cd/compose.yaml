services:
  apprise:
    image: caronc/apprise:v1.4.1@sha256:25e0577915c2f06233ae1dce077f05c0fc9ba4f0ea89de5aee18a32b2ee9a75c
    container_name: apprise
    restart: unless-stopped
    networks:
      - internal
    expose:
      - "8000"
    environment:
      TZ: America/New_York
      APPRISE_WORKER_COUNT: 1
      APPRISE_STATEFUL_MODE: simple
      # APPRISE_ADMIN: "y"
    volumes:
      - /mnt/SSD/apps/apprise/config:/config
      - /mnt/SSD/apps/apprise/attach:/attach
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -o /dev/null http://localhost:8000/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - wud.tag.include=^\\d+\\.\\d+\\.\\d+$
  doco-cd:
    image: ghcr.io/kimdre/doco-cd:0.90@sha256:5d61ef8178a58bad26e2876aac19c236984d9bdce6fac22f24e098c65ea04ccf
    container_name: doco-cd
    restart: unless-stopped
    depends_on:
      apprise:
        condition: service_healthy
    networks:
      - internal
      - network_internal
    ports:
      - "9080:9080"
      - "9120:9120"
    environment:
      TZ: America/New_York
      HTTP_PORT: 9080
      SSH_PRIVATE_KEY_FILE: /run/secrets/ssh_private_key
      SSH_PRIVATE_KEY_PASSPHRASE: ""
      SOPS_AGE_KEY_FILE: /run/secrets/sops_age_key
      APPRISE_API_URL: http://apprise:8000/notify
      APPRISE_NOTIFY_URLS: http://apprise:8000/notify/doco-cd
      APPRISE_NOTIFY_LEVEL: success
      DOCKER_SWARM_FEATURES: "false"
      DEPLOY_CONFIG_BASE_DIR: ./docker/nas/
      WEBHOOK_SECRET_FILE: /run/secrets/webhook_secret
      PASS_ENV: "false"
      POLL_CONFIG: |
        - url: https://github.com/xstar97/home-ops
          reference: main
          interval: 3600
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - doco_data:/data
      - /mnt/SSD/users/admin/admin/.ssh/id_ed25519:/run/secrets/ssh_private_key:ro
      - /mnt/SSD/apps/home-ops/age.agekey:/run/secrets/sops_age_key:ro
      - /mnt/SSD/apps/home-ops/docker/seb/.doco-cd/webhook.enc.txt:/run/secrets/webhook_secret:ro
    healthcheck:
      test: ["CMD", "/doco-cd", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - wud.tag.include=^\\d+\\.\\d+\\.\\d+$
networks:
  internal:
    driver: bridge
  network_internal:
    external: true
volumes:
  doco_data: {}