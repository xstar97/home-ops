services:
  apprise:
    image: caronc/apprise:v1.5.2@sha256:feb3ad42d280bca0c58fdff6f77f46e2586a65bbc6d2bff614d31245ff8a399c
    container_name: apprise
    restart: unless-stopped
    networks:
      - internal
    expose:
      - "8000"
    environment:
      TZ: America/New_York
      APPRISE_WORKER_COUNT: 1
      APPRISE_STATEFUL_MODE: simple
      # APPRISE_ADMIN: "y"
    volumes:
      - ${DOCKER_DATA_DIR}/apprise/config:/config
      - ${DOCKER_DATA_DIR}/apprise/attach:/attach
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -o /dev/null http://localhost:8000/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - wud.tag.include=^\\d+\\.\\d+\\.\\d+$
  doco-cd:
    image: ghcr.io/kimdre/doco-cd:0.111@sha256:8c31f63f6bde1b67f0802619bad0599bf5e41503f5532be9cc58d0f063b1eeea
    container_name: doco-cd
    restart: unless-stopped
    depends_on:
      apprise:
        condition: service_healthy
    networks:
      - internal
      - network_internal
    ports:
      - "9080:9080"
      - "9120:9120"
    environment:
      TZ: America/New_York
      HTTP_PORT: 9080
      APPRISE_API_URL: http://apprise:8000/notify
      APPRISE_NOTIFY_URLS: http://apprise:8000/notify/doco-cd
      APPRISE_NOTIFY_LEVEL: success
      DOCKER_SWARM_FEATURES: "false"
      DEPLOY_CONFIG_BASE_DIR: ./docker/nas/
      PASS_ENV: "false"
      POLL_CONFIG: |
        - url: https://github.com/xstar97/home-ops
          reference: main
          interval: 3600
      SOPS_AGE_KEY_FILE: /run/secrets/sops_age_key
      SSH_PRIVATE_KEY_FILE: /run/secrets/ssh_private_key
      SSH_PRIVATE_KEY_PASSPHRASE: ""
      WEBHOOK_SECRET_FILE: /run/secrets/webhook_secret
      GIT_ACCESS_TOKEN_FILE: /run/secrets/git_access_token
    secrets:
      - ssh_private_key
      - sops_age_key
      - webhook_secret
      - git_access_token
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - doco_data:/data
      # - ${SSH_KEY_FILE}:/run/secrets/ssh_private_key:ro
      # - ${AGEKEY_FILE}:/run/secrets/sops_age_key:ro
      # - ${WEBHOOK_FILE}:/run/secrets/webhook_secret:ro
      # - ${GIT_ACCESS_TOKEN_FILE}:/run/secrets/git_access_token:ro
    healthcheck:
      test: ["CMD", "/doco-cd", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - wud.tag.include=^\\d+\\.\\d+\\.\\d+$
networks:
  internal:
    driver: bridge
  network_internal:
    external: true
volumes:
  doco_data: {}
secrets:
  ssh_private_key:
    file: ${SSH_KEY_FILE}
  sops_age_key:
    file: ${AGEKEY_FILE}
  webhook_secret:
    file: ${WEBHOOK_FILE}
  git_access_token:
    file: ${GAT_FILE}