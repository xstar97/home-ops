
services:
  scrutiny-collector:
    scale: 1
    image: ghcr.io/analogj/scrutiny:v0.9.3-collector@sha256:9e3413b1992eee55cd4138a2e5b9083ce47f6f3ffce7d1c1eb17995c05728b3e
    container_name: scrutiny-collector
    restart: on-failure
    cap_add:
    - SYS_RAWIO
    - SYS_ADMIN
    networks:
      - internal
    environment:
      COLLECTOR_API_ENDPOINT: 'http://${SEB_IP}:10080'
      COLLECTOR_HOST_ID: 'scrutiny-collector-nas'
      # If true forces the collector to run on startup (cron will be started after the collector completes)
      # see: https://github.com/AnalogJ/scrutiny/blob/master/docs/TROUBLESHOOTING_DEVICE_COLLECTOR.md#collector-trigger-on-startup
      COLLECTOR_RUN_STARTUP: true
    volumes:
      - '/run/udev:/run/udev:ro'
    devices:
      - "/dev/sda" # ST16000NM001G-2KK103
      - "/dev/sdb" # ST16000NM001G-2KK103
      - "/dev/sdc" # Samsung SSD 860 EVO 1TB
      - "/dev/nvme0" # INTEL MEMPEK1J032GAD
      - "/dev/nvme1" # 1.8T Samsung SSD 990 EVO 2TB
networks:
  network_internal:
    external: true
  internal:
    driver: bridge
