x-healthcheck: &healthcheck
  test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:2375/_ping || exit 1"]
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 15s

services:
  dockerproxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: dockerproxy
    restart: unless-stopped
    ports:
      - "2375:2375"
    healthcheck: *healthcheck
    environment:
      # Required by every installation
      PING: 1
      VERSION: 1
      INFO: 1
      EVENTS: 1
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      DISTRIBUTION: 1
      # Docker Swarm only, omit these on a standalone daemon
      # SERVICES: 1
      # TASKS: 1
      # NODES: 1 
      # SECRETS: 1
      # CONFIGS: 1
      # Required to deploy anything
      POST: 1
      DELETE: 1 
      # Endpoints doco-cd never uses
      AUTH: 0
      BUILD: 0
      COMMIT: 0
      EXEC: 0
      PLUGINS: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
    networks:
      - network_internal
      - internal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
networks:
  network_internal:
    external: true
  internal:
    driver: bridge
