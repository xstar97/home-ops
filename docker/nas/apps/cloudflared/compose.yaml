x-healthcheck: &healthcheck
  test: ["CMD", "cloudflared", "tunnel", "--metrics", "localhost:8080", "ready"]
  interval: 30s
  timeout: 30s
  retries: 3
  start_period: 30s

services:
  cloudflared:
    scale: 1
    image: cloudflare/cloudflared:2026.5.1@sha256:a5b5e6fd9a372f054b9a843c219bfbcdceb54691605312a8b1ee72978bdf1aa1
    container_name: cloudflared
    restart: on-failure
    command: tunnel --no-autoupdate --metrics 127.0.0.1:8080 run --token ${CF_TUNNEL_TOKEN_0}
    networks:
      - network_internal
    ports:
      # metrics
      - "8080" 
    healthcheck: *healthcheck
    labels:
      wud.tag.include: ^\d+\.\d+\.\d+$
networks:
  network_internal:
    external: true
  internal:
    driver: bridge
