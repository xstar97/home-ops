x-healthcheck: &healthcheck
  test: ["CMD-SHELL","wget -q --spider http://localhost:2376/_hawser/health || exit 1"]
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 15s

services:
  hawser:
    scale: 1
    image: ghcr.io/finsys/hawser:0.2.50@sha256:a612335ba17f1ad06304faa3df3b340f086bbc5c57f44ddaea4a79db9b13a3ef
    container_name: hawser
    restart: on-failure
    environment:
      STACKS_DIR: "/opt/hawser-stacks"
      TOKEN: "${DOCKHAND_HAWSER_TOKEN_NAS}"
    networks:
      - internal
      - network_internal
    expose:
      - "2376"
    healthcheck: *healthcheck
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - hawser_data:/opt/hawser-stacks
    labels:
      traefik.enable: "true"
      traefik.http.routers.hawser.rule: Host(`hawser.nas.local`)
      traefik.http.routers.hawser.entrypoints: web
      traefik.http.services.hawser.loadbalancer.server.port: "2376"
networks:
  network_internal:
    external: true
  internal:
    driver: bridge
volumes:
  hawser_data: {}