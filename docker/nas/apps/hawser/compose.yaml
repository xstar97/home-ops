x-healthcheck: &healthcheck
  test: ["CMD-SHELL","wget -q --spider http://localhost:2376/_hawser/health || exit 1"]
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 15s

services:
  hawser:
    scale: 1
    image: ghcr.io/finsys/hawser:0.2.44@sha256:6810d8931ab9c7394ba4a2a25d81579965d47aef522a4deb84b107de12692381
    container_name: hawser
    restart: on-failure
    env_file:
      - hawser.enc.env
    environment:
      STACKS_DIR: "/opt/hawser-stacks"
    networks:
      - network_internal
    ports:
      - 2376:2376
    healthcheck: *healthcheck
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - hawser_data:/opt/hawser-stacks
    labels:
      wud.tag.include: ^\d+\.\d+\.\d+$
networks:
  network_internal:
    external: true
  internal:
    driver: bridge
volumes:
  hawser_data: {}