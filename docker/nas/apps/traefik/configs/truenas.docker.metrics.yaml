http:
  routers:
    truenas-docker-metrics:
      rule: 'Host(`metrics.docker.nas.local`)'
      entryPoints:
        - web
      service: truenas-docker-metrics-service
  services:
    truenas-docker-metrics-service:
      loadBalancer:
        servers:
          - url: 'http://{{ env "TRUENAS_LOCAL_DOMAIN" }}:9323'
