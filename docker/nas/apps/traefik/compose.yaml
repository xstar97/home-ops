x-healthcheck: &healthcheck
  test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ping | grep -q '^OK$' || exit 1"]
  interval: 30s
  timeout: 30s
  retries: 3
  start_period: 15s

x-healthcheckAdguardDns: &healthcheckAdguardDns
  test: ["CMD", "python", "/app/adguard-dns-companion.py", "--healthcheck"]
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 1m

services:
  traefik:
    image: traefik:v3.7.13@sha256:24841fe2de7304c149343d877d2923b4c8800a38ba015dea9174c23b20e344a0
    container_name: traefik
    restart: on-failure
    healthcheck: *healthcheck
    command:
      - --entrypoints.web.address=:80
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=network_internal
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --log.level=INFO
      - --accesslog=true
      - --api.insecure=true
      - --ping=true
    networks:
      - network_internal
    environment:
      TRUENAS_LOCAL_DOMAIN: $TRUENAS_HOSTNAME_LOCAL
      TRUENAS_LOCAL_IP: $TRUENAS_IP
    ports:
      - "80:80"
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
      - ./configs:/etc/traefik/dynamic
    labels:
      traefik.enable: "true"
      # AdGuard DNS companion configuration
      adguard.dns-companion.enabled: "true"
      adguard.dns-companion.domain: "${TRUENAS_HOSTNAME_LOCAL}"
      adguard.dns-companion.target: "${TRUENAS_IP}"
      # Traefik dashboard
      traefik.http.routers.traefik.rule: Host(`traefik.nas.local`)
      traefik.http.routers.traefik.entrypoints: web
      traefik.http.routers.traefik.service: api@internal

  adguard-dns-companion:
    image: python:3.14-alpine@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72
    container_name: traefik-adguard-dns
    restart: unless-stopped
    healthcheck: *healthcheckAdguardDns
    command:
      - python
      - /app/adguard-dns-companion.py
    environment:
      ADGUARD_URL: ${ADGUARD_URL}
      ADGUARD_USERNAME: ${ADGUARD_USERNAME}
      ADGUARD_PASSWORD: ${ADGUARD_PASSWORD}
      POLL_INTERVAL: "30"
      STATE_FILE: /data/managed-hosts.json
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      traefik:
        condition: service_healthy
    networks:
      - network_internal
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
      - ./adguard-dns-companion.py:/app/adguard-dns-companion.py:ro
      - adguard-dns-companion-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
networks:
  network_internal:
    external: true
volumes:
  adguard-dns-companion-data: {}
