x-healthcheck: &healthcheck
  test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ping | grep -q '^OK$' || exit 1"]
  interval: 30s
  timeout: 30s
  retries: 3
  start_period: 15s

x-healthcheckAdguardDns: &healthcheckAdguardDns
  test: ["CMD", "python", "/app/adguard-dns-companion.py", "--healthcheck"]
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 30s

services:
  traefik:
    image: traefik:v3.7.13@sha256:24841fe2de7304c149343d877d2923b4c8800a38ba015dea9174c23b20e344a0
    container_name: traefik
    restart: on-failure
    healthcheck: *healthcheck
    command:
      - --entrypoints.web.address=:80
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=network_internal
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --log.level=INFO
      - --accesslog=true
      - --api.insecure=true
      - --ping=true
    environment:
      TRUENAS_LOCAL_DOMAIN: "$TRUENAS_HOSTNAME_LOCAL"
      TRUENAS_LOCAL_IP: "$TRUENAS_IP"
    networks:
      - network_internal
    ports:
      - "80:80"
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
      - type: bind
        source: ./configs
        target: /etc/traefik/dynamic
        read_only: true
    labels:
      traefik.enable: "true"
      # Traefik dashboard
      traefik.http.routers.traefik.rule: Host(`traefik.nas.local`)
      traefik.http.routers.traefik.entrypoints: web
      traefik.http.routers.traefik.service: api@internal
      # DNS target for Docker and file-provider routers
      adguard.dns: "${TRUENAS_HOSTNAME_LOCAL}"
  adguard-dns-companion:
    image: python:3.14-alpine@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72
    container_name: traefik-adguard-dns
    restart: unless-stopped
    healthcheck: *healthcheckAdguardDns
    command:
      - python
      - /app/adguard-dns-companion.py
    environment:
      ADGUARD_URL: "http://${ROUTER_IP}:3000"
      ADGUARD_USERNAME: "${ADGUARD_USERNAME}"
      ADGUARD_PASSWORD: "${ADGUARD_PASSWORD}"
      TRAEFIK_API_URL: "http://traefik:8080"
      POLL_INTERVAL: "30"
      STATE_FILE: /data/state.json
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      traefik:
        condition: service_healthy
    networks:
      - network_internal
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
      - type: bind
        source: ./adguard-dns-companion.py
        target: /app/adguard-dns-companion.py
        read_only: true
      - adguard-dns-companion-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
networks:
  network_internal:
    external: true
volumes:
  adguard-dns-companion-data: {}
