services:
  doco-cd-updater:
    image: ghcr.io/kimdre/doco-cd:0.99@sha256:027be49dc467fbd1440446135813ac5aaa6795ee36bf306d1dc0a3b36d00d697
    container_name: doco-cd-updater
    restart: unless-stopped
    environment:
      TZ: America/New_York
      HTTP_PORT: 8000
      DOCKER_SWARM_FEATURES: "false"
      DEPLOY_CONFIG_BASE_DIR: ./docker/seb/
      PASS_ENV: "false"
      POLL_CONFIG: |
        - url: https://github.com/xstar97/home-ops
          reference: main
          interval: 300
          target: updater  # deploys the updater target on change
      SSH_PRIVATE_KEY_PASSPHRASE: ""
      SSH_PRIVATE_KEY_FILE: /run/secrets/ssh_private_key
      SCHEDULER_ENABLED: false  # disable scheduler on updater instance
    secrets:
      - ssh_private_key
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - updater-data:/data
    healthcheck:
      test: ["CMD", "/doco-cd", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - wud.tag.include=^\\d+\\.\\d+\\.\\d+$
volumes:
  updater-data: {}
secrets:
  ssh_private_key:
    file: ${SSH_KEY_FILE}