x-healthcheckFE: &healthcheckFE
  test: curl -f http://localhost:80/api/v1/health || exit 1
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 15s

x-healthcheckBE: &healthcheckBE
  test: curl -f http://localhost:8000/api/v1/health || exit 1
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 15s
  
x-healthcheckMCP: &healthcheckMCP
  test:
    - CMD
    - python
    - -c
    - |
      import json
      import urllib.request
      r = urllib.request.urlopen("http://localhost:8001/health", timeout=5)
      data = json.load(r)
      raise SystemExit(0 if r.status == 200 and data.get("status") == "ok" else 1)
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 15s
services:
  frontend:
    image: ghcr.io/pouzor/homelable-frontend:3.6.0@sha256:5950f4905da2ea92b2a3870066399e718987a4a23d16c368935b9ddb7901635a
    container_name: homelable-frontend
    restart: unless-stopped
    expose:
      - "80"
    healthcheck: *healthcheckFE
    depends_on:
      - backend
    networks:
      - internal
      - network_internal
    labels:
      traefik.enable: true
      traefik.http.routers.homelable.rule: Host(`homelable.${BASE_DOMAIN_0}`)
      traefik.http.services.homelable.loadbalancer.server.port: 80
      traefik.http.routers.homelable.entrypoints: websecure
      traefik.http.routers.homelable.tls: true
      traefik.http.routers.homelable.tls.certResolver: cf
      traefik.http.routers.homelable.middlewares: error-pages-middleware
      # Register dashboard DNS record with AdGuard.
      adguard.dns: "seb.local"
  backend:
    image: ghcr.io/pouzor/homelable-backend:3.6.0@sha256:1e501424e8c53989fcea1dc9311d46614ae159b2bfee4608a5c0cd5baee3e9dc
    container_name: homelable-backend
    restart: unless-stopped
    networks:
      - internal
    expose:
      - "8000"
    healthcheck: *healthcheckBE
    cap_add:
      - NET_RAW
    # MAC addresses: on this bridge network the scanner can never see them —
    # ARP is layer 2 and every LAN host is one hop away behind the Docker
    # gateway. To collect MACs (and so keep DHCP devices matched across an IP
    # change), put the backend on the LAN: comment out the `networks:` key
    # above and uncomment the line below (Linux hosts only).
    # network_mode: host
    env_file:
      - homelable.enc.env
    environment:
      SQLITE_PATH: /app/data/homelab.db
    volumes:
      - ${BASE_DOCKER_DATA_DIR}/homelable/data:/app/data
  mcp:
    image: ghcr.io/pouzor/homelable-mcp:3.6.0@sha256:42838c0733b6443bcb6aaa3310f39daa8e700817ddb1f4466ff58d5cc0013c85
    container_name: homelable-mcp
    restart: unless-stopped
    expose:
      - "8001"
    healthcheck: *healthcheckMCP
    env_file:
      - homelable.enc.env
    environment:
      BACKEND_URL: "http://homelable-backend:8000"
    depends_on:
      - backend
    networks:
      - internal

networks:
  network_internal:
    external: true
  internal:
    driver: bridge
