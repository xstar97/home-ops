x-healthcheck: &healthcheckBackend
  test: curl -f http://localhost:8080/health || exit 1
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 15s

services:
  dockhand:
    scale: 1
    container_name: dockhand
    image: fnsys/dockhand:v1.0.46@sha256:4e0c30e703f1435cd1aacf4948794526dee7c0b4b81b8a992196f1cac53e11d3
    restart: on-failure
    networks:
      - network_internal
    expose:
      - "3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${BASE_DOCKER_DATA_DIR}/dockhand/data:/app/data
    labels:
      traefik.enable: true
      traefik.http.routers.dockhand.rule: Host(`dockhand.${BASE_DOMAIN_0}`)
      traefik.http.services.dockhand.loadbalancer.server.port: 3000
      traefik.http.routers.dockhand.entrypoints: websecure
      traefik.http.routers.dockhand.tls: true
      traefik.http.routers.dockhand.tls.certResolver: cf
      traefik.http.routers.dockhand.middlewares: error-pages-middleware
    # depends_on:
    #   - postgres
  backend:
    image: ghcr.io/pouzor/homelable-backend:3.4.1@sha256:96fd11e5708b742888517908b8129fa8f9103be49304cdf1222218f6cd3d0626
    container_name: homelable-backend
    restart: unless-stopped
    networks:
      - internal
    expose:
      - "8000"
    cap_add:
      - NET_RAW
    # MAC addresses: on this bridge network the scanner can never see them —
    # ARP is layer 2 and every LAN host is one hop away behind the Docker
    # gateway. To collect MACs (and so keep DHCP devices matched across an IP
    # change), put the backend on the LAN: comment out the `networks:` key
    # above and uncomment the line below (Linux hosts only).
    # network_mode: host
    env_file:
      - homelable.enc.env
    environment:
      SQLITE_PATH: /app/data/homelab.db
    volumes:
      - ${BASE_DOCKER_DATA_DIR}/homelable/data:/app/data

  frontend:
    image: ghcr.io/pouzor/homelable-frontend:3.4.1@sha256:637d76edf952aaba163375791ae8f7fe59ca43cf52c8d4499cce7d51a20dab13
    container_name: homelable-frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - internal
      - network_internal
  mcp:
    image: ghcr.io/pouzor/homelable-mcp:3.4.1@sha256:e06a22c2017be64dceb69de74e140faa053da844dd2bbadb47177c2d197d08d7
    restart: unless-stopped
    expose:
      - "8001"
    env_file:
      - .env
    environment:
      BACKEND_URL: "http://homelable-backend:8000"
    depends_on:
      - backend
    networks:
      - internal
networks:
  network_internal:
    external: true
  internal:
    driver: bridge
