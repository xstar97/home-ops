x-healthcheck: &healthcheck
  test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 15s

services:
  mcp-adguard-home:
    scale: 1
    image: ghcr.io/samik081/mcp-adguard-home:0.10.0@sha256:c1c3d89a21d9c66f9f97d14eba3ee725827c70e2357687d598112b01d6cafbbe
    container_name: mcp-adguard-home
    restart: on-failure
    expose:
      - "3000"
    healthcheck: *healthcheck
    env_file:
      - ./mcp.enc.env
    labels:
      traefik.enable: "true"
      traefik.http.routers.mcp-adguard-home.rule: Host(`mcp-adguard-home.seb.local`)
      traefik.http.routers.mcp-adguard-home.entrypoints: web
      traefik.http.routers.mcp-adguard-home.service: mcp-adguard-home
      traefik.http.services.mcp-adguard-home.loadbalancer.server.port: "3000"
networks:
  internal:
    driver: bridge
