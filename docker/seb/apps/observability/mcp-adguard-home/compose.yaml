x-healthcheck: &healthcheck
  test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 15s

services:
  mcp-adguard-home:
    scale: 1
    image: ghcr.io/samik081/mcp-adguard-home:0.10.1@sha256:8b99f6c1be373537ae0ac08b607a6f7b43086b77ed20bdc0a5b0964fa7e3c9ff
    container_name: mcp-adguard-home
    restart: on-failure
    expose:
      - "3000"
    healthcheck: *healthcheck
    env_file:
      - ./mcp.enc.env
    labels:
      traefik.enable: "true"
      traefik.http.routers.mcp-adguard-home.rule: Host(`mcp-adguard-home.seb.local`)
      traefik.http.routers.mcp-adguard-home.entrypoints: web
      traefik.http.routers.mcp-adguard-home.service: mcp-adguard-home
      traefik.http.services.mcp-adguard-home.loadbalancer.server.port: "3000"
      traefik.http.services.mcp-adguard-home.loadbalancer.server.scheme: http
      # Register dashboard DNS record with AdGuard.
      adguard.dns: "seb.local"
networks:
  internal:
    driver: bridge
