services:
  # postgres:
    # image: postgres:16-alpine
    # networks:
    #   - internal # Assign to the custom network
    # volumes:
    #   - ${BASE_DOCKER_DATA_DIR}/dockhand/db:/var/lib/postgresql/data
  dockhand:
    scale: 1
    container_name: dockhand
    image: fnsys/dockhand:v1.0.53@sha256:03f4dc98a6e1c4193d68b77e11597c78363c6465fa23dca7552482b292cfbc09
    restart: on-failure
    networks:
      - network_internal
    expose:
      - "3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${BASE_DOCKER_DATA_DIR}/dockhand/data:/app/data
    labels:
      traefik.enable: true
      traefik.http.routers.dockhand.rule: Host(`dockhand.${BASE_DOMAIN_0}`)
      traefik.http.services.dockhand.loadbalancer.server.port: 3000
      traefik.http.routers.dockhand.entrypoints: websecure
      traefik.http.routers.dockhand.tls: true
      traefik.http.routers.dockhand.tls.certResolver: cf
      traefik.http.routers.dockhand.middlewares: error-pages-middleware
      # Register dashboard DNS record with AdGuard.
      adguard.dns: "seb.local"
    # depends_on:
    #   - postgres
networks:
  network_internal:
    external: true
  internal:
    driver: bridge
