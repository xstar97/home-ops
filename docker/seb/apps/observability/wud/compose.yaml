x-healthcheck: &healthcheck
  test: curl -f http://localhost:3000/health || exit 1
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 15s

services:
  wud:
    scale: 1
    image: ghcr.io/getwud/wud:8.2.2@sha256:2df7cafa0fc84cdd66ad976163abc5390fa5995e0b5788a90e6a5303706bc21a
    container_name: wud
    restart: on-failure
    environment:
      WUD_SERVER_PORT: 3000
    networks:
      - network_internal
    expose:
      - "3000"
    healthcheck: *healthcheck
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      traefik.enable: true
      traefik.http.routers.wud.rule: Host(`wud.${BASE_DOMAIN_0}`)
      traefik.http.services.wud.loadbalancer.server.port: 3000
      traefik.http.routers.wud.entrypoints: websecure
      traefik.http.routers.wud.tls: true
      traefik.http.routers.wud.tls.certResolver: cf
      traefik.http.routers.wud.middlewares: error-pages-middleware
      homepage.group: Monitoring
      homepage.name: Wud
      homepage.description: Keep your containers up-to-date!
      homepage.icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/wud.svg
      homepage.href: https://wud.${BASE_DOMAIN_0}
      homepage.widget.type: whatsupdocker
      homepage.widget.url: http://wud:3000
      wud.tag.include: ^\d+\.\d+\.\d+$
      wud.link.template: https://github.com/getwud/wud/releases/tag/$${major}.$${minor}.$${patch}
networks:
  network_internal:
    external: true
  internal:
    driver: bridge
