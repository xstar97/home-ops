x-healthcheck: &healthcheck
  test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4653/api/2p/status"]
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 15s

services:
  adgvis:
    scale: 0
    image: ghcr.io/m00grin/ph-intercept:1.6.0@sha256:6874e0eed1d4a1aac82379004fa8246493fb8a71ac07324dbc5854f650398364
    container_name: adgvis
    restart: on-failure
    networks:
      - network_internal
    expose:
      - "4653"
    healthcheck: *healthcheck
    env_file:
      - ./adgvis.enc.env
    environment:
      PROVIDER: adguard
      # Optional: where ESC navigates to (like your homelab dashboard or homepage)
      # Accepts http://, https://, protocol-relative (//), relative paths, and custom app schemes
      # Leave blank ("") to disable ESC entirely
      RETURN_URL: "https://homepage.${DOMAIN_0}"
      
      # Background. These set the DEFAULT; each user can also switch the background live
      # from the in-app settings menu, and their choice is remembered per-browser.
      # Style: starfield | nebula | outrun | dark
      BG_MODE: starfield

      # Sky region shown for the starfield:
      #   summer_triangle | orion | scorpius | southern_cross
      SKY_PRESET: summer_triangle

      # Optional: "true" makes the page view-only. The server refuses the blocking
      # toggle, filter update and 2-player mode switch; the HUD controls go inert.
      READ_ONLY: "true"

      # Optional: "true" drops the client name/IP from every query on the server,
      # so it never reaches the browser. Also hides the in-app CLIENT toggle.
      HIDE_CLIENT: "true"
    volumes:
      - ${BASE_DOCKER_DATA_DIR}/adg-intercept/data:/app/data
    labels:
      traefik.enable: true
      traefik.http.routers.adgvis.rule: Host(`adgvis.${BASE_DOMAIN_0}`)
      traefik.http.services.adgvis.loadbalancer.server.port: 4653
      traefik.http.routers.adgvis.entrypoints: websecure
      traefik.http.routers.adgvis.tls: true
      traefik.http.routers.adgvis.tls.certResolver: cf
      traefik.http.routers.adgvis.middlewares: error-pages-middleware
      # Register dashboard DNS record with AdGuard.
      adguard.dns: "seb.local"
networks:
  network_internal:
    external: true
  internal:
    driver: bridge
