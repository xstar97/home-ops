x-healthcheckWeb: &healthcheck
  test: ["CMD", "curl", "-f", "http://localhost:8080"]
  interval: 30s
  timeout: 30s
  retries: 3
  start_period: 30s

services:
  fmd:
    scale: 1
    image: registry.gitlab.com/fmd-foss/fmd-server:0.16.0-alpine@sha256:fec3cce3329468d806ddd1e33e48dff6eafe6005ef4168163abb3afc48d53330
    container_name: fmd
    restart: on-failure
    # healthcheck: *healthcheckDb
    user: "${PUID:-1000}:${PGID:-1000}"
    expose:
      - "8080"
    networks:
      - network_internal
    env_file:
      - ./fmd.enc.env
    environment:
      FMD_DATABASEDIR: /var/lib/fmd-server/db
      FMD_PORTINSECURE: "8080"
      FMD_PORTSECURE: "8443"
      FMD_METRICSADDRPORT: "[::1]:9100"
      #FMD_WEBDIR=
    volumes:
      - ${BASE_DOCKER_DATA_DIR}/fmd/db/:/var/lib/fmd-server/db/
    labels:
      wud.tag.include: ^\d+\.\d+\.\d+-alpine$
      traefik.enable: true
      traefik.http.routers.fmd.rule: Host(`fmd.${BASE_DOMAIN_0}`)
      traefik.http.services.fmd.loadbalancer.server.port: 8080
      traefik.http.routers.fmd.entrypoints: websecure
      traefik.http.routers.fmd.tls: true
      traefik.http.routers.fmd.tls.certResolver: cf
      traefik.http.routers.fmd.middlewares: error-pages-middleware
networks:
  network_internal:
    external: true
  internal:
    driver: bridge
