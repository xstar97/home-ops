x-healthcheck: &healthcheck
  test: ["CMD", "cloudflared", "tunnel", "--metrics", "localhost:8080", "ready"]
  interval: 30s
  timeout: 30s
  retries: 3
  start_period: 30s

services:
  cloudflared:
    scale: 1
    image: cloudflare/cloudflared:2026.10.3@sha256:faa8e0a1475f137c910be6025f43c8e4092fdd35461b31e19fd1390657a1ff39
    container_name: cloudflared
    restart: on-failure
    command: tunnel --no-autoupdate --metrics 127.0.0.1:8080 run --token ${CF_TUNNEL_TOKEN_0}
    networks:
      - network_internal
    expose:
      - "8080"
    healthcheck: *healthcheck
    labels:
      homepage.group: Networking
      homepage.name: CloudFlared
      homepage.icon: cloudflare.png
      homepage.widget.type: cloudflared
      homepage.widget.tunnelid: ${CF_TUNNEL_ID_0}
      homepage.widget.accountid: ${CF_ACCOUNT_ID_0}
      homepage.widget.key: ${CF_TUNNEL_KEY_HP}
networks:
  network_internal:
    external: true
  internal:
    driver: bridge
