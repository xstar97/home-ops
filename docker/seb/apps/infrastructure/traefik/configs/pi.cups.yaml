http:
  routers:
    cups:
      rule: 'Host(`cups.{{ env "DOMAIN_0" }}`)'
      entryPoints:
        - websecure
      middlewares:
        - default-headers
      service: cups
      tls:
        certResolver: cf

  services:
    cups:
      loadBalancer:
        serversTransport: cupsTransport
        passHostHeader: true
        servers:
          - url: 'https://{{ env "CUPS_LOCAL_DOMAIN" }}'

  serversTransports:
    cupsTransport:
      insecureSkipVerify: true
      maxIdleConnsPerHost: 10