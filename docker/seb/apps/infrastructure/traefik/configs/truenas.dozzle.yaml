http:
  routers:
    truenas-dozzle:
      rule: 'Host(`dozzle.nas.{{ env "DOMAIN_0" }}`)'
      entryPoints:
        - websecure
      service: truenas-dozzle-service
      tls:
        certResolver: cf

  services:
    truenas-dozzle-service:
      loadBalancer:
        servers:
          - url: 'http://dozzle.nas.local:80'