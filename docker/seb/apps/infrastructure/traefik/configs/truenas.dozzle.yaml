http:
  routers:
    truenas-dozzle:
      rule: 'Host(`dozzle.nas.{{ env "DOMAIN_0" }}`)'
      entryPoints:
        - websecure
      service: truenas-traefik-service
      middlewares:
        - truenas-dozzle-host
      tls:
        certResolver: cf

  middlewares:
    truenas-dozzle-host:
      headers:
        customRequestHeaders:
          Host: 'dozzle.nas.local'

  services:
    truenas-traefik-service:
      loadBalancer:
        servers:
          - url: 'http://{{ env "TRUENAS_LOCAL_DOMAIN" }}:80'
