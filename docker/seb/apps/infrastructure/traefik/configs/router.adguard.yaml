http:
  routers:
    router-adguard:
      rule: 'Host(`adg.{{ env "BASE_DOMAIN_0" }}`)'
      entryPoints:
        - websecure
      service: router-adguard-service
      tls:
        certResolver: cf

  services:
    router-adguard-service:
      loadBalancer:
        servers:
          - url: 'http://{{ env "ROUTER_HOSTNAME_LOCAL" }}:3000'