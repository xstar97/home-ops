http:
  routers:
    router-web:
      rule: 'Host(`router.{{ env "DOMAIN_0" }}`)'
      entryPoints:
        - websecure
      service: router-web-service
      tls:
        certResolver: cf

  services:
    router-web-service:
      loadBalancer:
        servers:
          - url: 'http://{{ env "ROUTER_LOCAL_DOMAIN" }}:444'