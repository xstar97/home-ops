x-healthcheck: &healthcheck
  test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ping | grep -q '^OK$' || exit 1"]
  interval: 30s
  timeout: 30s
  retries: 3
  start_period: 15s

x-healthcheckAdguardDns: &healthcheckAdguardDns
  test: ["CMD", "python", "/app/adguard_dns.py", "--healthcheck"]
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 30s

services:
  traefik:
    image: traefik:v3.7.15@sha256:0f6150202bc1fed72a7bd2107460eaa510e5b8a905f3fdb5b84f2c8619c33368
    container_name: traefik
    restart: on-failure
    healthcheck: *healthcheck
    networks:
      - network_internal
      - internal
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    environment:
      CF_DNS_API_TOKEN: "${CF_DNS_API_TOKEN_0}"
      DOMAIN_0: "$BASE_DOMAIN_0"
      HA_LOCAL_DOMAIN: "$HOME_ASSISTANT_HOSTNAME_LOCAL"
      ROUTER_LOCAL_DOMAIN: "$ROUTER_HOSTNAME_LOCAL"
      SEB_LOCAL_DOMAIN: "$SEB_HOSTNAME_LOCAL"
      TRUENAS_LOCAL_DOMAIN: "$TRUENAS_HOSTNAME_LOCAL"
      CUPS_LOCAL_DOMAIN: "$CUPS_HOSTNAME_LOCAL"
      CUPS_IP: "$CUPS_IP"
    command:
      - --certificatesresolvers.cf.acme.caserver=https://acme-v02.api.letsencrypt.org/directory
      - --certificatesresolvers.cf.acme.dnsChallenge.delayBeforeCheck=0
      - --certificatesresolvers.cf.acme.dnsChallenge.provider=cloudflare
      - --certificatesresolvers.cf.acme.dnsChallenge.resolvers=1.1.1.1:53
      - --certificatesresolvers.cf.acme.storage=/certs/acme.json
      - --entryPoints.web.address=:80
      - --entryPoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      - --entrypoints.websecure.http.tls.certResolver=cf
      - --entrypoints.websecure.http.tls.domains[0].main=*.${BASE_DOMAIN_0}
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=network_internal
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --log.level=DEBUG
      - --accesslog=true
      - --api.insecure=true
      - --ping
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
      - type: bind
        source: ${BASE_DOCKER_DATA_DIR}/traefik/certs
        target: /certs
      - type: bind
        source: ./configs
        target: /etc/traefik/dynamic
        read_only: true
    labels:
      traefik.enable: "true"
      # Traefik dashboard
      traefik.http.routers.traefik.rule: Host(`traefik.${BASE_DOMAIN_0}`)
      traefik.http.services.traefik.loadbalancer.server.port: "8080"
      traefik.http.routers.traefik.entrypoints: websecure
      traefik.http.routers.traefik.tls: "true"
      traefik.http.routers.traefik.tls.certResolver: cf
      traefik.http.routers.traefik.middlewares: error-pages-middleware
      homepage.group: Networking
      homepage.name: Traefik
      homepage.icon: traefik.png
      homepage.href: https://traefik.${BASE_DOMAIN_0}/dashboard/
      homepage.widget.type: traefik
      homepage.widget.url: http://traefik:8080
      homepage.description: Traefik dashboard
      # AdGuard DNS companion target IP
      adguard.dns: "${SEB_HOSTNAME_LOCAL}"
    depends_on:
      error-pages:
        condition: service_healthy
  traefik-adguard-dns:
    image: ghcr.io/xstar97/traefik-adguard-dns:0.0.2@sha256:8f200ca88115a2cc4b2de1223df1bc775bafb8a096c9711ca27b84d3e8e4fabf
    container_name: traefik-adguard-dns
    restart: unless-stopped
    healthcheck: *healthcheckAdguardDns
    environment:
      ADGUARD_URL: "${ROUTER_ADGUARD_URL}"
      ADGUARD_USERNAME: "${ROUTER_ADGUARD_USERNAME}"
      ADGUARD_PASSWORD: "${ROUTER_ADGUARD_PASSWORD}"
      TRAEFIK_API_URL: "http://traefik:8080"
      POLL_INTERVAL: "30"
      STATE_FILE: /data/state.json
    depends_on:
      traefik:
        condition: service_healthy
    networks:
      - network_internal
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
      - adguard-dns-companion-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
  error-pages:
    image: ghcr.io/tarampampam/error-pages:4.2.6@sha256:87434ca4b6461dbd956967922d5fe3eec2fba6ea46d7e8cdb0fac7e54bf78fc0
    container_name: error-pages
    restart: unless-stopped
    networks:
      - internal
    environment:
      TEMPLATE_NAME: app-down
    labels:
      traefik.enable: "true"
      # Fallback for any non-registered services.
      traefik.http.routers.error-pages-router.rule: HostRegexp(`.+`)
      traefik.http.routers.error-pages-router.priority: "10"
      traefik.http.routers.error-pages-router.entrypoints: web
      traefik.http.routers.error-pages-router.middlewares: error-pages-middleware
      # Errors middleware
      traefik.http.middlewares.error-pages-middleware.errors.status: 400-599
      traefik.http.middlewares.error-pages-middleware.errors.service: error-pages-service
      traefik.http.middlewares.error-pages-middleware.errors.query: /{status}.html
      # Service
      traefik.http.services.error-pages-service.loadbalancer.server.port: "8080"
volumes:
  adguard-dns-companion-data:
networks:
  network_internal:
    external: true
  internal:
    driver: bridge
