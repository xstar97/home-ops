x-healthcheck: &healthcheck
  test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ping | grep -q '^OK$' || exit 1"]
  interval: 30s
  timeout: 30s
  retries: 3
  start_period: 15s

x-healthcheckAdguardDns: &healthcheckAdguardDns
  test: ["CMD", "python", "/app/adguard-dns-companion.py", "--healthcheck"]
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 1m

services:
  traefik:
    image: traefik:v3.7.12@sha256:9c2a54d87f76f5c2f5f2682c68394af92fb12c0a2686798d6462a3f84bd78eaf
    container_name: traefik
    restart: on-failure
    healthcheck: *healthcheck
    environment:
      CF_DNS_API_TOKEN: "${CF_DNS_API_TOKEN_0}"
      DOMAIN_0: "$BASE_DOMAIN_0"
      HA_LOCAL_DOMAIN: "$HOME_ASSISTANT_HOSTNAME_LOCAL"
      ROUTER_LOCAL_DOMAIN: $ROUTER_HOSTNAME_LOCAL
      SEB_LOCAL_DOMAIN: $SEB_HOSTNAME_LOCAL
      TRUENAS_LOCAL_DOMAIN: $TRUENAS_HOSTNAME_LOCAL
      CUPS_LOCAL_DOMAIN: $CUPS_HOSTNAME_LOCAL
      CUPS_IP: $CUPS_IP
    command:
      - --certificatesresolvers.cf.acme.caserver=https://acme-v02.api.letsencrypt.org/directory
      - --certificatesresolvers.cf.acme.dnsChallenge.delayBeforeCheck=0
      - --certificatesresolvers.cf.acme.dnsChallenge.provider=cloudflare
      - --certificatesresolvers.cf.acme.dnsChallenge.resolvers=1.1.1.1:53
      - --certificatesresolvers.cf.acme.storage=/certs/acme.json
      - --entryPoints.web.address=:80
      - --entryPoints.web.http.redirections.entryPoint.scheme=https
      - --entryPoints.web.http.redirections.entryPoint.to=websecure
      - --entryPoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      - --entrypoints.websecure.http.tls.certResolver=cf
      - --entrypoints.websecure.http.tls.domains[0].main=*.${BASE_DOMAIN_0}
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --providers.docker.network=network_internal
      - "--log.level=DEBUG"  # Set log level to DEBUG
      - "--accesslog=true"   # Enable access logs to stdout
      - "--api.insecure=true"
      - --ping
    networks:
      - network_internal
      - internal
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
      - ${BASE_DOCKER_DATA_DIR}/traefik/certs:/certs
      - ./configs:/etc/traefik/dynamic
    labels:
      traefik.enable: true
      traefik.http.routers.traefik.rule: Host(`traefik.${BASE_DOMAIN_0}`)  # Expose dashboard
      traefik.http.services.traefik.loadbalancer.server.port: 8080
      traefik.http.routers.traefik.entrypoints: websecure
      traefik.http.routers.traefik.tls: true
      traefik.http.routers.traefik.tls.certResolver: cf
      traefik.http.routers.traefik.middlewares: error-pages-middleware
      homepage.group: Networking
      homepage.name: Traefik
      homepage.icon: traefik.png
      homepage.href: https://traefik.${BASE_DOMAIN_0}/dashboard/
      homepage.widget.type: traefik
      homepage.widget.url: http://traefik:8080
      homepage.description: Traefik dashboard
    depends_on:
      error-pages: {condition: service_healthy}
  adguard-dns-companion:
    image: python:3.14-alpine@sha256:c6ead215bfd31f1e433d968853b7a769989117115b728874824e6c0a27cb96fc
    container_name: traefik-adguard-dns
    restart: unless-stopped
    healthcheck: *healthcheckAdguardDns
    command: ["python", "/app/adguard-dns-companion.py"]
    environment:
      ADGUARD_URL: ${ADGUARD_URL}
      ADGUARD_USERNAME: ${ADGUARD_USERNAME}
      ADGUARD_PASSWORD: ${ADGUARD_PASSWORD}
      DNS_DOMAIN: ${BASE_DOMAIN_0}
      DNS_TARGET: ${SEB_HOSTNAME_LOCAL}
      POLL_INTERVAL: "30"
      STATE_FILE: /data/managed-hosts.json
      TRAEFIK_API_URL: http://traefik:8080/api/http/routers
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      traefik: {condition: service_healthy}
    networks:
      - internal
    volumes:
      - ./adguard-dns-companion.py:/app/adguard-dns-companion.py:ro
      - adguard-dns-companion-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
  error-pages:
    container_name: error-pages
    image: ghcr.io/tarampampam/error-pages:4.2.5@sha256:6d42b5d6e1a014fa2373e3587f9e85c25589a089fd5f6fc4f2a496858f5e365d
    networks:
      - internal
    environment:
      TEMPLATE_NAME: app-down # set the error pages template
    labels:
      traefik.enable: true
      # use as "fallback" for any NON-registered services (with priority below normal)
      traefik.http.routers.error-pages-router.rule: HostRegexp(`.+`)
      traefik.http.routers.error-pages-router.priority: 10
      # should say that all of your services work on https
      traefik.http.routers.error-pages-router.entrypoints: web
      traefik.http.routers.error-pages-router.middlewares: error-pages-middleware
      # "errors" middleware settings
      traefik.http.middlewares.error-pages-middleware.errors.status: 400-599
      traefik.http.middlewares.error-pages-middleware.errors.service: error-pages-service
      traefik.http.middlewares.error-pages-middleware.errors.query: /{status}.html
      # define service properties
      traefik.http.services.error-pages-service.loadbalancer.server.port: 8080
volumes:
  adguard-dns-companion-data:
networks:
  network_internal:
    external: true
  internal:
    driver: bridge
