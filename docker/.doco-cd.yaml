# yaml-language-server: $schema=https://doco.cd/latest/schemas/deploy.schema.json
name: doco-cd
reference: main
working_dir: ./docker/.doco-cd
compose_files:
  - compose.yaml
force_recreate: true
timeout: 120
---
# yaml-language-server: $schema=https://doco.cd/latest/schemas/deploy.schema.json
name: seb
working_dir: ./docker/seb/apps
auto_discovery:
  enabled: true
  depth: 0
  delete: true
env_files:
  - ../../../../secrets.enc.env
  - ../../../../base.enc.env
force_recreate: true
reconciliation:
  enabled: true
---
# yaml-language-server: $schema=https://doco.cd/latest/schemas/deploy.schema.json
name: nas
context: nas
working_dir: ./docker/nas/apps
auto_discovery:
  enabled: true
  depth: 0
  delete: true
env_files:
  - ../../../secrets.enc.env
  - ../../../base.enc.env
force_recreate: true
reconciliation:
  enabled: true
