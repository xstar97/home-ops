apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 1h
  releaseName: longhorn
  chart:
    spec:
      chart: longhorn
      version: 1.13.0
      sourceRef:
        kind: HelmRepository
        name: home-ops-mirror
        namespace: flux-system
  values:
    gatus:
      group: core
    defaultSettings:
      # Matches the Talos UserVolumeConfig named longhorn.
      defaultDataPath: /var/mnt/longhorn
      # Increase to 3 for a multi-node cluster
      defaultReplicaCount: "1"
      # Overprovisioning might be needed when using volsync
      storageOverProvisioningPercentage: "100000"
      # Automatically upgrade volume engines after a Longhorn upgrade,
      # so old engine images can be cleaned up
      concurrentAutomaticEngineUpgradePerNodeLimit: "3"
      # v2DataEngine: true
    persistence:
      # Set to false to pick another CSI as default
      defaultClass: true
      # Increase to 3 for a multi-node cluster
      defaultClassReplicaCount: "1"
    csi:
      # Increase to 3 for a multi-node cluster
      attacherReplicaCount: "1"
      # Increase to 3 for a multi-node cluster
      provisionerReplicaCount: "1"
      # Increase to 3 for a multi-node cluster
      resizerReplicaCount: "1"
      # Increase to 3 for a multi-node cluster
      snapshotterReplicaCount: "1"
    longhornUI:
      # Increase to 2 for a multi-node cluster
      replicas: "1"
    longhornGlobalManager:
      # Increase to 3 for a multi-node cluster
      replicas: "1"

    ingress:
      enabled: true
      ingressClassName: internal
      host: longhorn.${DOMAIN_2}    
      annotations:       
        nginx.ingress.kubernetes.io/auth-method: 'GET'
        nginx.ingress.kubernetes.io/auth-url: "http://authelia.authelia.svc.cluster.local:9091/api/verify"
        nginx.ingress.kubernetes.io/auth-signin: 'https://auth.${DOMAIN_2}/?rm=$request_method'
        nginx.ingress.kubernetes.io/auth-response-headers: 'Remote-User,Remote-Name,Remote-Groups,Remote-Email'
        cert-manager.io/cluster-issuer: general-le-prod
        cert-manager.io/private-key-rotation-policy: Always
      path: /
      pathType: ImplementationSpecific
      tls: true
      tlsSecret: longhorn-tls
