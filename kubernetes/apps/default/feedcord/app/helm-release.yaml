---
# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/websites/refs/heads/main/truecharts/public/schemas/helm-release/32.8.5.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: feedcord
  namespace: feedcord
spec:
  interval: 1h
  chart:
    spec:
      chart: feedcord
      version: 3.1.4
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    global:
      stopAll: false
    feedcord:
      Instances:
        - Id: Awesome SelfHosted News Feed
          YoutubeUrls:
            - ""
          RssUrls:
            - "https://www.trackawesomelist.com/awesome-selfhosted/awesome-selfhosted/rss.xml"
          Forum: false
          DiscordWebhookUrl: ${FEEDCORD_AWESOME_SELF_HOSTED_WEBHOOK_DISCORD}
          RssCheckIntervalMinutes: 60
          EnableAutoRemove: false
          Color: 8411391
          DescriptionLimit: 250
          MarkdownFormat: true
          PersistenceOnShutdown: true
        - Id: Selfh News Feed
          YoutubeUrls:
            - ""
          RssUrls:
            - "https://selfh.st/rss/"
          Forum: false
          DiscordWebhookUrl: ${FEEDCORD_AWESOME_SELF_HOSTED_WEBHOOK_DISCORD}
          RssCheckIntervalMinutes: 60
          EnableAutoRemove: false
          Color: 8411391
          DescriptionLimit: 250
          MarkdownFormat: true
          PersistenceOnShutdown: true
      ConcurrentRequests: 60
