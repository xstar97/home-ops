---
# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/websites/refs/heads/main/truecharts/public/schemas/helm-release/32.8.5.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate-config-debugger
  namespace: renovate-config-debugger
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: 21.3.8
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    gatus:
      group: core
    global:
      stopAll: false

    image:
      repository: ghcr.io/secustor/renovate-config-debugger
      pullPolicy: IfNotPresent
      tag: 0.4.6@sha256:f70ae6660c8ba5e08ba479411c482803d982265a34360bab3211f3e9dcb65563

    securityContext:
      container:
        readOnlyRootFilesystem: false
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0

    service:
      main:
        enabled: true
        type: ClusterIP
        ports:
          main:
            enabled: true
            port: 80

    ingress:
      main:
        enabled: true
        ingressClassName: "internal"
        hosts:
          - host: debugger.renovate.${DOMAIN_2}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          nginx:
            enabled: true
          certManager:
            enabled: true
            certificateIssuer: general-le-prod
