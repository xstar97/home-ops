apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: renovate-config-debugger
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 10m
  timeout: 10m
  path: kubernetes/apps/default/renovate-config-debugger/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
