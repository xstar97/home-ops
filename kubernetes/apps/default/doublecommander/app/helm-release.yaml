---
# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/websites/refs/heads/main/truecharts/public/schemas/helm-release/32.8.5.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: doublecommander
  namespace: doublecommander
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: 21.3.8
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    gatus:
      group: tools
    global:
      stopAll: false
    securityContext:
      container:
        readOnlyRootFilesystem: false
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
    image:
      repository: ghcr.io/linuxserver/doublecommander
      pullPolicy: IfNotPresent
      tag: latest@sha256:f25b7432b32ebecc06e26aa657c69a4d0f132fd39d4808653946402313ef9ba2
    service:
      main:
        type: ClusterIP
        ports:
          main:
            port: 3000
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                CUSTOM_PORT: "{{ .Values.service.main.ports.main.port }}"
                DISABLE_IPV6: true
                NO_DECOR: true
    ingress:
      main:
        enabled: true
        ingressClassName: "internal"
        integrations:
          nginx:
            enabled: true
          certManager:
            enabled: true
            certificateIssuer: general-le-prod
        hosts:
          - host: dc.${DOMAIN_2}
            paths:
              - path: /
                pathType: Prefix
    persistence:
      config:
        enabled: true
        mountPath: "/config"
      media:
        enabled: true
        type: nfs
        server: ${SCALE_IP}
        path: ${MEDIA_NFS}
        mountPath: "/data/media"
      downloads:
        enabled: true
        type: nfs
        server: ${SCALE_IP}
        path: ${DOWNLOADS_NFS}
        mountPath: "/data/downloads"
      documents:
        enabled: true
        type: nfs
        server: ${SCALE_IP}
        path: ${DOCS_NFS}
        mountPath: "/data/documents"
