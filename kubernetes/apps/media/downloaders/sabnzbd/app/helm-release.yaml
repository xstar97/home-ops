---
# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/websites/refs/heads/main/truecharts/public/schemas/helm-release/32.8.5.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sabnzbd
  namespace: sabnzbd
spec:
  interval: 1h
  chart:
    spec:
      chart: sabnzbd
      version: 27.1.5
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    gatus:
      group: media-downloaders
    global:
      stopAll: false
    # securityContext:
    #   readOnlyRootFilesystem: false
    credentials:
      cf-restic:
        bucket: "${CF_S3_RESTIC_BUCKET}-sabnzbd"
      rfs-restic:
        bucket: "${RUSTFS_S3_RESTIC_BUCKET}-sabnzbd"
    # image:
    #   repository: ghcr.io/home-operations/sabnzbd
    #   pullPolicy: IfNotPresent
    #   tag: 5.1.3@sha256:c89b0322721c3eba47221e5f916505e7e742684651f73c5215717340b6b5402f
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                SABNZBD__HOST_WHITELIST_ENTRIES: "sabd.${DOMAIN_2}"
                # SABNZBD__PORT: "{{ .Values.service.main.ports.main.port }}"
            exportarr:
              env:
                URL: http://sabnzbd.sabnzbd.svc.cluster.local:10097
    ingress:
      main:
        enabled: true
        ingressClassName: "internal"
        hosts:
          - host: sabd.${DOMAIN_2}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          nginx:
            enabled: true
          homepage:
            enabled: true
            group: "Media Downloads"
            widget:
              custom:
                url: http://sabnzbd.sabnzbd.svc.cluster.local:10097
                key: "${SAB_KEY}"
          certManager:
            enabled: true
            certificateIssuer: general-le-prod
    persistence:
      config:
        volsync:
          - name: config
            type: restic
            credentials: cf-restic
            dest:
              enabled: true
            src:
              enabled: true
      downloads:
        enabled: true
        type: nfs
        server: ${SCALE_IP}
        path: ${DOWNLOADS_NFS}
        mountPath: "${DOWNLOADS_LOCAL}"
    exportarr:
      # Required for exportarr
      apiKey: "${SAB_KEY}"    
    metrics:
      main:
        enabled: true
