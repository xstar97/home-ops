---
# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/websites/refs/heads/main/truecharts/public/schemas/helm-release/32.8.5.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wallos
  namespace: wallos
spec:
  interval: 1h
  chart:
    spec:
      chart: wallos
      version: 12.3.4
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    gatus:
      group: financial
    global:
      stopAll: false
    credentials:
      cf-restic:
        bucket: "${CF_S3_RESTIC_BUCKET}-wallos"
      rfs-restic:
        bucket: "${RUSTFS_S3_RESTIC_BUCKET}-wallos"
    service:
      main:
        type: ClusterIP
        ports:
          main:
            port: 80
    ingress:
      main:
        enabled: true
        ingressClassName: "internal"
        hosts:
          - host: wallos.${DOMAIN_2}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          nginx:
            enabled: true
          homepage:
            enabled: true
            group: Monitoring
            widget:
              url: "http://wallos.wallos.svc.cluster.local:80"
              custom:
                key: ${HP_WALLOS_API_KEY}
          certManager:
            enabled: true
            certificateIssuer: general-le-prod
    persistence:
      database:
        volsync:
          - name: database
            type: restic
            credentials: cf-restic
            dest:
              enabled: true
            src:
              enabled: true
      logos:
        volsync:
          - name: logos
            type: restic
            credentials: cf-restic
            dest:
              enabled: true
            src:
              enabled: true
