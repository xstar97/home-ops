apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: speedtest-tracker
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 10m
  timeout: 10m
  path: kubernetes/apps/observability/speedtest-tracker/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
