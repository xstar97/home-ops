---
# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/websites/refs/heads/main/truecharts/public/schemas/helm-release/32.8.5.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: phpmyadmin
  namespace: minecraft
spec:
  interval: 1h
  chart:
    spec:
      chart: phpmyadmin
      version: 10.1.8
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    gatus:
      group: games-minecraft
    global:
      stopAll: true

    ingress:
      main:
        enabled: true
        ingressClassName: "internal"
        hosts:
          - host: phpmyadmin.mc.${DOMAIN_2}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          nginx:
            enabled: true
          certManager:
            enabled: true
            certificateIssuer: general-le-prod

    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                MYSQL_PASSWORD: PLACEHOLDERPASSWORD
                MYSQL_USER: bluemap
                PMA_HOST: minecraft-bluemap-mariadb.minecraft.svc.cluster.local
                PMA_PORT: "3306"
