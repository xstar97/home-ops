apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: minecraft-phpmyadmin
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 10m
  timeout: 10m
  path: kubernetes/apps/games/minecraft/minecraft-phpmyadmin/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
