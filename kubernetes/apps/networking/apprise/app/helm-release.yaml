---
# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/websites/refs/heads/main/truecharts/public/schemas/helm-release/32.8.5.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: apprise
  namespace: apprise
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: 21.3.8
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    gatus:
      group: networking
    global:
      stopAll: false
    credentials:
      cf-restic:
        bucket: "${CF_S3_RESTIC_BUCKET}-apprise"
      rfs-restic:
        bucket: "${RUSTFS_S3_RESTIC_BUCKET}-apprise"
    image:
      repository: caronc/apprise
      pullPolicy: IfNotPresent
      tag: 2.2.0@sha256:8a7654c329ce3821848b8052ba915bcf5a3e02dd3ce817c8fa1427fb60bdeae7
    service:
      main:
        ports:
          main:
            port: 8000
            
    workload:
      main:
        podSpec:
          containers:
            main:
              probes:
                liveness:
                  enabled: false
                  type: exec
                  command:
                    - sh
                    - -c
                    - 'wget'
                    - '--quiet'
                    - '--tries=1'
                    - '--spider'
                    - '{{ printf "http://%v:%v/health" (include "tc.v1.common.lib.chart.names.fullname" $) .Values.service.main.ports.main.port }}'
                readiness:
                  enabled: false
                  type: exec
                  command:
                    - sh
                    - -c
                    - 'wget'
                    - '--quiet'
                    - '--tries=1'
                    - '--spider'
                    - '{{ printf "http://%v:%v/health" (include "tc.v1.common.lib.chart.names.fullname" $) .Values.service.main.ports.main.port }}'
                # -- Startup probe configuration
                # @default -- See below
                startup:
                  # -- Enable the startup probe
                  enabled: false
                  type: exec
                  command:
                    - sh
                    - -c
                    - 'wget'
                    - '--quiet'
                    - '--tries=1'
                    - '--spider'
                    - '{{ printf "http://%v:%v/health" (include "tc.v1.common.lib.chart.names.fullname" $) .Values.service.main.ports.main.port }}'
              env:
                APPRISE_CONFIG_DIR: "{{.Values.persistence.config.mountPath }}"
                APPRISE_ATTACH_DIR: "{{.Values.persistence.attach.mountPath }}"
                APPRISE_PLUGIN_PATHS: "{{.Values.persistence.plugin.mountPath }}"
                APPRISE_WORKER_COUNT: 1
                
    ingress:
      main:
        enabled: false
        ingressClassName: "internal"
        hosts:
          - host: apprise.${DOMAIN_2}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          nginx:
            enabled: true
          certManager:
            enabled: true
            certificateIssuer: general-le-prod

    persistence:
      config:
        enabled: true
        mountPath: "/config"
        volsync:
          - name: config
            type: restic
            credentials: cf-restic
            dest:
              enabled: true
            src:
              enabled: true
      attach:
        enabled: true
        mountPath: "/attach"
        volsync:
          - name: attach
            type: restic
            credentials: cf-restic
            dest:
              enabled: true
            src:
              enabled: true
      plugin:
        enabled: true
        mountPath: "/plugin"
        volsync:
          - name: plugin
            type: restic
            credentials: cf-restic
            dest:
              enabled: true
            src:
              enabled: true
