---
# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/websites/refs/heads/main/truecharts/public/schemas/helm-release/32.8.5.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  interval: 1h
  chart:
    spec:
      chart: cloudflared
      version: 17.2.2
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    global:
      stopAll: false
    service:
      metrics:
        enabled: true
        primary: true
        type: ClusterIP
        ports:
          metrics:
            enabled: true
            primary: true
            port: 9101
    workload:
      main:
        podSpec:
          containers:
            main:
              probes:
                liveness:
                  enabled: false
                  type: http
                  path: /metrics
                  port: "{{ .Values.service.metrics.ports.metrics.port }}"

                readiness:
                  enabled: false
                  type: http
                  path: /metrics
                  port: "{{ .Values.service.metrics.ports.metrics.port }}"
                startup:
                  enabled: false
                  type: tcp
                  port: "{{ .Values.service.metrics.ports.metrics.port }}"
              env:
                TUNNEL_TOKEN: "${CLOUDFLARED_TUNNEL_TALOS}"
                TUNNEL_METRICS: "0.0.0.0:{{ .Values.service.metrics.ports.metrics.port }}"
